---
version: 0.2.0
slug: voice_call
name: Voice Call
description: Voice satellites with your own commands, recognized on this machine
url: https://github.com/OHF-Voice/apps-experimental/tree/master/voice_call
arch:
  - amd64
  - aarch64
init: false
homeassistant_api: true
# mDNS discovery of satellites, and connecting to them.
host_network: true
ingress: true
# /config: custom wake words (wake_words/), reachable from the Samba and file
# editor apps as addon_configs/<slug>_voice_call.
map:
  - addon_config:rw
ingress_port: 8099
panel_icon: mdi:account-voice
panel_title: Voice Call
options:
  language: en
  speaker_threshold: 0.45
  silence_seconds: 1.0
  debug_logging: false
schema:
  language: list(en)
  wake_cutoff: float(0.05,1)?
  speaker_threshold: float(0,1)
  silence_seconds: float(0.3,5)
  debug_logging: bool
homeassistant: 2025.10.0
