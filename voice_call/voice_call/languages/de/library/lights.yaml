# Lights and switches (German), as the English library's lights.yaml.
title: Lights and switches
icon: mdi:lightbulb-outline

# What the versions add to a command (merged into them with <<).
shared:
  device: &device
    names:
      entity: {count: 1, domains: [light, switch, fan, media_player, input_boolean, climate]}
      area: {count: 1}
    # A room with the device picks it out: the one of that name there.
    combinations: [[entity], [entity, area]]
  place: &place
    names:
      area: {count: 1}
      floor: {count: 1}
    combinations: [[area], [floor]]
    needs:
      - Add names for the areas and floors it may act in (Names page).

commands:
  # Lights here, in an area or on a floor named, or a device by name.
  turn_on:
    title: Turn on
    icon: mdi:lightbulb-on-outline
    description: das Licht einschalten
    require: [[licht, lichter, lampe, lampen, beleuchtung], [ein, an, einschalten, anschalten, anmachen]]
    optional: [[schalte, schalt, mach, mache], [alle]]
    intent:
      name: HassTurnOn
      slots: {domain: light}
    verbosity: beep
    response:
      done:
        brief: Licht eingeschaltet.
        specific: Licht {{ place.said }} eingeschaltet.
        verbose: >-
          {%- set ns = namespace(names=result.names or []) -%}
          {%- set n = ns.names | count -%}
          {%- if n == 0 or n > 4 -%}
          {{ (n ~ ' Lichter') if n else 'Licht' }} {{ place.said }} eingeschaltet.
          {%- else -%}
          {{ (ns.names[:-1] | join(', ') ~ ' und ' ~ ns.names[-1]) if n > 1 else ns.names[0] }} {{ place.said }} eingeschaltet.
          {%- endif -%}
    variants:
      here:
        title: Turn on the lights in this satellite's area
        needs:
          - The lights added to the satellite's area (Names page) are the ones it
            turns on.
      device:
        <<: *device
        title: Turn on a device by name
        icon: mdi:toggle-switch-outline
        description: ein Gerät einschalten
        require: [[ein, an, einschalten, anschalten, anmachen]]
        intent: HassTurnOn
        response:
          done:
            brief: Eingeschaltet.
            specific: "{{ names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) }} eingeschaltet."
            verbose: "{{ names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) }} {{ place.said }} eingeschaltet."
        needs:
          - Add names for the devices it may turn on (Names page).
      place:
        <<: *place
        title: Turn on the lights in an area or floor

  turn_off:
    title: Turn off
    icon: mdi:lightbulb-off-outline
    description: das Licht ausschalten
    require: [[licht, lichter, lampe, lampen, beleuchtung], [aus, ausschalten, ausmachen, abschalten]]
    optional: [[schalte, schalt, mach, mache], [alle], [überall]]
    intent:
      name: HassTurnOff
      slots: {domain: light}
    verbosity: beep
    response:
      done:
        brief: Licht ausgeschaltet.
        specific: Licht {{ place.said }} ausgeschaltet.
        verbose: >-
          {%- set ns = namespace(names=result.names or []) -%}
          {%- set n = ns.names | count -%}
          {%- if n == 0 or n > 4 -%}
          {{ (n ~ ' Lichter') if n else 'Licht' }} {{ place.said }} ausgeschaltet.
          {%- else -%}
          {{ (ns.names[:-1] | join(', ') ~ ' und ' ~ ns.names[-1]) if n > 1 else ns.names[0] }} {{ place.said }} ausgeschaltet.
          {%- endif -%}
    variants:
      here:
        title: Turn off the lights in this satellite's area
        needs:
          - The lights added to the satellite's area (Names page) are the ones it
            turns off.
      device:
        <<: *device
        title: Turn off a device by name
        icon: mdi:toggle-switch-off-outline
        description: ein Gerät ausschalten
        require: [[aus, ausschalten, ausmachen, abschalten]]
        optional: [[schalte, schalt, mach, mache]]
        intent: HassTurnOff
        response:
          done:
            brief: Ausgeschaltet.
            specific: "{{ names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) }} ausgeschaltet."
            verbose: "{{ names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) }} {{ place.said }} ausgeschaltet."
        needs:
          - Add names for the devices it may turn off (Names page).
      place:
        <<: *place
        title: Turn off the lights in an area or floor

  any_lights_on:
    title: Are any lights on
    icon: mdi:lightbulb-question
    description: wissen, welche Lichter an sind
    # No example sentences: one said word for word carries no area or floor.
    require: [[ist, sind, brennt, brennen], [licht, lichter, lampe, lampen], [an, eingeschaltet, ein]]
    optional: [[noch], [irgendein, irgendwo]]
    exclude: [schalte, schalt, mach, mache]
    response: >-
      {%- set named = slots.area or slots.floor -%}
      {%- set ns = namespace(areas=slots.area or [], on=[]) -%}
      {%- for f in slots.floor or [] -%}
      {%- set ns.areas = ns.areas + (floor_areas(f) | list) -%}
      {%- endfor -%}
      {%- if not named and satellite.area_id -%}
      {%- set ns.areas = [satellite.area_id] -%}
      {%- endif -%}
      {%- set where = (' ' ~ place.said) if place.said else '' -%}
      {%- for s in states.light if s.entity_id in devices and (not ns.areas or devices[s.entity_id] in ns.areas) and s.state == 'on' -%}
      {%- set ns.on = ns.on + [names.get(s.entity_id, s.name)] -%}
      {%- endfor -%}
      {%- set count = ns.on | count -%}
      {%- if count == 0 -%}
      Nein, die Lichter{{ where }} sind aus.
      {%- elif count > 3 -%}
      Ja, {{ count }} Lichter{{ where }} sind an.
      {%- else -%}
      Ja, {{ (ns.on[:-1] | join(', ') ~ ' und ' ~ ns.on[-1]) if count > 1 else ns.on[0] }}
      {{- ' ist' if count == 1 else ' sind' }} an.
      {%- endif -%}
    variants:
      here:
        title: Are any lights on in this satellite's area
        needs:
          - The satellite's area (set on its page) is the one it asks about.
      device:
        <<: *device
        title: Is a device on, by name
        icon: mdi:toggle-switch-outline
        description: wissen, ob ein Gerät an ist
        require: [[ist, sind]]
        optional: [[noch]]
        names:
          entity: {count: 1, domains: [light, switch, fan, input_boolean]}
          area: {count: 1}
        lists:
          asked: {list: on_off}
        combinations: [[entity, asked], [entity, area, asked]]
        response: >-
          {%- set e = slots.entity[0] -%}
          {%- set state = states(e) -%}
          {%- set words = {'on': 'an', 'off': 'aus', 'unavailable': 'nicht erreichbar', 'unknown': 'unbekannt'} -%}
          {%- set said = names.get(e, state_attr(e, 'friendly_name')) ~ ' ist ' ~ words.get(state, state) ~ '.' -%}
          {%- if state in ['on', 'off'] -%}
          {{ 'Ja' if state == slots.asked else 'Nein' }}, {{ said }}
          {%- else -%}
          {{ said }}
          {%- endif -%}
        needs:
          - Add names for the lights and switches it may ask about (Names page).
      place:
        <<: *place
        title: Are any lights on in an area or floor

  set_brightness:
    title: Set the brightness
    icon: mdi:brightness-6
    description: die Helligkeit einstellen
    supports: brightness
    require: [[helligkeit, prozent]]
    optional: [[stelle, stell, setze, setz, mach, mache, dimme, dimm], [licht, lichter, lampe, lampen], [auf], [helligkeit], [prozent]]
    exclude: [lautstärke]
    number: percentage
    intent:
      name: HassLightSet
      slots: {brightness: "{{ slots.percentage }}"}
    verbosity: beep
    response:
      done:
        brief: Helligkeit eingestellt.
        specific: >-
          {{ names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) if slots.entity
          else 'Licht ' ~ place.said }} auf {{ slots.percentage }} Prozent gestellt.
    variants:
      here:
        title: Set the brightness in this satellite's area
      device:
        <<: *device
        title: Set the brightness of a light by name
        names:
          entity: {count: 1, domains: [light]}
          area: {count: 1}
        combinations: [[entity, percentage], [entity, area, percentage]]
        needs:
          - Add names for the lights it may dim (Names page).
      place:
        <<: *place
        title: Set the brightness in an area or floor
        combinations: [[area, percentage], [floor, percentage]]

  light_color:
    title: Set the light color
    icon: mdi:format-color-fill
    description: die Lichtfarbe ändern
    supports: color
    require: [[mach, mache, stelle, stell, setze, setz, färbe, färb], [licht, lichter, lampe, lampen]]
    optional: [[farbe], [auf, in]]
    lists:
      color: {list: colors}
    intent:
      name: HassLightSet
      slots: {color: "{{ slots.color }}"}
    verbosity: beep
    response:
      done:
        brief: Farbe geändert.
        specific: >-
          {%- set farben = {'red': 'rot', 'orange': 'orange', 'yellow': 'gelb', 'green': 'grün',
            'blue': 'blau', 'purple': 'lila', 'pink': 'rosa', 'white': 'weiß', 'turquoise': 'türkis', 'magenta': 'magenta'} -%}
          {{ names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) if slots.entity
          else 'Licht ' ~ place.said }} ist jetzt {{ farben.get(slots.color, slots.color) }}.
    variants:
      here:
        title: Set the light color in this satellite's area
      device:
        <<: *device
        title: Set the color of a light by name
        require: [[mach, mache, stelle, stell, setze, setz, färbe, färb]]
        names:
          entity: {count: 1, domains: [light]}
          area: {count: 1}
        combinations: [[entity, color], [entity, area, color]]
        needs:
          - Add names for the lights it may color (Names page).
      place:
        <<: *place
        title: Set the light color in an area or floor
        combinations: [[area, color], [floor, color]]
