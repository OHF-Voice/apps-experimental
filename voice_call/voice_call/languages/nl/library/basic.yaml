# Voorbeeldopdrachten voor de bibliotheek van de webinterface (Dutch), as the
# English library (voice_call/languages/en/library/basic.yaml): titles and
# needs are the UI's, in English; descriptions are said in hints ("Je wilde
# zeker <description>, ..."), so each is what one wants to do: "het licht
# aandoen".
#
# Keywords are lowercase, separable verbs by their parts ("doe het licht
# aan": "licht" + "aan"; "schakel ... in"). Articles and "in", "op" are filler
# (the language pack's), and a room may be joined to what is in it
# ("keukenlamp": compounds).
title: Basics
icon: mdi:home-outline

# What the versions add to a command (merged into them with <<).
shared:
  device: &device
    names:
      entity: {count: 1, domains: [light, switch, fan, media_player, input_boolean, climate]}
      area: {count: 1}
    # A room with the device picks it out: the one of that name there.
    combinations: [[entity], [entity, area]]
  place: &place
    names:
      area: {count: 1}
      floor: {count: 1}
    combinations: [[area], [floor]]
    needs:
      - Add names for the areas and floors it may act in (Names page).

commands:
  what_time:
    title: What time is it
    icon: mdi:clock-outline
    description: weten hoe laat het is
    examples: ["hoe laat is het [nu]"]
    require: [[hoe laat, tijd]]
    optional: [[is het], [nu], [wat is de]]
    # Other times: "hoe laat gaat de winkel open", "hoe laat is het in Tokio".
    exclude: [gaat, open, dicht, sluit, na, voor, tot, in]
    response: "Het is {{ now().hour }} uur{{ (' ' ~ now().minute) if now().minute else '' }}."

  what_date:
    title: What's the date
    icon: mdi:calendar-today
    description: de datum weten
    examples: ["welke dag is het [vandaag]", "wat is de datum [vandaag]", "welke datum is het"]
    require: [[datum, welke dag]]
    optional: [[wat is de], [is het], [vandaag]]
    response: >-
      {%- set dagen = ['maandag', 'dinsdag', 'woensdag', 'donderdag', 'vrijdag', 'zaterdag', 'zondag'] -%}
      {%- set maanden = ['januari', 'februari', 'maart', 'april', 'mei', 'juni', 'juli', 'augustus',
        'september', 'oktober', 'november', 'december'] -%}
      Vandaag is het {{ dagen[now().weekday()] }} {{ now().day }} {{ maanden[now().month - 1] }}.

  never_mind:
    title: Never mind
    icon: mdi:close-circle-outline
    description: niets doen
    # Said whole only: "annuleer de timer" is the timer's.
    examples: [laat maar, laat maar zitten, vergeet het, annuleer, niets, niks]

  # Lights here, in an area or on a floor named, or a device by name.
  turn_on:
    title: Turn on
    icon: mdi:lightbulb-on-outline
    description: het licht aandoen
    require: [[licht, lichten, lamp, lampen, verlichting], [aan, aandoen, aanzetten, inschakelen, schakel ... in]]
    optional: [[zet, doe, maak], [alle]]
    exclude: [uit, uitdoen, uitzetten, uitschakelen]
    intent:
      name: HassTurnOn
      slots: {domain: light}
    verbosity: beep
    response:
      done:
        brief: Licht aan.
        specific: Licht {{ place.said }} aan.
        verbose: >-
          {%- set ns = namespace(names=result.names or []) -%}
          {%- set n = ns.names | count -%}
          {%- if n == 0 or n > 4 -%}
          {{ (n ~ ' lampen') if n else 'Licht' }} {{ place.said }} aan.
          {%- else -%}
          {{ (ns.names[:-1] | join(', ') ~ ' en ' ~ ns.names[-1]) if n > 1 else ns.names[0] }} {{ place.said }} aan.
          {%- endif -%}
    variants:
      here:
        title: Turn on the lights in this satellite's area
        needs:
          - The lights in the satellite's area (Satellites page) are the ones it
            turns on.
      device:
        <<: *device
        title: Turn on a device by name
        icon: mdi:toggle-switch-outline
        description: een apparaat aanzetten
        require: [[aan, aandoen, aanzetten, inschakelen, schakel ... in]]
        intent: HassTurnOn
        response:
          done:
            brief: Aangezet.
            specific: "{{ state_attr(slots.entity[0], 'friendly_name') }} aangezet."
            verbose: "{{ state_attr(slots.entity[0], 'friendly_name') }} {{ place.said }} aangezet."
        needs:
          - Add names for the devices it may turn on (Names page).
      place:
        <<: *place
        title: Turn on the lights in an area or floor

  turn_off:
    title: Turn off
    icon: mdi:lightbulb-off-outline
    description: het licht uitdoen
    require: [[licht, lichten, lamp, lampen, verlichting], [uit, uitdoen, uitzetten, uitschakelen]]
    optional: [[zet, doe, maak, schakel], [alle], [overal]]
    exclude: [aan, aandoen, aanzetten, inschakelen]
    intent:
      name: HassTurnOff
      slots: {domain: light}
    verbosity: beep
    response:
      done:
        brief: Licht uit.
        specific: Licht {{ place.said }} uit.
        verbose: >-
          {%- set ns = namespace(names=result.names or []) -%}
          {%- set n = ns.names | count -%}
          {%- if n == 0 or n > 4 -%}
          {{ (n ~ ' lampen') if n else 'Licht' }} {{ place.said }} uit.
          {%- else -%}
          {{ (ns.names[:-1] | join(', ') ~ ' en ' ~ ns.names[-1]) if n > 1 else ns.names[0] }} {{ place.said }} uit.
          {%- endif -%}
    variants:
      here:
        title: Turn off the lights in this satellite's area
        needs:
          - The lights in the satellite's area (Satellites page) are the ones it
            turns off.
      device:
        <<: *device
        title: Turn off a device by name
        icon: mdi:toggle-switch-off-outline
        description: een apparaat uitzetten
        require: [[uit, uitdoen, uitzetten, uitschakelen]]
        optional: [[zet, doe, maak, schakel]]
        intent: HassTurnOff
        response:
          done:
            brief: Uitgezet.
            specific: "{{ state_attr(slots.entity[0], 'friendly_name') }} uitgezet."
            verbose: "{{ state_attr(slots.entity[0], 'friendly_name') }} {{ place.said }} uitgezet."
        needs:
          - Add names for the devices it may turn off (Names page).
      place:
        <<: *place
        title: Turn off the lights in an area or floor

  any_lights_on:
    title: Are any lights on
    icon: mdi:lightbulb-question
    description: weten welke lampen aan zijn
    # No example sentences: one said word for word carries no area or floor.
    require: [[is, zijn, brandt, branden, staat, staan], [licht, lichten, lamp, lampen], [aan]]
    optional: [[er], [nog], [ergens]]
    exclude: [zet, doe, schakel, maak]
    response: >-
      {%- set named = slots.area or slots.floor -%}
      {%- set ns = namespace(areas=slots.area or [], on=[]) -%}
      {%- for f in slots.floor or [] -%}
      {%- set ns.areas = ns.areas + (floor_areas(f) | list) -%}
      {%- endfor -%}
      {%- if not named and satellite.area_id -%}
      {%- set ns.areas = [satellite.area_id] -%}
      {%- endif -%}
      {%- set where = (' ' ~ place.said) if place.said else '' -%}
      {%- for s in states.light if s.entity_id in exposed and (not ns.areas or area_id(s.entity_id) in ns.areas) and s.state == 'on' -%}
      {%- set ns.on = ns.on + [s.name] -%}
      {%- endfor -%}
      {%- set count = ns.on | count -%}
      {%- if count == 0 -%}
      Nee, de lampen{{ where }} zijn uit.
      {%- elif count > 3 -%}
      Ja, {{ count }} lampen{{ where }} zijn aan.
      {%- else -%}
      Ja, {{ (ns.on[:-1] | join(', ') ~ ' en ' ~ ns.on[-1]) if count > 1 else ns.on[0] }}
      {{- ' is' if count == 1 else ' zijn' }} aan.
      {%- endif -%}
    variants:
      here:
        title: Are any lights on in this satellite's area
        needs:
          - The satellite's area (Satellites page) is the one it asks about.
      device:
        <<: *device
        title: Is a device on, by name
        icon: mdi:toggle-switch-outline
        description: weten of een apparaat aan is
        require: [[is, zijn, staat, staan]]
        optional: [[nog]]
        names:
          entity: {count: 1, domains: [light, switch, fan, input_boolean]}
          area: {count: 1}
        lists:
          asked: {list: on_off}
        combinations: [[entity, asked], [entity, area, asked]]
        response: >-
          {%- set e = slots.entity[0] -%}
          {%- set state = states(e) -%}
          {%- set words = {'on': 'aan', 'off': 'uit', 'unavailable': 'niet bereikbaar', 'unknown': 'onbekend'} -%}
          {%- set said = state_attr(e, 'friendly_name') ~ ' is ' ~ words.get(state, state) ~ '.' -%}
          {%- if state in ['on', 'off'] -%}
          {{ 'Ja' if state == slots.asked else 'Nee' }}, {{ said }}
          {%- else -%}
          {{ said }}
          {%- endif -%}
        needs:
          - Add names for the lights and switches it may ask about (Names page).
      place:
        <<: *place
        title: Are any lights on in an area or floor

  set_brightness:
    title: Set the brightness
    icon: mdi:brightness-6
    description: de helderheid instellen
    require: [[helderheid, procent]]
    optional: [[zet, maak, dim, dimmen, verander], [licht, lichten, lamp, lampen], [op], [helderheid], [procent]]
    number: percentage
    intent:
      name: HassLightSet
      slots: {brightness: "{{ slots.percentage }}"}
    verbosity: beep
    response:
      done:
        brief: Helderheid ingesteld.
        specific: >-
          {{ state_attr(slots.entity[0], 'friendly_name') if slots.entity
          else 'Licht ' ~ place.said }} op {{ slots.percentage }} procent gezet.
    variants:
      here:
        title: Set the brightness in this satellite's area
      device:
        <<: *device
        title: Set the brightness of a light by name
        names:
          entity: {count: 1, domains: [light]}
          area: {count: 1}
        combinations: [[entity, percentage], [entity, area, percentage]]
        needs:
          - Add names for the lights it may dim (Names page).
      place:
        <<: *place
        title: Set the brightness in an area or floor
        combinations: [[area, percentage], [floor, percentage]]

  light_color:
    title: Set the light color
    icon: mdi:format-color-fill
    description: de kleur van het licht veranderen
    require: [[maak, zet, kleur, verander], [licht, lichten, lamp, lampen]]
    optional: [[op], [kleur]]
    lists:
      color: {list: colors}
    intent:
      name: HassLightSet
      slots: {color: "{{ slots.color }}"}
    verbosity: beep
    response:
      done:
        brief: Kleur veranderd.
        specific: >-
          {%- set kleuren = {'red': 'rood', 'orange': 'oranje', 'yellow': 'geel', 'green': 'groen',
            'blue': 'blauw', 'purple': 'paars', 'pink': 'roze', 'white': 'wit', 'turquoise': 'turquoise', 'magenta': 'magenta'} -%}
          {{ state_attr(slots.entity[0], 'friendly_name') if slots.entity
          else 'Licht ' ~ place.said }} is nu {{ kleuren.get(slots.color, slots.color) }}.
    variants:
      here:
        title: Set the light color in this satellite's area
      device:
        <<: *device
        title: Set the color of a light by name
        require: [[maak, zet, kleur, verander]]
        names:
          entity: {count: 1, domains: [light]}
          area: {count: 1}
        combinations: [[entity, color], [entity, area, color]]
        needs:
          - Add names for the lights it may color (Names page).
      place:
        <<: *place
        title: Set the light color in an area or floor
        combinations: [[area, color], [floor, color]]

  set_temperature:
    title: Set the temperature
    icon: mdi:thermometer
    description: de temperatuur instellen
    require: [[zet, temperatuur, graden, graad, verwarming]]
    optional: [[zet, draai], [temperatuur, verwarming, thermostaat], [op], [graden, graad]]
    # A question about degrees is not a setting: "hoeveel is 20 graden in
    # Fahrenheit".
    exclude: [wat, hoeveel, hoe, omrekenen, is, zijn]
    number: temperature
    intent:
      name: HassClimateSetTemperature
      slots: {temperature: "{{ slots.temperature }}"}
    # Not seen at once, and a misheard number matters: said.
    verbosity: specific
    response:
      done:
        brief: Temperatuur ingesteld.
        specific: >-
          {{ state_attr(slots.entity[0], 'friendly_name') if slots.entity
          else 'Temperatuur ' ~ place.said }} op {{ slots.temperature | string | replace('.', ',') }} graden gezet.
    variants:
      here:
        title: Set the temperature in this satellite's area
      device:
        <<: *device
        title: Set the temperature of a thermostat by name
        names:
          entity: {count: 1, domains: [climate]}
          area: {count: 1}
        combinations: [[entity, temperature], [entity, area, temperature]]
        needs:
          - Add names for the thermostats it may set (Names page).
      place:
        <<: *place
        title: Set the temperature in an area or floor
        combinations: [[area, temperature], [floor, temperature]]

  weather:
    title: What's the weather
    icon: mdi:weather-partly-cloudy
    description: het weer weten
    examples: ["hoe is het weer [vandaag]", "gaat het [vandaag] regenen", "wat voor weer wordt het"]
    require: [[weer, regenen, weersvoorspelling, voorspelling]]
    home: weather
    response: >-
      {%- set weer = {'clear-night': 'helder', 'cloudy': 'bewolkt', 'exceptional': 'uitzonderlijk',
        'fog': 'mistig', 'hail': 'hagel', 'lightning': 'onweer', 'lightning-rainy': 'onweer met regen',
        'partlycloudy': 'half bewolkt', 'pouring': 'zware regen', 'rainy': 'regenachtig',
        'snowy': 'sneeuw', 'snowy-rainy': 'natte sneeuw', 'sunny': 'zonnig', 'windy': 'winderig',
        'windy-variant': 'winderig en bewolkt'} -%}
      {%- set state = states(slots.entity[0]) -%}
      Het is {{ weer.get(state, state) }} bij
      {{ state_attr(slots.entity[0], 'temperature') | round }} graden.
    needs:
      - Set the home's weather entity on the Settings page, or give it one of its
        own (its implied target).

  shopping_list_add:
    title: Add to the shopping list
    icon: mdi:cart-plus
    description: iets op de boodschappenlijst zetten
    require: [[zet, voeg, schrijf, doe], [boodschappenlijst, boodschappenlijstje]]
    optional: [[op, aan], [toe, erbij]]
    wildcard:
      slot: item
      after: [zet, voeg, schrijf, doe]
      before: [op, aan, toe]
      bounded: true
      max_words: 8
    slots:
      entity: [todo.shopping_list]
    # Several at once, each an item of its own: "oranges and bananas".
    action:
      repeat:
        for_each: >-
          {{ (slots.item | regex_replace('\\s*,\\s*|\\s+(?:en)\\s+', '|', true)).split('|')
          | map('trim') | reject('eq', '') | list }}
        sequence:
          - action: todo.add_item
            target:
              entity_id: "{{ slots.entity }}"
            data:
              item: "{{ repeat.item }}"
    verbosity: specific
    response:
      done:
        brief: Op de boodschappenlijst gezet.
        specific: "{{ slots.item }} staat op de boodschappenlijst."

  shopping_list_remove:
    title: Take off the shopping list
    icon: mdi:cart-minus
    description: iets van de boodschappenlijst halen
    require: [[haal, verwijder, streep], [boodschappenlijst, boodschappenlijstje]]
    optional: [[van, op], [af, door, weg]]
    wildcard:
      slot: item
      after: [haal, verwijder, streep]
      before: [van, door, op]
      bounded: true
      max_words: 5
    slots:
      entity: [todo.shopping_list]
    action:
      action: todo.remove_item
      target:
        entity_id: "{{ slots.entity }}"
      data:
        item: "{{ slots.item }}"
    verbosity: specific
    response:
      done:
        brief: Van de boodschappenlijst gehaald.
        specific: "{{ slots.item }} van de boodschappenlijst gehaald."

  todo_add:
    title: Add to the to-do list
    icon: mdi:format-list-checks
    description: iets op de takenlijst zetten
    require: [[zet, voeg, schrijf], [takenlijst, to do lijst, todolijst]]
    optional: [[op, aan], [toe, erbij]]
    wildcard:
      slot: item
      after: [zet, voeg, schrijf]
      before: [op, aan, toe]
      bounded: true
      max_words: 8
    slots:
      entity: [todo.to_do]
    action:
      action: todo.add_item
      target:
        entity_id: "{{ slots.entity }}"
      data:
        item: "{{ slots.item }}"
    verbosity: specific
    response:
      done:
        brief: Op de takenlijst gezet.
        specific: "{{ slots.item }} staat op de takenlijst."
    needs:
      - Point it at your to-do list (todo.to_do here).

  remind_me:
    title: Remember something
    icon: mdi:note-edit-outline
    description: ergens aan herinnerd worden
    # "Herinner me eraan om de planten water te geven", "herinner me aan de vuilnis".
    require: [[herinner me, herinner mij]]
    optional: [[eraan, aan], [om]]
    wildcard:
      slot: reminder
      after: [om, eraan, aan, herinner me, herinner mij]
      to_end: true
      max_words: 10
    # The speaker's own to-do list, when anyone has one (People page).
    slots:
      entity: [todo.reminders]
    mine: todo_list
    action:
      action: todo.add_item
      target:
        entity_id: "{{ slots.entity }}"
      data:
        item: "{{ slots.reminder }}"
    verbosity: specific
    response:
      done:
        brief: Ik zal je eraan herinneren.
        specific: "Ik herinner je eraan: {{ slots.reminder }}."
    needs:
      - Point it at a to-do list (todo.reminders here). Where someone has a
        to-do list of their own (People page), theirs, and they must be
        recognized.

  scene:
    title: Activate a scene
    icon: mdi:palette
    description: de filmavond starten
    examples: ["[start] [de] filmavond"]
    scene: scene.movie_time
    verbosity: beep
    response:
      done:
        brief: Klaar.
    needs:
      - Take control of it, then pick the scene and say it your way.

  script:
    title: Run a script
    icon: mdi:script-text-outline
    description: welterusten zeggen
    examples: [welterusten, goede nacht]
    script: script.good_night
    response: "{{ result.speech if result and result.speech else 'Welterusten.' }}"
    needs:
      - Take control of it, then pick the script. It gets slots, satellite, speaker and target as variables,
        and anything it returns (stop with response_variable) as result.
