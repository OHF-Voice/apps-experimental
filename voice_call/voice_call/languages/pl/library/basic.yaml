# Przykładowe polecenia do biblioteki interfejsu (Polish), as the English
# library (voice_call/languages/en/library/basic.yaml): titles and needs are
# the UI's, in English; descriptions are said in hints ("Wygląda na to, że
# chcesz <description>, ..."), so each is what one wants to do, in the
# infinitive: "włączyć światło".
#
# Keywords are lowercase with their diacritics, in the forms they are said:
# verbs in the imperative ("włącz", "zgaś") and the infinitive after "możesz"
# ("włączyć"), nouns in the case the verb takes ("lampę", "światła"). The
# prepositions ("w", "na", "do") and politeness ("proszę", "czy możesz") are
# filler (the language pack's); a name is heard in any case ("w łazience" for
# the Łazienka: adapt-ctc's endings).
#
# A response says a device's state after its name, agreeing with it: its
# gender is guessed from the name's first word ("Lampa stojąca włączona",
# "Wentylator włączony", "Radio włączone", "Drzwi wejściowe zablokowane").
title: Basics
icon: mdi:home-outline

# What the versions add to a command (merged into them with <<).
shared:
  device: &device
    names:
      entity: {count: 1, domains: [light, switch, fan, media_player, input_boolean, climate]}
      area: {count: 1}
    # A room with the device picks it out: the one of that name there.
    combinations: [[entity], [entity, area]]
  place: &place
    names:
      area: {count: 1}
      floor: {count: 1}
    combinations: [[area], [floor]]
    needs:
      - Add names for the areas and floors it may act in (Names page).

commands:
  what_time:
    title: What time is it
    icon: mdi:clock-outline
    description: sprawdzić, która jest godzina
    examples: ["która [jest] [teraz] godzina", "jaka jest [teraz] godzina", "podaj godzinę", "powiedz która godzina"]
    require: [[która godzina, która ... godzina, jaka ... godzina, podaj godzinę]]
    optional: [[jest, teraz, mamy], [powiedz, powiedz mi]]
    # Other times: "o której otwierają sklep", "która będzie godzina 45 minut
    # po piętnastej" (that one is answered as a question).
    exclude: [będzie, była, po, przed, otwierają, otwiera, zamykają, zamyka, otwarte, czynne, wschodzi, zachodzi,
              minut, minuty, godziny, godzin]
    # The hour said as Polish says it, its ordinal: "Jest siódma trzydzieści".
    response: >-
      {%- set g = ['zero', 'pierwsza', 'druga', 'trzecia', 'czwarta', 'piąta', 'szósta', 'siódma', 'ósma',
        'dziewiąta', 'dziesiąta', 'jedenasta', 'dwunasta', 'trzynasta', 'czternasta', 'piętnasta', 'szesnasta',
        'siedemnasta', 'osiemnasta', 'dziewiętnasta', 'dwudziesta', 'dwudziesta pierwsza', 'dwudziesta druga',
        'dwudziesta trzecia'] -%}
      {%- set j = ['', 'jeden', 'dwa', 'trzy', 'cztery', 'pięć', 'sześć', 'siedem', 'osiem', 'dziewięć'] -%}
      {%- set n = ['dziesięć', 'jedenaście', 'dwanaście', 'trzynaście', 'czternaście', 'piętnaście', 'szesnaście',
        'siedemnaście', 'osiemnaście', 'dziewiętnaście'] -%}
      {%- set t = ['', '', 'dwadzieścia', 'trzydzieści', 'czterdzieści', 'pięćdziesiąt'] -%}
      {%- set h, m = now().hour, now().minute -%}
      {%- set mm = ('zero ' ~ j[m]) if m < 10 else (n[m - 10] if m < 20 else t[m // 10] ~ ((' ' ~ j[m % 10]) if m % 10 else '')) -%}
      {%- if h == 0 and m == 0 -%}Jest północ.
      {%- else -%}Jest {{ g[h] }}{{ (' ' ~ mm) if m else '' }}.
      {%- endif -%}

  what_date:
    title: What's the date
    icon: mdi:calendar-today
    description: sprawdzić dzisiejszą datę
    examples: ["jaki [jest] [dzisiaj|dziś] dzień", "jaki dzień [jest] [dzisiaj|dziś]", "jaka [jest] [dzisiaj|dziś] data",
               "którego [dzisiaj|dziś] mamy", "który [dzisiaj|dziś] jest"]
    require: [[data, datę, jaki dzień, jaki ... dzień, którego mamy, którego dzisiaj, którego dziś, który dzisiaj, który dziś]]
    optional: [[jest, mamy], [dzisiaj, dziś], [podaj, powiedz, powiedz mi]]
    # A date asked about: "jaki dzień tygodnia wypada 4 lipca", "jaki dzień
    # będzie po środzie" (those are answered as questions).
    exclude: [wypada, wypadnie, wypadł, wypadła, przypada, będzie, był, była, po, przed, ile,
              stycznia, lutego, marca, kwietnia, maja, czerwca, lipca, sierpnia, września, października, listopada, grudnia]
    # The day said as Polish says it, its ordinal: "dwudziesty października".
    response: >-
      {%- set dni = ['poniedziałek', 'wtorek', 'środa', 'czwartek', 'piątek', 'sobota', 'niedziela'] -%}
      {%- set miesiace = ['stycznia', 'lutego', 'marca', 'kwietnia', 'maja', 'czerwca', 'lipca', 'sierpnia',
        'września', 'października', 'listopada', 'grudnia'] -%}
      {%- set o = ['pierwszy', 'drugi', 'trzeci', 'czwarty', 'piąty', 'szósty', 'siódmy', 'ósmy', 'dziewiąty',
        'dziesiąty', 'jedenasty', 'dwunasty', 'trzynasty', 'czternasty', 'piętnasty', 'szesnasty', 'siedemnasty',
        'osiemnasty', 'dziewiętnasty', 'dwudziesty'] -%}
      {%- set d = now().day -%}
      {%- set dzien = o[d - 1] if d <= 20 else ('dwudziesty ' ~ o[d - 21] if d < 30 else ('trzydziesty' if d == 30 else 'trzydziesty pierwszy')) -%}
      Dzisiaj jest {{ dni[now().weekday()] }}, {{ dzien }} {{ miesiace[now().month - 1] }}.

  never_mind:
    title: Never mind
    icon: mdi:close-circle-outline
    description: nic nie robić
    # Said whole only: "anuluj minutnik" is the timer's.
    examples: [nieważne, nie ważne, zapomnij, zapomnij o tym, anuluj, nic, nic nie rób, już nic, nieistotne]

  # Lights here, in an area or on a floor named, or a device by name.
  turn_on:
    title: Turn on
    icon: mdi:lightbulb-on-outline
    description: włączyć światło
    # "zapał": zapal as a speech-to-text often writes it.
    require: [[światło, światła, świateł, lampę, lampy, lampki, oświetlenie], [włącz, włączyć, zapal, zapał, zapalić, zaświeć, zaświecić]]
    optional: [[wszystkie, całe]]
    exclude: [wyłącz, wyłączyć, zgaś, zgasić, kolor, koloru, jasność]
    intent:
      name: HassTurnOn
      slots: {domain: light}
    verbosity: beep
    response:
      done:
        brief: Włączono światło.
        specific: Włączono światło {{ place.said }}.
        verbose: >-
          {%- set ns = namespace(names=result.names or []) -%}
          {%- set n = ns.names | count -%}
          {%- set word = 'światło' if n == 1 else ('światła' if n % 10 in [2, 3, 4] and n % 100 not in [12, 13, 14] else 'świateł') -%}
          {%- if n == 0 or n > 4 -%}
          Włączono {{ (n ~ ' ' ~ word) if n else 'światło' }} {{ place.said }}.
          {%- else -%}
          Włączono: {{ (ns.names[:-1] | join(', ') ~ ' i ' ~ ns.names[-1]) if n > 1 else ns.names[0] }} {{ place.said }}.
          {%- endif -%}
    variants:
      here:
        title: Turn on the lights in this satellite's area
        needs:
          - The lights in the satellite's area (Satellites page) are the ones it
            turns on.
      device:
        <<: *device
        title: Turn on a device by name
        icon: mdi:toggle-switch-outline
        description: włączyć urządzenie
        require: [[włącz, włączyć, zapal, zapalić, uruchom, uruchomić]]
        intent: HassTurnOn
        response:
          done:
            brief: Włączono.
            specific: >-
              {%- set name = state_attr(slots.entity[0], 'friendly_name') or slots.entity[0] -%}
              {%- set w = (name | lower).split(' ')[0] -%}
              {%- set g = 'p' if w in ['drzwi', 'światła', 'rolety', 'żaluzje', 'zasłony', 'okna', 'lampki', 'lampy', 'głośniki']
                else ('f' if w[-1:] == 'a' else ('n' if w[-1:] in ['o', 'e', 'ę'] else ('p' if w[-1:] in ['y', 'i'] else 'm'))) -%}
              {{ name }} włączon{{ {'m': 'y', 'f': 'a', 'n': 'e', 'p': 'e'}[g] }}.
            verbose: >-
              {%- set name = state_attr(slots.entity[0], 'friendly_name') or slots.entity[0] -%}
              {%- set w = (name | lower).split(' ')[0] -%}
              {%- set g = 'p' if w in ['drzwi', 'światła', 'rolety', 'żaluzje', 'zasłony', 'okna', 'lampki', 'lampy', 'głośniki']
                else ('f' if w[-1:] == 'a' else ('n' if w[-1:] in ['o', 'e', 'ę'] else ('p' if w[-1:] in ['y', 'i'] else 'm'))) -%}
              {{ name }} {{ place.said }} włączon{{ {'m': 'y', 'f': 'a', 'n': 'e', 'p': 'e'}[g] }}.
        needs:
          - Add names for the devices it may turn on (Names page).
      place:
        <<: *place
        title: Turn on the lights in an area or floor

  turn_off:
    title: Turn off
    icon: mdi:lightbulb-off-outline
    description: wyłączyć światło
    require: [[światło, światła, świateł, lampę, lampy, lampki, oświetlenie], [wyłącz, wyłączyć, zgaś, zgasić]]
    optional: [[wszystkie, całe], [w całym domu, wszędzie]]
    exclude: [włącz, włączyć, zapal, zapał, zapalić]
    intent:
      name: HassTurnOff
      slots: {domain: light}
    verbosity: beep
    response:
      done:
        brief: Wyłączono światło.
        specific: Wyłączono światło {{ place.said }}.
        verbose: >-
          {%- set ns = namespace(names=result.names or []) -%}
          {%- set n = ns.names | count -%}
          {%- set word = 'światło' if n == 1 else ('światła' if n % 10 in [2, 3, 4] and n % 100 not in [12, 13, 14] else 'świateł') -%}
          {%- if n == 0 or n > 4 -%}
          Wyłączono {{ (n ~ ' ' ~ word) if n else 'światło' }} {{ place.said }}.
          {%- else -%}
          Wyłączono: {{ (ns.names[:-1] | join(', ') ~ ' i ' ~ ns.names[-1]) if n > 1 else ns.names[0] }} {{ place.said }}.
          {%- endif -%}
    variants:
      here:
        title: Turn off the lights in this satellite's area
        needs:
          - The lights in the satellite's area (Satellites page) are the ones it
            turns off.
      device:
        <<: *device
        title: Turn off a device by name
        icon: mdi:toggle-switch-off-outline
        description: wyłączyć urządzenie
        require: [[wyłącz, wyłączyć, zgaś, zgasić]]
        intent: HassTurnOff
        response:
          done:
            brief: Wyłączono.
            specific: >-
              {%- set name = state_attr(slots.entity[0], 'friendly_name') or slots.entity[0] -%}
              {%- set w = (name | lower).split(' ')[0] -%}
              {%- set g = 'p' if w in ['drzwi', 'światła', 'rolety', 'żaluzje', 'zasłony', 'okna', 'lampki', 'lampy', 'głośniki']
                else ('f' if w[-1:] == 'a' else ('n' if w[-1:] in ['o', 'e', 'ę'] else ('p' if w[-1:] in ['y', 'i'] else 'm'))) -%}
              {{ name }} wyłączon{{ {'m': 'y', 'f': 'a', 'n': 'e', 'p': 'e'}[g] }}.
            verbose: >-
              {%- set name = state_attr(slots.entity[0], 'friendly_name') or slots.entity[0] -%}
              {%- set w = (name | lower).split(' ')[0] -%}
              {%- set g = 'p' if w in ['drzwi', 'światła', 'rolety', 'żaluzje', 'zasłony', 'okna', 'lampki', 'lampy', 'głośniki']
                else ('f' if w[-1:] == 'a' else ('n' if w[-1:] in ['o', 'e', 'ę'] else ('p' if w[-1:] in ['y', 'i'] else 'm'))) -%}
              {{ name }} {{ place.said }} wyłączon{{ {'m': 'y', 'f': 'a', 'n': 'e', 'p': 'e'}[g] }}.
        needs:
          - Add names for the devices it may turn off (Names page).
      place:
        <<: *place
        title: Turn off the lights in an area or floor

  any_lights_on:
    title: Are any lights on
    icon: mdi:lightbulb-question
    description: sprawdzić, które światła są włączone
    # No example sentences: one said word for word carries no area or floor.
    require: [[czy, które, jakie], [światło, światła, lampa, lampy, lampki],
              [włączone, włączony, włączona, zapalone, zapalona, pali się, palą się, świeci się, świecą się]]
    optional: [[jest, są, jakieś, któreś, nadal, wciąż, jeszcze]]
    exclude: [włącz, wyłącz, zgaś, zapal]
    response: >-
      {%- set named = slots.area or slots.floor -%}
      {%- set ns = namespace(areas=slots.area or [], on=[]) -%}
      {%- for f in slots.floor or [] -%}
      {%- set ns.areas = ns.areas + (floor_areas(f) | list) -%}
      {%- endfor -%}
      {%- if not named and satellite.area_id -%}
      {%- set ns.areas = [satellite.area_id] -%}
      {%- endif -%}
      {%- set where = (' ' ~ place.said) if place.said else '' -%}
      {%- for s in states.light if s.entity_id in exposed and (not ns.areas or area_id(s.entity_id) in ns.areas) and s.state == 'on' -%}
      {%- set ns.on = ns.on + [s.name] -%}
      {%- endfor -%}
      {%- set count = ns.on | count -%}
      {%- if count == 0 -%}
      Nie, światła{{ where }} są wyłączone.
      {%- elif count > 3 -%}
      Tak,{{ where }} {{ ('są ' ~ count ~ ' włączone światła') if count % 10 in [2, 3, 4] and count % 100 not in [12, 13, 14]
        else ('jest ' ~ count ~ ' włączonych świateł') }}.
      {%- elif count > 1 -%}
      Tak, {{ ns.on[:-1] | join(', ') ~ ' i ' ~ ns.on[-1] }} są włączone.
      {%- else -%}
      {%- set w = (ns.on[0] | lower).split(' ')[0] -%}
      {%- set g = 'p' if w in ['światła', 'lampki', 'lampy'] or w[-1:] in ['y', 'i'] else ('f' if w[-1:] == 'a' else ('n' if w[-1:] in ['o', 'e', 'ę'] else 'm')) -%}
      Tak, {{ ns.on[0] }} {{ 'są' if g == 'p' else 'jest' }} włączon{{ {'m': 'y', 'f': 'a', 'n': 'e', 'p': 'e'}[g] }}.
      {%- endif -%}
    variants:
      here:
        title: Are any lights on in this satellite's area
        needs:
          - The satellite's area (Satellites page) is the one it asks about.
      device:
        <<: *device
        title: Is a device on, by name
        icon: mdi:toggle-switch-outline
        description: sprawdzić, czy urządzenie jest włączone
        require: [[czy, jest, są]]
        optional: [[jest, są, nadal, wciąż, jeszcze]]
        names:
          entity: {count: 1, domains: [light, switch, fan, input_boolean]}
          area: {count: 1}
        lists:
          asked: {list: on_off}
        combinations: [[entity, asked], [entity, area, asked]]
        response: >-
          {%- set e = slots.entity[0] -%}
          {%- set name = state_attr(e, 'friendly_name') or e -%}
          {%- set w = (name | lower).split(' ')[0] -%}
          {%- set g = 'p' if w in ['drzwi', 'światła', 'rolety', 'żaluzje', 'zasłony', 'okna', 'lampki', 'lampy', 'głośniki']
            else ('f' if w[-1:] == 'a' else ('n' if w[-1:] in ['o', 'e', 'ę'] else ('p' if w[-1:] in ['y', 'i'] else 'm'))) -%}
          {%- set end = {'m': 'y', 'f': 'a', 'n': 'e', 'p': 'e'}[g] -%}
          {%- set state = states(e) -%}
          {%- set words = {'on': 'włączon' ~ end, 'off': 'wyłączon' ~ end, 'unavailable': 'niedostępn' ~ end} -%}
          {%- set said = name ~ (' są ' if g == 'p' else ' jest ') ~ words[state] ~ '.' if state in words else name ~ ': stan nieznany.' -%}
          {%- if state in ['on', 'off'] -%}
          {{ 'Tak' if state == slots.asked else 'Nie' }}, {{ said }}
          {%- else -%}
          {{ said }}
          {%- endif -%}
        needs:
          - Add names for the lights and switches it may ask about (Names page).
      place:
        <<: *place
        title: Are any lights on in an area or floor

  set_brightness:
    title: Set the brightness
    icon: mdi:brightness-6
    description: ustawić jasność światła
    require: [[jasność, jasności, procent]]
    optional: [[ustaw, zmień, ściemnij, rozjaśnij, przyciemnij, zmniejsz, zwiększ, daj], [światło, światła, lampę, lampy, oświetlenie],
               [jasność, jasności], [procent]]
    # A question: "ile to jest 15 procent z 80"; the volume: "ustaw głośność na 30 procent".
    exclude: [ile, jaki, jaka, jakie, oblicz, policz, wynosi, jest, głośność, głośności, muzykę, muzyki]
    number: percentage
    intent:
      name: HassLightSet
      slots: {brightness: "{{ slots.percentage }}"}
    verbosity: beep
    response:
      done:
        brief: Ustawiono jasność.
        specific: >-
          {{ (state_attr(slots.entity[0], 'friendly_name') ~ ': jasność ' ~ slots.percentage ~ ' procent.') if slots.entity
          else ('Ustawiono jasność ' ~ place.said ~ ' na ' ~ slots.percentage ~ ' procent.') }}
    variants:
      here:
        title: Set the brightness in this satellite's area
      device:
        <<: *device
        title: Set the brightness of a light by name
        names:
          entity: {count: 1, domains: [light]}
          area: {count: 1}
        combinations: [[entity, percentage], [entity, area, percentage]]
        needs:
          - Add names for the lights it may dim (Names page).
      place:
        <<: *place
        title: Set the brightness in an area or floor
        combinations: [[area, percentage], [floor, percentage]]

  light_color:
    title: Set the light color
    icon: mdi:format-color-fill
    description: zmienić kolor światła
    # "Ustaw światło na niebiesko", "zmień kolor lampy na czerwony".
    require: [[ustaw, zmień, zrób, kolor, koloru, przełącz, daj], [światło, światła, lampę, lampy, lampki, oświetlenie]]
    optional: [[kolor, koloru], [na]]
    lists:
      color: {list: colors}
    intent:
      name: HassLightSet
      slots: {color: "{{ slots.color }}"}
    verbosity: beep
    response:
      done:
        brief: Zmieniono kolor.
        specific: >-
          {%- set kolory = {'red': 'czerwony', 'orange': 'pomarańczowy', 'yellow': 'żółty', 'green': 'zielony',
            'blue': 'niebieski', 'purple': 'fioletowy', 'pink': 'różowy', 'white': 'biały', 'turquoise': 'turkusowy', 'magenta': 'purpurowy'} -%}
          {{ state_attr(slots.entity[0], 'friendly_name') if slots.entity
          else 'Światło ' ~ place.said }} ma teraz kolor {{ kolory.get(slots.color, slots.color) }}.
    variants:
      here:
        title: Set the light color in this satellite's area
      device:
        <<: *device
        title: Set the color of a light by name
        require: [[ustaw, zmień, zrób, kolor, koloru, przełącz, daj]]
        names:
          entity: {count: 1, domains: [light]}
          area: {count: 1}
        combinations: [[entity, color], [entity, area, color]]
        needs:
          - Add names for the lights it may color (Names page).
      place:
        <<: *place
        title: Set the light color in an area or floor
        combinations: [[area, color], [floor, color]]

  set_temperature:
    title: Set the temperature
    icon: mdi:thermometer
    description: ustawić temperaturę
    require: [[temperaturę, temperatura, temperatury, stopni, stopnie, stopień, stopnia, ogrzewanie, ogrzewania]]
    optional: [[ustaw, nastaw, zmień, podnieś, obniż, zwiększ, zmniejsz, podkręć], [temperaturę, termostat, ogrzewanie],
               [stopni, stopnie, stopień, stopnia]]
    # A question about degrees is not a setting: "ile stopni Fahrenheita to
    # 20 stopni Celsjusza", "jaka jest temperatura w salonie".
    exclude: [ile, jaka, jaki, jakie, przelicz, zamień, to, jest, wynosi, fahrenheita, celsjusza, kelwina, kelwinów]
    number: temperature
    intent:
      name: HassClimateSetTemperature
      slots: {temperature: "{{ slots.temperature }}"}
    # Not seen at once, and a misheard number matters: said.
    verbosity: specific
    response:
      done:
        brief: Ustawiono temperaturę.
        specific: >-
          {%- set t = slots.temperature | float -%}
          {%- set n = t | int -%}
          {%- set unit = 'stopnia' if t != n else ('stopień' if n == 1 else ('stopnie' if n % 10 in [2, 3, 4] and n % 100 not in [12, 13, 14] else 'stopni')) -%}
          {%- set said = (n if t == n else t) | string | replace('.', ',') -%}
          {{ (state_attr(slots.entity[0], 'friendly_name') ~ ': temperatura ' ~ said ~ ' ' ~ unit ~ '.') if slots.entity
          else ('Ustawiono temperaturę ' ~ place.said ~ ' na ' ~ said ~ ' ' ~ unit ~ '.') }}
    variants:
      here:
        title: Set the temperature in this satellite's area
      device:
        <<: *device
        title: Set the temperature of a thermostat by name
        names:
          entity: {count: 1, domains: [climate]}
          area: {count: 1}
        combinations: [[entity, temperature], [entity, area, temperature]]
        needs:
          - Add names for the thermostats it may set (Names page).
      place:
        <<: *place
        title: Set the temperature in an area or floor
        combinations: [[area, temperature], [floor, temperature]]

  weather:
    title: What's the weather
    icon: mdi:weather-partly-cloudy
    description: sprawdzić pogodę
    examples: ["jaka jest [dzisiaj|dziś] pogoda", "jaka będzie [dzisiaj|dziś] pogoda", "czy [dzisiaj|dziś] będzie padać",
               "jaka jest prognoza pogody"]
    require: [[pogoda, pogody, pogodę, prognoza, prognozę, padać, deszcz]]
    # Not a timer's time: "ile czasu zostało".
    exclude: [zostało, minutnik, minutniku, ile]
    home: weather
    response: >-
      {%- set pogoda = {'clear-night': 'Jest pogodnie', 'cloudy': 'Jest pochmurno', 'exceptional': 'Pogoda jest wyjątkowa',
        'fog': 'Jest mgła', 'hail': 'Pada grad', 'lightning': 'Jest burza', 'lightning-rainy': 'Jest burza z deszczem',
        'partlycloudy': 'Jest częściowe zachmurzenie', 'pouring': 'Leje deszcz', 'rainy': 'Pada deszcz',
        'snowy': 'Pada śnieg', 'snowy-rainy': 'Pada śnieg z deszczem', 'sunny': 'Jest słonecznie', 'windy': 'Jest wietrznie',
        'windy-variant': 'Jest wietrznie i pochmurno'} -%}
      {%- set state = states(slots.entity[0]) -%}
      {%- set t = state_attr(slots.entity[0], 'temperature') | round | int -%}
      {%- set unit = 'stopień' if t | abs == 1 else ('stopnie' if t | abs % 10 in [2, 3, 4] and t | abs % 100 not in [12, 13, 14] else 'stopni') -%}
      {{ pogoda.get(state, 'Pogoda: ' ~ state) }}, {{ t }} {{ unit }}.
    needs:
      - Set the home's weather entity on the Settings page, or give it one of its
        own (its implied target).

  shopping_list_add:
    title: Add to the shopping list
    icon: mdi:cart-plus
    description: dodać coś do listy zakupów
    require: [[dodaj, dopisz, wpisz, zapisz, dodać, dopisać], [listy zakupów, listę zakupów, lista zakupów, zakupów, listy, listę]]
    optional: [[do, na]]
    wildcard:
      slot: item
      after: [dodaj, dopisz, wpisz, zapisz, dodać, dopisać]
      before: [do, na]
      bounded: true
      max_words: 8
    slots:
      entity: [todo.shopping_list]
    # Several at once, each an item of its own: "oranges and bananas".
    action:
      repeat:
        for_each: >-
          {{ (slots.item | regex_replace('\\s*,\\s*|\\s+(?:i|oraz)\\s+', '|', true)).split('|')
          | map('trim') | reject('eq', '') | list }}
        sequence:
          - action: todo.add_item
            target:
              entity_id: "{{ slots.entity }}"
            data:
              item: "{{ repeat.item }}"
    verbosity: specific
    response:
      done:
        brief: Dodano do listy zakupów.
        specific: "Dodano {{ slots.item }} do listy zakupów."

  shopping_list_remove:
    title: Take off the shopping list
    icon: mdi:cart-minus
    description: usunąć coś z listy zakupów
    require: [[usuń, skreśl, wykreśl, wyrzuć, usunąć, skreślić, wykreślić], [listy zakupów, zakupów, listy]]
    optional: [[z, ze]]
    wildcard:
      slot: item
      after: [usuń, skreśl, wykreśl, wyrzuć, usunąć, skreślić, wykreślić]
      before: [z, ze]
      bounded: true
      max_words: 5
    slots:
      entity: [todo.shopping_list]
    action:
      action: todo.remove_item
      target:
        entity_id: "{{ slots.entity }}"
      data:
        item: "{{ slots.item }}"
    verbosity: specific
    response:
      done:
        brief: Usunięto z listy zakupów.
        specific: "Usunięto {{ slots.item }} z listy zakupów."

  todo_add:
    title: Add to the to-do list
    icon: mdi:format-list-checks
    description: dodać coś do listy zadań
    require: [[dodaj, dopisz, wpisz, zapisz], [listy zadań, listę zadań, lista zadań, zadań, listy rzeczy do zrobienia, rzeczy do zrobienia]]
    optional: [[do, na]]
    wildcard:
      slot: item
      after: [dodaj, dopisz, wpisz, zapisz]
      before: [do, na]
      bounded: true
      max_words: 8
    slots:
      entity: [todo.to_do]
    action:
      action: todo.add_item
      target:
        entity_id: "{{ slots.entity }}"
      data:
        item: "{{ slots.item }}"
    verbosity: specific
    response:
      done:
        brief: Dodano do listy zadań.
        specific: "Dodano {{ slots.item }} do listy zadań."
    needs:
      - Point it at your to-do list (todo.to_do here).

  remind_me:
    title: Remember something
    icon: mdi:note-edit-outline
    description: dodać przypomnienie
    # "Przypomnij mi, żebym zadzwonił do mamy", "przypomnij mi o zakupach",
    # "przypomnij mi kupić chleb".
    require: [[przypomnij, przypomnij mi, przypomnij nam]]
    optional: [[żebym, żeby, abym, o, że]]
    wildcard:
      slot: reminder
      after: [żebym, żeby, abym, o, że, przypomnij, przypomnij mi, przypomnij nam]
      to_end: true
      max_words: 10
    # The speaker's own to-do list, when anyone has one (People page).
    slots:
      entity: [todo.reminders]
    mine: todo_list
    action:
      action: todo.add_item
      target:
        entity_id: "{{ slots.entity }}"
      data:
        item: "{{ slots.reminder }}"
    verbosity: specific
    response:
      done:
        brief: Przypomnę.
        specific: "Przypomnę: {{ slots.reminder }}."
    needs:
      - Point it at a to-do list (todo.reminders here). Where someone has a
        to-do list of their own (People page), theirs, and they must be
        recognized.

  scene:
    title: Activate a scene
    icon: mdi:palette
    description: włączyć tryb kina
    examples: ["[włącz] tryb kina", "[włącz] tryb kinowy", "wieczór filmowy", "czas na film"]
    scene: scene.movie_time
    verbosity: beep
    response:
      done:
        brief: Gotowe.
    needs:
      - Take control of it, then pick the scene and say it your way.

  script:
    title: Run a script
    icon: mdi:script-text-outline
    description: powiedzieć dobranoc
    examples: [dobranoc, dobrej nocy]
    script: script.good_night
    response: "{{ result.speech if result and result.speech else 'Dobranoc.' }}"
    needs:
      - Take control of it, then pick the script. It gets slots, satellite, speaker and target as variables,
        and anything it returns (stop with response_variable) as result.
