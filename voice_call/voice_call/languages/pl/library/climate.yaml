# Climate (Polish), as the English library's climate.yaml.
title: Climate
icon: mdi:thermostat

# What the versions add to a command (merged into them with <<).
shared:
  device: &device
    names:
      entity: {count: 1, domains: [light, switch, fan, media_player, input_boolean, climate]}
      area: {count: 1}
    # A room with the device picks it out: the one of that name there.
    combinations: [[entity], [entity, area]]
  place: &place
    names:
      area: {count: 1}
      floor: {count: 1}
    combinations: [[area], [floor]]
    needs:
      - Add names for the areas and floors it may act in (Names page).

commands:
  set_temperature:
    title: Set the temperature
    icon: mdi:thermometer
    description: ustawić temperaturę
    supports: temperature
    require: [[temperaturę, temperatura, temperatury, stopni, stopnie, stopień, stopnia, ogrzewanie, ogrzewania]]
    optional: [[ustaw, nastaw, zmień, podnieś, obniż, zwiększ, zmniejsz, podkręć], [temperaturę, termostat, ogrzewanie],
               [stopni, stopnie, stopień, stopnia]]
    # A question about degrees is not a setting: "ile stopni Fahrenheita to
    # 20 stopni Celsjusza", "jaka jest temperatura w salonie".
    exclude: [ile, jaka, jaki, jakie, przelicz, zamień, to, jest, wynosi, fahrenheita, celsjusza, kelwina, kelwinów]
    number: temperature
    intent:
      name: HassClimateSetTemperature
      slots: {temperature: "{{ slots.temperature }}"}
    # Not seen at once, and a misheard number matters: said.
    verbosity: specific
    response:
      done:
        brief: Ustawiono temperaturę.
        specific: >-
          {%- set t = slots.temperature | float -%}
          {%- set n = t | int -%}
          {%- set unit = 'stopnia' if t != n else ('stopień' if n == 1 else ('stopnie' if n % 10 in [2, 3, 4] and n % 100 not in [12, 13, 14] else 'stopni')) -%}
          {%- set said = (n if t == n else t) | string | replace('.', ',') -%}
          {{ (state_attr(slots.entity[0], 'friendly_name') ~ ': temperatura ' ~ said ~ ' ' ~ unit ~ '.') if slots.entity
          else ('Ustawiono temperaturę ' ~ place.said ~ ' na ' ~ said ~ ' ' ~ unit ~ '.') }}
    variants:
      here:
        title: Set the temperature in this satellite's area
      device:
        <<: *device
        title: Set the temperature of a thermostat by name
        names:
          entity: {count: 1, domains: [climate]}
          area: {count: 1}
        combinations: [[entity, temperature], [entity, area, temperature]]
        needs:
          - Add names for the thermostats it may set (Names page).
      place:
        <<: *place
        title: Set the temperature in an area or floor
        combinations: [[area, temperature], [floor, temperature]]
