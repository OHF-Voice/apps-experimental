# Music (Spanish), as the English library's music.yaml: on Music Assistant's
# players, in versions for where it plays (the satellite's own player, a
# player by name, the players in an area or on a floor).
#
# "Pon …" searches Music Assistant for what was heard (free text to the end of
# the sentence, spelled from the transducer's transcript) and plays the
# closest match; "el álbum …", "canciones de …", "la lista …", "… de …"
# narrow it (the language's reading). "Pon" also sets timers, lights and
# lists, whose words keep it from being music.
title: Music
icon: mdi:music

# What the versions add to a command (merged into them with <<).
shared:
  player: &player
    names:
      entity: {count: 1, domains: [media_player]}
    combinations: [[entity]]
    needs:
      - Add names for the players it may act on (Names page). A player must be
        a Music Assistant player.
  place: &place
    names:
      area: {count: 1}
      floor: {count: 1}
    combinations: [[area], [floor]]
    needs:
      - Add names for the areas and floors it may act in (Names page). It acts
        on the Music Assistant players there.

commands:
  play_music:
    title: Play music
    icon: mdi:music
    description: poner un artista, un álbum, una canción o una lista
    require: [[pon, ponme, reproduce, reprodúceme, quiero escuchar, escuchar]]
    # Not "play": "qué está sonando", "pon la siguiente canción", "pon algo
    # parecido", "pon un temporizador", "pon la luz en rojo".
    exclude: [siguiente, anterior, sonando, suena, parecida, parecido, parecidas, parecidos, similar, otra vez,
              temporizador, alarma, volumen, por ciento, grados, lista de la compra, lista de tareas, cola]
    optional: [[en, al]]
    wildcard: {slot: query, after: [pon, ponme, reproduce, reprodúceme, quiero escuchar, escuchar], to_end: true, max_words: 8}
    music: play
    verbosity: specific
    variants:
      here:
        title: Play music on this satellite
      device:
        <<: *player
        title: Play music on a different device
        combinations: [[entity, query]]
      place:
        <<: *place
        title: Play music in an area or floor
        combinations: [[area, query], [floor, query]]

  add_to_queue:
    title: Add to the queue
    icon: mdi:playlist-plus
    description: añadir algo a la cola
    require: [[añade, agrega, pon, mete], [cola]]
    optional: [[a, en], [al, del]]
    wildcard: {slot: query, after: [añade, agrega, pon, mete], before: [a, en], bounded: true, max_words: 6}
    music: add
    verbosity: specific
    variants:
      here:
        title: Add to the queue on this satellite
      device:
        <<: *player
        title: Add to the queue on a different device
        combinations: [[entity, query]]
      place:
        <<: *place
        title: Add to the queue in an area or floor
        combinations: [[area, query], [floor, query]]

  play_similar:
    title: Play music like it
    icon: mdi:radio
    description: poner más música como la que suena
    require: [[parecida, parecido, parecidas, parecidos, similar, similares, más como esto, más como esta,
               música como, canciones como, algo como, parecido a, parecida a, similar a]]
    optional: [[pon, ponme, reproduce], [algo, música, canciones, más], [en, al]]
    wildcard: {slot: query, after: [música como, canciones como, algo como, parecido a, parecida a, similar a], to_end: true, max_words: 6}
    music: radio
    verbosity: specific
    # Like what plays there, or like what was said.
    variants:
      here:
        title: Play music like it on this satellite
        examples: ["pon algo parecido", "pon más como esto", "pon música parecida"]
        combinations: [[], [query]]
      device:
        <<: *player
        title: Play music like it on a different device
        combinations: [[entity], [entity, query]]
      place:
        <<: *place
        title: Play music like it in an area or floor
        combinations: [[area], [floor], [area, query], [floor, query]]

  pause_music:
    title: Pause the music
    icon: mdi:pause
    description: pausar la música
    require: [[pausa, pausar, pon ... en pausa]]
    optional: [[música, canción, reproducción], [en, al]]
    exclude: [temporizador, temporizadores, alarma]
    music: pause
    verbosity: beep
    variants:
      here:
        title: Pause the music on this satellite
        examples: ["pausa", "pausa la música", "pon la música en pausa"]
      device:
        <<: *player
        title: Pause the music on a different device
      place:
        <<: *place
        title: Pause the music in an area or floor

  resume_music:
    title: Resume the music
    icon: mdi:play
    description: reanudar la música
    require: [[reanuda, reanudar, continúa, continuar, sigue, seguir, quita la pausa]]
    optional: [[música, reproducción, sonando, reproduciendo], [en, al]]
    exclude: [temporizador, temporizadores, alarma]
    music: resume
    verbosity: beep
    variants:
      here:
        title: Resume the music on this satellite
        examples: ["reanuda la música", "continúa", "quita la pausa", "sigue sonando"]
      device:
        <<: *player
        title: Resume the music on a different device
      place:
        <<: *place
        title: Resume the music in an area or floor

  stop_music:
    title: Stop the music
    icon: mdi:stop
    description: parar la música
    require: [[para, parar, detén, detener, quita, apaga], [música, canción, reproducción]]
    optional: [[en, al]]
    exclude: [temporizador, temporizadores, alarma]
    music: stop
    verbosity: beep
    variants:
      here:
        title: Stop the music on this satellite
      device:
        <<: *player
        title: Stop the music on a different device
      place:
        <<: *place
        title: Stop the music in an area or floor

  next_track:
    title: Next track
    icon: mdi:skip-next
    description: pasar a la siguiente canción
    require: [[siguiente, salta, sáltate, próxima canción, próximo tema]]
    optional: [[canción, tema, pista, esta], [pon, pasa], [en, al]]
    music: next
    verbosity: beep
    variants:
      here:
        title: Next track on this satellite
        examples: ["siguiente [canción]", "salta [esta canción]", "pasa a la siguiente"]
      device:
        <<: *player
        title: Next track on a different device
      place:
        <<: *place
        title: Next track in an area or floor

  previous_track:
    title: Previous track
    icon: mdi:skip-previous
    description: volver a la canción anterior
    require: [[anterior, vuelve atrás, atrás]]
    optional: [[canción, tema, pista], [pon, vuelve, ve], [en, al]]
    music: previous
    verbosity: beep
    variants:
      here:
        title: Previous track on this satellite
        examples: ["canción anterior", "anterior", "vuelve a la anterior", "vuelve atrás"]
      device:
        <<: *player
        title: Previous track on a different device
      place:
        <<: *place
        title: Previous track in an area or floor

  volume_up:
    title: Turn it up
    icon: mdi:volume-plus
    description: subir el volumen
    require: [[más alto, más fuerte, súbele, sube el volumen, sube ... volumen, sube ... música, sube ... sonido]]
    optional: [[un poco, algo], [música, sonido, volumen], [en, al]]
    exclude: [luz, luces, brillo, calefacción, temperatura, persiana, persianas, por ciento]
    music: volume_up
    verbosity: beep
    variants:
      here:
        title: Turn it up on this satellite
        examples: [más alto, sube el volumen, súbele]
      device:
        <<: *player
        title: Turn it up on a different device
      place:
        <<: *place
        title: Turn it up in an area or floor

  volume_down:
    title: Turn it down
    icon: mdi:volume-minus
    description: bajar el volumen
    require: [[más bajo, más flojo, bájale, baja el volumen, baja ... volumen, baja ... música, baja ... sonido]]
    optional: [[un poco, algo], [música, sonido, volumen], [en, al]]
    exclude: [luz, luces, brillo, calefacción, temperatura, persiana, persianas, por ciento]
    music: volume_down
    verbosity: beep
    variants:
      here:
        title: Turn it down on this satellite
        examples: [más bajo, baja el volumen, bájale]
      device:
        <<: *player
        title: Turn it down on a different device
      place:
        <<: *place
        title: Turn it down in an area or floor

  set_volume:
    title: Set the volume
    icon: mdi:volume-equal
    description: ajustar el volumen
    require: [[volumen]]
    optional: [[pon, cambia, ajusta], [por ciento], [en, al]]
    number: percentage
    # Without a number it asks for one ("pon el volumen").
    combinations: [[], [percentage]]
    music: volume_set
    verbosity: beep
    variants:
      here:
        title: Set the volume on this satellite
      device:
        <<: *player
        title: Set the volume on a different device
        combinations: [[entity, percentage]]
      place:
        <<: *place
        title: Set the volume in an area or floor
        combinations: [[area, percentage], [floor, percentage]]

  mute_music:
    title: Mute
    icon: mdi:volume-off
    description: silenciar la música
    require: [[silencia, silenciar, silencio, quita el sonido]]
    optional: [[música, sonido, altavoz], [en, al]]
    music: mute
    verbosity: beep
    variants:
      here:
        title: Mute this satellite
        examples: ["silencia [la música]", "silencio", "quita el sonido"]
      device:
        <<: *player
        title: Mute a different device
      place:
        <<: *place
        title: Mute an area or floor

  unmute_music:
    title: Unmute
    icon: mdi:volume-high
    description: quitar el silencio
    require: [[activa el sonido, quita el silencio, vuelve a activar el sonido, pon el sonido]]
    optional: [[en, al]]
    music: unmute
    verbosity: beep
    variants:
      here:
        title: Unmute this satellite
        examples: ["activa el sonido", "quita el silencio"]
      device:
        <<: *player
        title: Unmute a different device
      place:
        <<: *place
        title: Unmute an area or floor

  shuffle_on:
    title: Shuffle
    icon: mdi:shuffle-variant
    description: poner la música en orden aleatorio
    require: [[aleatorio, aleatoria, al azar, mezcla, mezclar]]
    optional: [[activa, pon, reproduce, modo], [música, canciones, lista], [en, al]]
    exclude: [desactiva, quita, para, no, sin]
    music: shuffle_on
    verbosity: beep
    variants:
      here:
        title: Shuffle on this satellite
        examples: ["activa el modo aleatorio", "reproducción aleatoria", "mezcla las canciones"]
      device:
        <<: *player
        title: Shuffle on a different device
      place:
        <<: *place
        title: Shuffle in an area or floor

  shuffle_off:
    title: Stop shuffling
    icon: mdi:shuffle-disabled
    description: dejar el orden aleatorio
    require: [[aleatorio, aleatoria, mezcla, mezclar], [desactiva, quita, para, no, sin]]
    optional: [[modo], [en, al]]
    music: shuffle_off
    verbosity: beep
    variants:
      here:
        title: Stop shuffling on this satellite
        examples: ["desactiva el modo aleatorio", "quita el aleatorio"]
      device:
        <<: *player
        title: Stop shuffling on a different device
      place:
        <<: *place
        title: Stop shuffling in an area or floor

  repeat_one:
    title: Repeat this song
    icon: mdi:repeat-once
    description: repetir esta canción
    require: [[repite, repetir, otra vez, de nuevo], [esta canción, este tema, esta]]
    optional: [[pon], [en, al]]
    music: repeat_one
    verbosity: beep
    variants:
      here:
        title: Repeat this song on this satellite
        examples: [repite esta canción, pon esta canción otra vez]
      device:
        <<: *player
        title: Repeat the song on a different device
      place:
        <<: *place
        title: Repeat the song in an area or floor

  repeat_all:
    title: Repeat
    icon: mdi:repeat
    description: repetir la música
    require: [[repite, repetir, repetición, bucle]]
    optional: [[todo, todas, activa, música, lista, álbum, modo], [en, al]]
    exclude: [desactiva, quita, para, no, deja, canción, tema, esta]
    music: repeat_all
    verbosity: beep
    variants:
      here:
        title: Repeat on this satellite
        examples: ["repite todo", "activa la repetición"]
      device:
        <<: *player
        title: Repeat on a different device
      place:
        <<: *place
        title: Repeat in an area or floor

  repeat_off:
    title: Stop repeating
    icon: mdi:repeat-off
    description: dejar de repetir
    require: [[repite, repitas, repetir, repetición, bucle], [desactiva, quita, para, no, deja de]]
    optional: [[en, al]]
    music: repeat_off
    verbosity: beep
    variants:
      here:
        title: Stop repeating on this satellite
        examples: ["desactiva la repetición", "deja de repetir", "no repitas"]
      device:
        <<: *player
        title: Stop repeating on a different device
      place:
        <<: *place
        title: Stop repeating in an area or floor

  # Where it is told to go: from what is playing here (or the one player
  # playing anywhere) to the device, area or floor named, queue and all.
  move_music:
    title: Move the music
    icon: mdi:cast-audio
    description: mover la música a otra habitación o altavoz
    require: [[mueve, mover, pasa, lleva, manda, envía], [música, canción, lista, audio]]
    optional: [[a, al, en]]
    music: move
    verbosity: specific
    variants:
      device:
        <<: *player
        title: Move the music to a different device
        description: mover la música a otro altavoz
      place:
        <<: *place
        title: Move the music to an area or floor
        description: mover la música a otra habitación

  whats_playing:
    title: What's playing
    icon: mdi:playlist-music
    description: saber qué está sonando
    require: [[qué suena, qué está sonando, qué canción, quién canta, qué es esto, qué música, cuál es esta canción, qué se oye]]
    optional: [[es, esta, esto, ahora], [en, al]]
    music: status
    variants:
      here:
        title: What's playing on this satellite
        examples: ["qué suena [ahora]", "qué está sonando", "qué canción es esta", "quién canta [esto]"]
      device:
        <<: *player
        title: What's playing on a different device
      place:
        <<: *place
        title: What's playing in an area or floor
