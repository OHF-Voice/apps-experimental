# Примеры команд для библиотеки веб-интерфейса (Russian), as the English
# library (voice_call/languages/en/library/basic.yaml): titles and needs are
# the UI's, in English; descriptions are said in hints ("Похоже, вы хотите
# <description>, ..."), so each is what one wants to do: "включить свет".
#
# Keywords are lowercase, with "е" for "ё", as the Russian model writes them,
# in the forms people say: imperatives both ways ("включи", "включите") and
# nouns in their cases ("лампу", "лампы"). "В", "во", "на" and "мой" are
# filler (the language pack's): "включи свет на кухне" is "включи" + "свет"
# and a place. A device's name is heard in its cases too ("включи лампу" for
# the Лампа). What is said back of a device by name takes no gender it can't
# know: "Включено: Торшер."; a question about one guesses it from the name's
# first word ("Лампа включена", "Торшер включён").
title: Basics
icon: mdi:home-outline

# What the versions add to a command (merged into them with <<).
shared:
  device: &device
    names:
      entity: {count: 1, domains: [light, switch, fan, media_player, input_boolean, climate]}
      area: {count: 1}
    # A room with the device picks it out: the one of that name there.
    combinations: [[entity], [entity, area]]
  place: &place
    names:
      area: {count: 1}
      floor: {count: 1}
    combinations: [[area], [floor]]
    needs:
      - Add names for the areas and floors it may act in (Names page).

commands:
  what_time:
    title: What time is it
    icon: mdi:clock-outline
    description: узнать время
    examples: ["который [сейчас] час", "сколько [сейчас] времени", "скажи который час", "подскажи время"]
    require: [[который час, сколько времени]]
    optional: [[сейчас], [скажи, подскажи]]
    # Other times: "сколько времени осталось" (a timer), "который час будет
    # через 45 минут после 15:00" (answered as a question).
    exclude: [осталось, остается, таймер, таймере, будильник, будет, было, через, после, до, за, открывается,
              закрывается]
    response: >-
      {%- set h = now().hour -%}
      {%- set m = now().minute -%}
      {%- if h == 0 and m == 0 -%}
      Сейчас полночь.
      {%- elif h == 12 and m == 0 -%}
      Сейчас полдень.
      {%- else -%}
      Сейчас {{ h }}:{{ '%02d' % m }}.
      {%- endif -%}

  what_date:
    title: What's the date
    icon: mdi:calendar-today
    description: узнать дату
    examples: ["какое [сегодня] число", "какой [сегодня] день", "какая [сегодня] дата", "какой сегодня день недели"]
    require: [[какое ... число, какая ... дата, какой ... день, число, дата]]
    optional: [[сегодня, сейчас], [недели]]
    # A date asked about: "какой день недели будет 4 июля", "на какой день
    # выпадает Новый год" (answered as questions).
    exclude: [будет, был, было, выпадает, приходится, после, перед, до, через, осталось, високосный, месяц, месяце]
    response: >-
      {%- set days = ['понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота', 'воскресенье'] -%}
      {%- set months = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября',
        'октября', 'ноября', 'декабря'] -%}
      {%- set ordinals = ['первое', 'второе', 'третье', 'четвёртое', 'пятое', 'шестое', 'седьмое', 'восьмое',
        'девятое', 'десятое', 'одиннадцатое', 'двенадцатое', 'тринадцатое', 'четырнадцатое', 'пятнадцатое',
        'шестнадцатое', 'семнадцатое', 'восемнадцатое', 'девятнадцатое', 'двадцатое', 'двадцать первое',
        'двадцать второе', 'двадцать третье', 'двадцать четвёртое', 'двадцать пятое', 'двадцать шестое',
        'двадцать седьмое', 'двадцать восьмое', 'двадцать девятое', 'тридцатое', 'тридцать первое'] -%}
      Сегодня {{ days[now().weekday()] }}, {{ ordinals[now().day - 1] }} {{ months[now().month - 1] }}.

  never_mind:
    title: Never mind
    icon: mdi:close-circle-outline
    description: ничего не делать
    # Said whole only: "отмени таймер" is the timer's.
    examples: [неважно, забудь, отмена, отмени, ничего, не надо, проехали, забей, ничего не надо]

  # Lights here, in an area or on a floor named, or a device by name.
  turn_on:
    title: Turn on
    icon: mdi:lightbulb-on-outline
    description: включить свет
    require: [[включи, включите, включить, включай, зажги, зажгите, вруби, врубите],
              [свет, лампу, лампы, лампочку, лампочки, люстру, люстры, светильник, светильники, освещение, подсветку]]
    optional: [[весь, всю, все]]
    exclude: [выключи, выключите, выключить, погаси, погасите, выруби]
    intent:
      name: HassTurnOn
      slots: {domain: light}
    verbosity: beep
    response:
      done:
        brief: Свет включён.
        specific: Свет включён {{ place.said }}.
        verbose: >-
          {%- set ns = namespace(names=result.names or []) -%}
          {%- set n = ns.names | count -%}
          {%- if n == 0 or n > 4 -%}
          Свет включён {{ place.said }}.
          {%- else -%}
          Включено {{ place.said }}: {{ (ns.names[:-1] | join(', ') ~ ' и ' ~ ns.names[-1]) if n > 1 else ns.names[0] }}.
          {%- endif -%}
    variants:
      here:
        title: Turn on the lights in this satellite's area
        needs:
          - The lights in the satellite's area (Satellites page) are the ones it
            turns on.
      device:
        <<: *device
        title: Turn on a device by name
        icon: mdi:toggle-switch-outline
        description: включить устройство
        require: [[включи, включите, включить, включай, вруби, врубите, запусти, запустите]]
        intent: HassTurnOn
        response:
          done:
            brief: Включено.
            specific: "Включено: {{ state_attr(slots.entity[0], 'friendly_name') }}."
            verbose: "Включено {{ place.said }}: {{ state_attr(slots.entity[0], 'friendly_name') }}."
        needs:
          - Add names for the devices it may turn on (Names page).
      place:
        <<: *place
        title: Turn on the lights in an area or floor

  turn_off:
    title: Turn off
    icon: mdi:lightbulb-off-outline
    description: выключить свет
    require: [[выключи, выключите, выключить, выключай, погаси, погасите, потуши, потушите, выруби, вырубите],
              [свет, лампу, лампы, лампочку, лампочки, люстру, люстры, светильник, светильники, освещение, подсветку]]
    optional: [[весь, всю, все], [дома, во всем доме, везде]]
    exclude: [включи, включите, включить, зажги]
    intent:
      name: HassTurnOff
      slots: {domain: light}
    verbosity: beep
    response:
      done:
        brief: Свет выключен.
        specific: Свет выключен {{ place.said }}.
        verbose: >-
          {%- set ns = namespace(names=result.names or []) -%}
          {%- set n = ns.names | count -%}
          {%- if n == 0 or n > 4 -%}
          Свет выключен {{ place.said }}.
          {%- else -%}
          Выключено {{ place.said }}: {{ (ns.names[:-1] | join(', ') ~ ' и ' ~ ns.names[-1]) if n > 1 else ns.names[0] }}.
          {%- endif -%}
    variants:
      here:
        title: Turn off the lights in this satellite's area
        needs:
          - The lights in the satellite's area (Satellites page) are the ones it
            turns off.
      device:
        <<: *device
        title: Turn off a device by name
        icon: mdi:toggle-switch-off-outline
        description: выключить устройство
        require: [[выключи, выключите, выключить, выключай, выруби, вырубите, останови, остановите]]
        intent: HassTurnOff
        response:
          done:
            brief: Выключено.
            specific: "Выключено: {{ state_attr(slots.entity[0], 'friendly_name') }}."
            verbose: "Выключено {{ place.said }}: {{ state_attr(slots.entity[0], 'friendly_name') }}."
        needs:
          - Add names for the devices it may turn off (Names page).
      place:
        <<: *place
        title: Turn off the lights in an area or floor

  any_lights_on:
    title: Are any lights on
    icon: mdi:lightbulb-question
    description: узнать, где горит свет
    # No example sentences: one said word for word carries no area or floor.
    require: [[горит, горят, включен, включена, включено, включены],
              [свет, лампа, лампы, лампочка, лампочки, люстра, светильник, светильники]]
    optional: [[ли], [еще, сейчас, где]]
    exclude: [включи, включите, выключи, выключите, погаси, зажги]
    response: >-
      {%- set named = slots.area or slots.floor -%}
      {%- set ns = namespace(areas=slots.area or [], on=[]) -%}
      {%- for f in slots.floor or [] -%}
      {%- set ns.areas = ns.areas + (floor_areas(f) | list) -%}
      {%- endfor -%}
      {%- if not named and satellite.area_id -%}
      {%- set ns.areas = [satellite.area_id] -%}
      {%- endif -%}
      {%- set where = (' ' ~ place.said) if place.said else '' -%}
      {%- for s in states.light if s.entity_id in exposed and (not ns.areas or area_id(s.entity_id) in ns.areas) and s.state == 'on' -%}
      {%- set ns.on = ns.on + [s.name] -%}
      {%- endfor -%}
      {%- set count = ns.on | count -%}
      {%- set lamps = 'светильник' if count % 10 == 1 and count % 100 != 11 else
        ('светильника' if count % 10 in [2, 3, 4] and (count % 100 < 12 or count % 100 > 14) else 'светильников') -%}
      {%- if count == 0 -%}
      Нет, свет{{ where }} не горит.
      {%- elif count > 3 -%}
      Да,{{ where }} горит {{ count }} {{ lamps }}.
      {%- else -%}
      Да, горит: {{ (ns.on[:-1] | join(', ') ~ ' и ' ~ ns.on[-1]) if count > 1 else ns.on[0] }}.
      {%- endif -%}
    variants:
      here:
        title: Are any lights on in this satellite's area
        needs:
          - The satellite's area (Satellites page) is the one it asks about.
      device:
        <<: *device
        title: Is a device on, by name
        icon: mdi:toggle-switch-outline
        description: узнать, включено ли устройство
        # "Торшер включён?", "включена ли лампа?": the state is the question.
        require: null
        optional: [[ли], [еще, сейчас]]
        names:
          entity: {count: 1, domains: [light, switch, fan, input_boolean]}
          area: {count: 1}
        lists:
          asked: {list: on_off}
        combinations: [[entity, asked], [entity, area, asked]]
        response: >-
          {%- set e = slots.entity[0] -%}
          {%- set name = state_attr(e, 'friendly_name') or e -%}
          {%- set last = (name.split(' ')[0] | lower)[-1:] -%}
          {%- set g = 'f' if last in ['а', 'я'] else ('n' if last in ['о', 'е'] else 'm') -%}
          {%- set state = states(e) -%}
          {%- set words = {'on': {'m': 'включён', 'f': 'включена', 'n': 'включено'},
            'off': {'m': 'выключен', 'f': 'выключена', 'n': 'выключено'},
            'unavailable': {'m': 'недоступен', 'f': 'недоступна', 'n': 'недоступно'}} -%}
          {%- set said = name ~ ' ' ~ (words[state][g] if state in words else 'в неизвестном состоянии') ~ '.' -%}
          {%- if state in ['on', 'off'] -%}
          {{ 'Да' if state == slots.asked else 'Нет' }}, {{ said }}
          {%- else -%}
          {{ said }}
          {%- endif -%}
        needs:
          - Add names for the lights and switches it may ask about (Names page).
      place:
        <<: *place
        title: Are any lights on in an area or floor

  set_brightness:
    title: Set the brightness
    icon: mdi:brightness-6
    description: изменить яркость света
    require: [[яркость, яркости, процентов, процента, процент]]
    optional: [[поставь, установи, сделай, измени, выставь, включи, убавь, прибавь],
               [свет, лампу, лампы, люстру, светильник, подсветку], [яркость]]
    # A question: "сколько будет 15 процентов от 80"; and the music's volume.
    exclude: [сколько, какая, какой, чему, будет, от, громкость, громкости]
    number: percentage
    intent:
      name: HassLightSet
      slots: {brightness: "{{ slots.percentage }}"}
    verbosity: beep
    response:
      done:
        brief: Яркость изменена.
        specific: >-
          {%- set p = slots.percentage | int -%}
          {%- set word = 'процент' if p % 10 == 1 and p % 100 != 11 else
            ('процента' if p % 10 in [2, 3, 4] and (p % 100 < 12 or p % 100 > 14) else 'процентов') -%}
          {%- if slots.entity -%}
          {{ state_attr(slots.entity[0], 'friendly_name') }}: яркость {{ p }} {{ word }}.
          {%- else -%}
          Яркость {{ place.said }}: {{ p }} {{ word }}.
          {%- endif -%}
    variants:
      here:
        title: Set the brightness in this satellite's area
      device:
        <<: *device
        title: Set the brightness of a light by name
        names:
          entity: {count: 1, domains: [light]}
          area: {count: 1}
        combinations: [[entity, percentage], [entity, area, percentage]]
        needs:
          - Add names for the lights it may dim (Names page).
      place:
        <<: *place
        title: Set the brightness in an area or floor
        combinations: [[area, percentage], [floor, percentage]]

  light_color:
    title: Set the light color
    icon: mdi:format-color-fill
    description: изменить цвет света
    # "Сделай свет красным", "включи синий свет", "поменяй цвет лампы на зелёный".
    # "Делай": "сделай" as the model often hears it.
    require: [[сделай, сделайте, делай, поставь, включи, включите, смени, поменяй, измени, переключи, цвет],
              [свет, лампу, лампы, лампочку, люстру, светильник, подсветку]]
    optional: [[цвет]]
    lists:
      color: {list: colors}
    intent:
      name: HassLightSet
      slots: {color: "{{ slots.color }}"}
    verbosity: beep
    response:
      done:
        brief: Цвет изменён.
        specific: >-
          {%- set colors = {'red': 'красный', 'orange': 'оранжевый', 'yellow': 'жёлтый', 'green': 'зелёный',
            'blue': 'синий', 'purple': 'фиолетовый', 'pink': 'розовый', 'white': 'белый', 'turquoise': 'бирюзовый', 'magenta': 'пурпурный'} -%}
          {%- set c = colors.get(slots.color, slots.color) -%}
          {%- if slots.entity -%}
          {{ state_attr(slots.entity[0], 'friendly_name') }}: {{ c }} цвет.
          {%- else -%}
          Свет {{ place.said }} теперь {{ c }}.
          {%- endif -%}
    variants:
      here:
        title: Set the light color in this satellite's area
      device:
        <<: *device
        title: Set the color of a light by name
        require: [[сделай, сделайте, делай, поставь, включи, включите, смени, поменяй, измени, переключи, цвет]]
        names:
          entity: {count: 1, domains: [light]}
          area: {count: 1}
        combinations: [[entity, color], [entity, area, color]]
        needs:
          - Add names for the lights it may color (Names page).
      place:
        <<: *place
        title: Set the light color in an area or floor
        combinations: [[area, color], [floor, color]]

  set_temperature:
    title: Set the temperature
    icon: mdi:thermometer
    description: изменить температуру
    require: [[температуру, температура, градусов, градуса, градус, отопление, обогрев]]
    optional: [[поставь, установи, сделай, выставь, измени, подними, опусти, включи],
               [температуру, отопление, обогрев, термостат], [градусов, градуса, градус], [до]]
    # A question about degrees is not a setting: "сколько градусов по Цельсию
    # 100 по Фаренгейту", "какая температура на улице".
    exclude: [сколько, какая, какой, какое, чему, переведи, цельсия, цельсию, фаренгейта, фаренгейту, кельвина,
              на улице]
    number: temperature
    intent:
      name: HassClimateSetTemperature
      slots: {temperature: "{{ slots.temperature }}"}
    # Not seen at once, and a misheard number matters: said.
    verbosity: specific
    response:
      done:
        brief: Температура изменена.
        specific: >-
          {%- set t = slots.temperature -%}
          {%- set n = t | int -%}
          {%- set word = 'градуса' if t != n else ('градус' if n % 10 == 1 and n % 100 != 11 else
            ('градуса' if n % 10 in [2, 3, 4] and (n % 100 < 12 or n % 100 > 14) else 'градусов')) -%}
          {%- set said = (t | string | replace('.', ',')) ~ ' ' ~ word -%}
          {%- if slots.entity -%}
          {{ state_attr(slots.entity[0], 'friendly_name') }}: установлено {{ said }}.
          {%- else -%}
          Установлено {{ said }} {{ place.said }}.
          {%- endif -%}
    variants:
      here:
        title: Set the temperature in this satellite's area
      device:
        <<: *device
        title: Set the temperature of a thermostat by name
        names:
          entity: {count: 1, domains: [climate]}
          area: {count: 1}
        combinations: [[entity, temperature], [entity, area, temperature]]
        needs:
          - Add names for the thermostats it may set (Names page).
      place:
        <<: *place
        title: Set the temperature in an area or floor
        combinations: [[area, temperature], [floor, temperature]]

  weather:
    title: What's the weather
    icon: mdi:weather-partly-cloudy
    description: узнать погоду
    examples: ["какая [сегодня] погода", "какая погода [на улице]", "что с погодой", "будет ли [сегодня] дождь",
               "что там с погодой", "какая сейчас погода"]
    require: [[погода, погоду, погоды, погодой, дождь, дождя, прогноз, прогноз погоды]]
    # Not a timer's time: "сколько осталось".
    exclude: [осталось, таймер, сколько]
    slots:
      entity: [weather.home]
    response: >-
      {%- set weather = {'clear-night': 'ясно', 'cloudy': 'облачно', 'exceptional': 'необычная погода',
        'fog': 'туман', 'hail': 'град', 'lightning': 'гроза', 'lightning-rainy': 'гроза с дождём',
        'partlycloudy': 'переменная облачность', 'pouring': 'ливень', 'rainy': 'дождь',
        'snowy': 'снег', 'snowy-rainy': 'мокрый снег', 'sunny': 'солнечно', 'windy': 'ветрено',
        'windy-variant': 'ветрено и облачно'} -%}
      {%- set state = states(slots.entity[0]) -%}
      {%- set t = state_attr(slots.entity[0], 'temperature') | round | int -%}
      {%- set n = t if t >= 0 else -t -%}
      {%- set word = 'градус' if n % 10 == 1 and n % 100 != 11 else
        ('градуса' if n % 10 in [2, 3, 4] and (n % 100 < 12 or n % 100 > 14) else 'градусов') -%}
      Сейчас {{ weather.get(state, state) }}, {{ t }} {{ word }}.
    needs:
      - Set the fixed slot entity to your weather entity (weather.home here).

  shopping_list_add:
    title: Add to the shopping list
    icon: mdi:cart-plus
    description: добавить что-нибудь в список покупок
    # "Добавь молоко в список покупок": what is added as it was said.
    require: [[добавь, добавьте, внеси, внесите, запиши, запишите], [список покупок, список продуктов, покупки]]
    optional: [[в]]
    wildcard:
      slot: item
      after: [добавь, добавьте, внеси, внесите, запиши, запишите]
      before: [в]
      bounded: true
      max_words: 5
    action:
      action: todo.add_item
      target:
        entity_id: todo.shopping_list
      data:
        item: "{{ slots.item }}"
    verbosity: specific
    response:
      done:
        brief: Добавлено в список покупок.
        specific: "Добавлено в список покупок: {{ slots.item }}."

  shopping_list_remove:
    title: Take off the shopping list
    icon: mdi:cart-minus
    description: убрать что-нибудь из списка покупок
    require: [[удали, удалите, убери, уберите, вычеркни, вычеркните], [списка покупок, списка продуктов, покупок]]
    optional: [[из]]
    wildcard:
      slot: item
      after: [удали, удалите, убери, уберите, вычеркни, вычеркните]
      before: [из]
      bounded: true
      max_words: 5
    action:
      action: todo.remove_item
      target:
        entity_id: todo.shopping_list
      data:
        item: "{{ slots.item }}"
    verbosity: specific
    response:
      done:
        brief: Удалено из списка покупок.
        specific: "Удалено из списка покупок: {{ slots.item }}."

  todo_add:
    title: Add to the to-do list
    icon: mdi:format-list-checks
    description: добавить задачу в список дел
    require: [[добавь, добавьте, запиши, запишите, внеси, внесите], [список дел, список задач, задачи, дела]]
    optional: [[в]]
    wildcard:
      slot: item
      after: [добавь, добавьте, запиши, запишите, внеси, внесите]
      before: [в]
      bounded: true
      max_words: 8
    action:
      action: todo.add_item
      target:
        entity_id: todo.to_do
      data:
        item: "{{ slots.item }}"
    verbosity: specific
    response:
      done:
        brief: Добавлено в список дел.
        specific: "Добавлено в список дел: {{ slots.item }}."
    needs:
      - Point it at your to-do list (todo.to_do here).

  remind_me:
    title: Remember something
    icon: mdi:note-edit-outline
    description: добавить напоминание
    # "Напомни мне позвонить маме", "напомни, что нужно купить хлеб".
    require: [[напомни, напомните, напомнишь]]
    optional: [[что, чтобы, про, о том что]]
    wildcard:
      slot: reminder
      after: [напомни, напомните, напомнишь, что, чтобы, про, о том что]
      to_end: true
      max_words: 10
    # The speaker's own to-do list, when anyone has one (People page).
    slots:
      entity: [todo.reminders]
    mine: todo_list
    action:
      action: todo.add_item
      target:
        entity_id: "{{ slots.entity }}"
      data:
        item: "{{ slots.reminder }}"
    verbosity: specific
    response:
      done:
        brief: Хорошо, напомню.
        specific: "Хорошо, напомню: {{ slots.reminder }}."
    needs:
      - Point it at a to-do list (todo.reminders here). Where someone has a
        to-do list of their own (People page), theirs, and they must be
        recognized.

  scene:
    title: Activate a scene
    icon: mdi:palette
    description: включить режим кино
    examples: ["[включи] режим кино", "[давай] смотреть кино", "кинорежим"]
    scene: scene.movie_time
    verbosity: beep
    response:
      done:
        brief: Готово.
    needs:
      - Pick the scene, and change the examples to what you want to say.

  script:
    title: Run a script
    icon: mdi:script-text-outline
    description: пожелать спокойной ночи
    examples: [спокойной ночи]
    script: script.good_night
    response: "{{ result.speech if result and result.speech else 'Спокойной ночи.' }}"
    needs:
      - Pick the script. It gets slots, satellite, speaker and target as variables,
        and anything it returns (stop with response_variable) as result.
