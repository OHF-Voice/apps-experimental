# Date and time (Russian), as the English library's time.yaml.
title: Date and time
icon: mdi:clock-outline

commands:
  what_time:
    title: What time is it
    icon: mdi:clock-outline
    description: узнать время
    examples: ["который [сейчас] час", "сколько [сейчас] времени", "скажи который час", "подскажи время"]
    require: [[который час, сколько времени]]
    optional: [[сейчас], [скажи, подскажи]]
    # Other times: "сколько времени осталось" (a timer), "который час будет
    # через 45 минут", "сколько времени до полудня" (answered as questions).
    exclude: [осталось, остается, таймер, таймере, будильник, будет, было, через, после, до, за, открывается,
              закрывается]
    response: >-
      {%- set h = now().hour -%}
      {%- set m = now().minute -%}
      {%- if h == 0 and m == 0 -%}
      Сейчас полночь.
      {%- elif h == 12 and m == 0 -%}
      Сейчас полдень.
      {%- else -%}
      Сейчас {{ h }}:{{ '%02d' % m }}.
      {%- endif -%}

  what_date:
    title: What's the date
    icon: mdi:calendar-today
    description: узнать дату
    examples: ["какое [сегодня] число", "какой [сегодня] день", "какая [сегодня] дата", "какой сегодня день недели"]
    require: [[какое ... число, какая ... дата, какой ... день, число, дата]]
    optional: [[сегодня, сейчас], [недели]]
    # A date asked about: "какой день недели будет 4 июля", "на какой день
    # выпадает Новый год" (answered as questions).
    exclude: [будет, был, было, выпадает, приходится, после, перед, до, через, осталось, високосный, месяц, месяце]
    response: >-
      {%- set days = ['понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота', 'воскресенье'] -%}
      {%- set months = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября',
        'октября', 'ноября', 'декабря'] -%}
      {%- set ordinals = ['первое', 'второе', 'третье', 'четвёртое', 'пятое', 'шестое', 'седьмое', 'восьмое',
        'девятое', 'десятое', 'одиннадцатое', 'двенадцатое', 'тринадцатое', 'четырнадцатое', 'пятнадцатое',
        'шестнадцатое', 'семнадцатое', 'восемнадцатое', 'девятнадцатое', 'двадцатое', 'двадцать первое',
        'двадцать второе', 'двадцать третье', 'двадцать четвёртое', 'двадцать пятое', 'двадцать шестое',
        'двадцать седьмое', 'двадцать восьмое', 'двадцать девятое', 'тридцатое', 'тридцать первое'] -%}
      Сегодня {{ days[now().weekday()] }}, {{ ordinals[now().day - 1] }} {{ months[now().month - 1] }}.
