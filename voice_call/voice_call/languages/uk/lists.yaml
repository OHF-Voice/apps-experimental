# The value lists every home has in Ukrainian (Pack.lists): a command's value
# slot uses one by name ({list: colors}). A home's own list by the same name,
# in Ukrainian, takes its place (the Names page). Values are what Home Assistant
# gets: CSS color names, cover device classes, HVAC modes.
colors:
  red: [червоний, червоне, червона, червону, червоним, червоною, червоні]
  orange: [помаранчевий, помаранчеве, помаранчева, помаранчеву, помаранчевим, помаранчевою, оранжевий, оранжевим]
  yellow: [жовтий, жовте, жовта, жовту, жовтим, жовтою]
  green: [зелений, зелене, зелена, зелену, зеленим, зеленою]
  blue: [синій, синє, синя, синю, синім, синьою, блакитний, блакитне, блакитним, блакитною]
  purple: [фіолетовий, фіолетове, фіолетова, фіолетову, фіолетовим, фіолетовою, бузковий, бузковим]
  pink: [рожевий, рожеве, рожева, рожеву, рожевим, рожевою]
  white: [білий, біле, біла, білу, білим, білою]
  turquoise: [бірюзовий, бірюзове, бірюзова, бірюзову, бірюзовим, бірюзовою]
  magenta: [пурпуровий, пурпурове, пурпурова, пурпурову, пурпуровим, пурпуровою]
on_off:
  "on": [увімкнений, увімкнена, увімкнене, увімкнені, ввімкнений, ввімкнена, ввімкнене, ввімкнені, увімкнено, включений, включена, горить, працює]
  "off": [вимкнений, вимкнена, вимкнене, вимкнені, вимкнено, виключений, виключена]
cover_classes:
  awning: [маркіза, маркізу, маркізи, навіс, тент]
  blind: [жалюзі]
  curtain: [штори, штору, штора, шторах, фіранки, фіранку, гардини, завіси]
  door: [двері, дверях]
  garage: [гаражні ворота, ворота гаража, гаражні двері, двері гаража, ворота в гаражі]
  gate: [ворота, хвіртку, хвіртка, браму, брама]
  shade: [рулонні штори, рулонну штору, рулонна штора, рулонних штор]
  shutter: [ролети, ролету, ролета, ролетах, ролет, віконниці, віконницю]
  window: [вікно, вікна, вікон, вікнах, кватирку, кватирка]
open_closed:
  open: [відкриті, відкрите, відкрита, відкритий, відчинені, відчинене, відчинена, відчинений, підняті, піднята]
  closed: [закриті, закрите, закрита, закритий, зачинені, зачинене, зачинена, зачинений, опущені, опущена]
locked_unlocked:
  locked: [замкнені, замкнений, замкнена, замкнене, замкнено, на ключ, на замку, заблоковані, заблокований]
  unlocked: [відімкнені, відімкнений, відімкнена, відімкнене, відімкнено, незамкнені, незамкнений, незамкнена, незамкнене, розблоковані]
hvac_modes:
  "off": [вимкнено]
  heat: [обігрів, нагрів, обігріву]
  cool: [охолодження, кондиціонер]
  heat_cool: [обігрів і охолодження]
  auto: [авто, автоматичний, автоматичному]
  dry: [осушення]
  fan_only: [вентиляція, вентилятор]
