# Приклади команд для бібліотеки веб-інтерфейсу (Ukrainian), as the English
# library (voice_call/languages/en/library/basic.yaml): titles and needs are
# the UI's, in English; descriptions are said in hints ("Схоже, ти хочеш
# <description>, ..."), so each is what one wants to do, an infinitive:
# "увімкнути світло".
#
# Keywords are lowercase, in the forms people say them: imperatives both ти
# and ви ("увімкни", "увімкніть"), nouns in their cases ("лампу", "лампи"),
# with the apostrophe the model writes ("п'ять"). "Увімкни" is also written
# "ввімкни", and the model hears it as "умкни". Prepositions and "будь
# ласка" are filler (the language pack's): "увімкни світло у вітальні" is
# "увімкни" + "світло" and a place.
#
# What is said back is impersonal ("Світло увімкнено") and names a device
# after a colon ("Увімкнено: Торшер"), so a name, which can't be declined,
# never has to agree with anything; numbers with units agree with them ("22
# градуси", "5 відсотків").
title: Basics
icon: mdi:home-outline

# What the versions add to a command (merged into them with <<).
shared:
  device: &device
    names:
      entity: {count: 1, domains: [light, switch, fan, media_player, input_boolean, climate]}
      area: {count: 1}
    # A room with the device picks it out: the one of that name there.
    combinations: [[entity], [entity, area]]
  place: &place
    names:
      area: {count: 1}
      floor: {count: 1}
    combinations: [[area], [floor]]
    needs:
      - Add names for the areas and floors it may act in (Names page).

commands:
  what_time:
    title: What time is it
    icon: mdi:clock-outline
    description: дізнатися, котра година
    examples: ["котра [зараз] година", "скільки [зараз] часу", "яка зараз година", "скажи, котра година"]
    require: [[котра година, котра, скільки часу, яка година]]
    optional: [[зараз, тепер], [скажи, підкажи]]
    # Other times: "о котрій зачиняється магазин", "котра година буде через
    # 45 хвилин після третьої" (that one is answered as a question).
    exclude: [через, після, буде, була, відкривається, зачиняється, о котрій, києві, лондоні]
    response: >-
      {%- set h = now().hour -%}
      {%- set m = now().minute -%}
      {%- set hours = ['нуль', 'перша', 'друга', 'третя', 'четверта', "п'ята", 'шоста', 'сьома', 'восьма',
        "дев'ята", 'десята', 'одинадцята', 'дванадцята', 'тринадцята', 'чотирнадцята', "п'ятнадцята",
        'шістнадцята', 'сімнадцята', 'вісімнадцята', "дев'ятнадцята", 'двадцята', 'двадцять перша',
        'двадцять друга', 'двадцять третя'] -%}
      {%- set ones = ['', 'одна', 'дві', 'три', 'чотири', "п'ять", 'шість', 'сім', 'вісім', "дев'ять"] -%}
      {%- set teens = ['десять', 'одинадцять', 'дванадцять', 'тринадцять', 'чотирнадцять', "п'ятнадцять",
        'шістнадцять', 'сімнадцять', 'вісімнадцять', "дев'ятнадцять"] -%}
      {%- set tens = ['', '', 'двадцять', 'тридцять', 'сорок', "п'ятдесят"] -%}
      {%- if h == 0 and m == 0 -%}
      Зараз північ.
      {%- elif m == 0 -%}
      Зараз {{ hours[h] }} година.
      {%- else -%}
      Зараз {{ hours[h] }} {{ ('нуль ' ~ ones[m]) if m < 10 else (teens[m - 10] if m < 20
        else tens[m // 10] ~ ((' ' ~ ones[m % 10]) if m % 10 else '')) }}.
      {%- endif -%}

  what_date:
    title: What's the date
    icon: mdi:calendar-today
    description: дізнатися сьогоднішню дату
    examples: ["яке сьогодні число", "яке число сьогодні", "яка сьогодні дата", "який сьогодні день", "яке число"]
    require: [[число, дата, дату, який сьогодні день, який день]]
    optional: [[сьогодні, зараз], [яке, яка, скажи, підкажи]]
    # A date asked about: "який день тижня буде 4 липня", "яке число буде
    # Великдень" (those are answered as questions).
    exclude: [тижня, буде, був, була, припадає, до, після, через, скільки, коли]
    response: >-
      {%- set days = ['понеділок', 'вівторок', 'середа', 'четвер', "п'ятниця", 'субота', 'неділя'] -%}
      {%- set months = ['січня', 'лютого', 'березня', 'квітня', 'травня', 'червня', 'липня', 'серпня',
        'вересня', 'жовтня', 'листопада', 'грудня'] -%}
      {%- set dates = ['', 'перше', 'друге', 'третє', 'четверте', "п'яте", 'шосте', 'сьоме', 'восьме', "дев'яте",
        'десяте', 'одинадцяте', 'дванадцяте', 'тринадцяте', 'чотирнадцяте', "п'ятнадцяте", 'шістнадцяте',
        'сімнадцяте', 'вісімнадцяте', "дев'ятнадцяте", 'двадцяте', 'двадцять перше', 'двадцять друге',
        'двадцять третє', 'двадцять четверте', "двадцять п'яте", 'двадцять шосте', 'двадцять сьоме',
        'двадцять восьме', "двадцять дев'яте", 'тридцяте', 'тридцять перше'] -%}
      Сьогодні {{ days[now().weekday()] }}, {{ dates[now().day] }} {{ months[now().month - 1] }}.

  never_mind:
    title: Never mind
    icon: mdi:close-circle-outline
    description: нічого не робити
    # Said whole only: "скасуй таймер" is the timer's.
    # "Забути": "забудь" as the model often writes it.
    examples: [забудь, "забудь [про це]", забути, нічого, не треба, "нічого не треба", скасуй, відміна, неважливо,
               проїхали]

  # Lights here, in an area or on a floor named, or a device by name.
  turn_on:
    title: Turn on
    icon: mdi:lightbulb-on-outline
    description: увімкнути світло
    require: [[світло, лампу, лампи, лампа, лампочку, люстру, освітлення, підсвітку],
              [увімкни, ввімкни, увімкніть, ввімкніть, умкни, увімкне, ввімкне, включи, увімкнути, ввімкнути, запали,
               засвіти]]
    optional: [[все, усе, всі, усі], [всюди, скрізь, у всьому будинку, в усьому будинку, у всьому домі, в усьому домі]]
    exclude: [вимкни, вимкніть, вимкнути, виключи, погаси, чи, колір, яскравість]
    intent:
      name: HassTurnOn
      slots: {domain: light}
    verbosity: beep
    response:
      done:
        brief: Світло увімкнено.
        specific: Світло {{ place.said }} увімкнено.
        verbose: >-
          {%- set ns = namespace(names=result.names or []) -%}
          {%- set n = ns.names | count -%}
          {%- if n == 0 -%}
          Світло {{ place.said }} увімкнено.
          {%- elif n > 4 -%}
          Увімкнено {{ n }} {{ 'лампу' if n % 10 == 1 and n % 100 != 11 else ('лампи' if n % 10 in [2, 3, 4]
            and n % 100 not in [12, 13, 14] else 'ламп') }} {{ place.said }}.
          {%- else -%}
          Увімкнено {{ place.said }}: {{ (ns.names[:-1] | join(', ') ~ ' і ' ~ ns.names[-1]) if n > 1 else ns.names[0] }}.
          {%- endif -%}
    variants:
      here:
        title: Turn on the lights in this satellite's area
        needs:
          - The lights in the satellite's area (Satellites page) are the ones it
            turns on.
      device:
        <<: *device
        title: Turn on a device by name
        icon: mdi:toggle-switch-outline
        description: увімкнути пристрій
        require: [[увімкни, ввімкни, увімкніть, ввімкніть, умкни, увімкне, ввімкне, включи, увімкнути, ввімкнути]]
        exclude: [вимкни, вимкніть, вимкнути, виключи, чи, музику, звук]
        intent: HassTurnOn
        response:
          done:
            brief: Увімкнено.
            specific: "Увімкнено: {{ state_attr(slots.entity[0], 'friendly_name') }}."
            verbose: "Увімкнено {{ place.said }}: {{ state_attr(slots.entity[0], 'friendly_name') }}."
        needs:
          - Add names for the devices it may turn on (Names page).
      place:
        <<: *place
        title: Turn on the lights in an area or floor

  turn_off:
    title: Turn off
    icon: mdi:lightbulb-off-outline
    description: вимкнути світло
    require: [[світло, лампу, лампи, лампа, лампочку, люстру, освітлення, підсвітку],
              [вимкни, вимкніть, вимкнути, виключи, погаси, погасіть, загаси]]
    optional: [[все, усе, всі, усі], [всюди, скрізь, у всьому будинку, в усьому будинку, у всьому домі, в усьому домі]]
    exclude: [увімкни, ввімкни, увімкніть, ввімкніть, увімкнути, включи, чи]
    intent:
      name: HassTurnOff
      slots: {domain: light}
    verbosity: beep
    response:
      done:
        brief: Світло вимкнено.
        specific: Світло {{ place.said }} вимкнено.
        verbose: >-
          {%- set ns = namespace(names=result.names or []) -%}
          {%- set n = ns.names | count -%}
          {%- if n == 0 -%}
          Світло {{ place.said }} вимкнено.
          {%- elif n > 4 -%}
          Вимкнено {{ n }} {{ 'лампу' if n % 10 == 1 and n % 100 != 11 else ('лампи' if n % 10 in [2, 3, 4]
            and n % 100 not in [12, 13, 14] else 'ламп') }} {{ place.said }}.
          {%- else -%}
          Вимкнено {{ place.said }}: {{ (ns.names[:-1] | join(', ') ~ ' і ' ~ ns.names[-1]) if n > 1 else ns.names[0] }}.
          {%- endif -%}
    variants:
      here:
        title: Turn off the lights in this satellite's area
        needs:
          - The lights in the satellite's area (Satellites page) are the ones it
            turns off.
      device:
        <<: *device
        title: Turn off a device by name
        icon: mdi:toggle-switch-off-outline
        description: вимкнути пристрій
        require: [[вимкни, вимкніть, вимкнути, виключи]]
        exclude: [увімкни, ввімкни, увімкніть, увімкнути, включи, чи, музику, звук, таймер, будильник]
        intent: HassTurnOff
        response:
          done:
            brief: Вимкнено.
            specific: "Вимкнено: {{ state_attr(slots.entity[0], 'friendly_name') }}."
            verbose: "Вимкнено {{ place.said }}: {{ state_attr(slots.entity[0], 'friendly_name') }}."
        needs:
          - Add names for the devices it may turn off (Names page).
      place:
        <<: *place
        title: Turn off the lights in an area or floor

  any_lights_on:
    title: Are any lights on
    icon: mdi:lightbulb-question
    description: дізнатися, де горить світло
    # No example sentences: one said word for word carries no area or floor.
    require: [[чи, де], [світло, лампа, лампи, лампочка, люстра], [горить, горять, увімкнене, увімкнено, увімкнена,
              увімкнені, ввімкнене, ввімкнено, світить, світиться]]
    optional: [[десь, ще, досі, якесь, якась, якісь]]
    exclude: [увімкни, ввімкни, вимкни, включи, погаси]
    response: >-
      {%- set named = slots.area or slots.floor -%}
      {%- set ns = namespace(areas=slots.area or [], on=[]) -%}
      {%- for f in slots.floor or [] -%}
      {%- set ns.areas = ns.areas + (floor_areas(f) | list) -%}
      {%- endfor -%}
      {%- if not named and satellite.area_id -%}
      {%- set ns.areas = [satellite.area_id] -%}
      {%- endif -%}
      {%- set where = (' ' ~ place.said) if place.said else '' -%}
      {%- for s in states.light if s.entity_id in exposed and (not ns.areas or area_id(s.entity_id) in ns.areas) and s.state == 'on' -%}
      {%- set ns.on = ns.on + [s.name] -%}
      {%- endfor -%}
      {%- set count = ns.on | count -%}
      {%- if count == 0 -%}
      Ні, світло{{ where }} не горить.
      {%- elif count > 3 -%}
      Так, {{ where | trim ~ ' ' if where else '' }}горить {{ count }} {{ 'лампа' if count % 10 == 1 and count % 100 != 11
        else ('лампи' if count % 10 in [2, 3, 4] and count % 100 not in [12, 13, 14] else 'ламп') }}.
      {%- else -%}
      Так, горить: {{ (ns.on[:-1] | join(', ') ~ ' і ' ~ ns.on[-1]) if count > 1 else ns.on[0] }}.
      {%- endif -%}
    variants:
      here:
        title: Are any lights on in this satellite's area
        needs:
          - The satellite's area (Satellites page) is the one it asks about.
      device:
        <<: *device
        title: Is a device on, by name
        icon: mdi:toggle-switch-outline
        description: дізнатися, чи увімкнений пристрій
        # "Чи" may be left out, as it often is: "Торшер увімкнений?".
        require: null
        optional: [[чи], [ще, досі, зараз]]
        names:
          entity: {count: 1, domains: [light, switch, fan, input_boolean]}
          area: {count: 1}
        lists:
          asked: {list: on_off}
        combinations: [[entity, asked], [entity, area, asked]]
        # Said with a verb, which agrees with no name: "Торшер горить",
        # "Вентилятор не працює".
        response: >-
          {%- set e = slots.entity[0] -%}
          {%- set state = states(e) -%}
          {%- set verb = 'горить' if e.startswith('light.') else 'працює' -%}
          {%- set name = state_attr(e, 'friendly_name') -%}
          {%- if state == 'on' -%}
          {{ 'Так' if slots.asked == 'on' else 'Ні' }}, {{ name }} {{ verb }}.
          {%- elif state == 'off' -%}
          {{ 'Так' if slots.asked == 'off' else 'Ні' }}, {{ name }} не {{ verb }}.
          {%- else -%}
          {{ name }}: {{ {'unavailable': 'недоступно', 'unknown': 'у невідомому стані'}.get(state, state) }}.
          {%- endif -%}
        needs:
          - Add names for the lights and switches it may ask about (Names page).
      place:
        <<: *place
        title: Are any lights on in an area or floor

  set_brightness:
    title: Set the brightness
    icon: mdi:brightness-6
    description: змінити яскравість світла
    require: [[яскравість, яскравості, відсотків, відсотки, відсоток]]
    optional: [[встанови, встановіть, постав, зроби, зміни, збав, приглуши, налаштуй], [світло, лампу, лампи, люстру],
               [яскравість], [відсотків, відсотки, відсоток, відсотка], [на, до]]
    # A question: "скільки буде 15 відсотків від 80".
    exclude: [скільки, що, яка, який, обчисли, порахуй, від, гучність, звук]
    number: percentage
    intent:
      name: HassLightSet
      slots: {brightness: "{{ slots.percentage }}"}
    verbosity: beep
    response:
      done:
        brief: Яскравість змінено.
        specific: >-
          {%- set p = slots.percentage | int -%}
          {%- set word = 'відсоток' if p % 10 == 1 and p % 100 != 11 else ('відсотки' if p % 10 in [2, 3, 4]
            and p % 100 not in [12, 13, 14] else 'відсотків') -%}
          {{ (state_attr(slots.entity[0], 'friendly_name') ~ ': яскравість') if slots.entity
          else 'Яскравість ' ~ place.said ~ ':' }} {{ p }} {{ word }}.
    variants:
      here:
        title: Set the brightness in this satellite's area
      device:
        <<: *device
        title: Set the brightness of a light by name
        names:
          entity: {count: 1, domains: [light]}
          area: {count: 1}
        combinations: [[entity, percentage], [entity, area, percentage]]
        needs:
          - Add names for the lights it may dim (Names page).
      place:
        <<: *place
        title: Set the brightness in an area or floor
        combinations: [[area, percentage], [floor, percentage]]

  light_color:
    title: Set the light color
    icon: mdi:format-color-fill
    description: змінити колір світла
    # "Зроби світло синім", "зміни колір лампи на червоний", "постав торшер на зелений".
    require: [[зроби, зміни, постав, встанови, колір, кольором], [світло, світла, лампу, лампи, люстру, підсвітку,
              освітлення]]
    optional: [[колір, кольору, кольором], [на]]
    exclude: [яскравість, температуру, відсотків]
    lists:
      color: {list: colors}
    intent:
      name: HassLightSet
      slots: {color: "{{ slots.color }}"}
    verbosity: beep
    response:
      done:
        brief: Колір змінено.
        specific: >-
          {%- set colors = {'red': ['червоний', 'червоне'], 'orange': ['помаранчевий', 'помаранчеве'],
            'yellow': ['жовтий', 'жовте'], 'green': ['зелений', 'зелене'], 'blue': ['синій', 'синє'],
            'purple': ['фіолетовий', 'фіолетове'], 'pink': ['рожевий', 'рожеве'], 'white': ['білий', 'біле'], 'turquoise': ['бірюзовий', 'бірюзове'], 'magenta': ['пурпуровий', 'пурпурове']} -%}
          {%- set color = colors.get(slots.color, [slots.color, slots.color]) -%}
          {%- if slots.entity -%}
          {{ state_attr(slots.entity[0], 'friendly_name') }}: колір {{ color[0] }}.
          {%- else -%}
          Світло {{ place.said }} тепер {{ color[1] }}.
          {%- endif -%}
    variants:
      here:
        title: Set the light color in this satellite's area
      device:
        <<: *device
        title: Set the color of a light by name
        require: [[зроби, зміни, постав, встанови, колір, кольором]]
        names:
          entity: {count: 1, domains: [light]}
          area: {count: 1}
        combinations: [[entity, color], [entity, area, color]]
        needs:
          - Add names for the lights it may color (Names page).
      place:
        <<: *place
        title: Set the light color in an area or floor
        combinations: [[area, color], [floor, color]]

  set_temperature:
    title: Set the temperature
    icon: mdi:thermometer
    description: встановити температуру
    require: [[температуру, температура, градусів, градуси, градус, градуса, опалення]]
    optional: [[встанови, встановіть, постав, зроби, підніми, знизь, зміни, налаштуй], [температуру, опалення,
               термостат], [градусів, градуси, градус, градуса], [на, до]]
    # A question about degrees is not a setting: "скільки буде 20 градусів
    # Цельсія за Фаренгейтом", "яка температура у вітальні".
    exclude: [скільки, яка, який, що, переведи, конвертуй, цельсія, фаренгейта, цельсієм, фаренгейтом]
    number: temperature
    intent:
      name: HassClimateSetTemperature
      slots: {temperature: "{{ slots.temperature }}"}
    # Not seen at once, and a misheard number matters: said.
    verbosity: specific
    response:
      done:
        brief: Температуру встановлено.
        specific: >-
          {%- set t = slots.temperature | float -%}
          {%- set n = t | int -%}
          {%- set said = n if t == n else (t | string | replace('.', ' кома ')) -%}
          {%- set word = 'градуса' if t != n else ('градус' if n % 10 == 1 and n % 100 != 11 else ('градуси'
            if n % 10 in [2, 3, 4] and n % 100 not in [12, 13, 14] else 'градусів')) -%}
          {{ (state_attr(slots.entity[0], 'friendly_name') ~ ':') if slots.entity
          else 'Температуру ' ~ place.said ~ ' встановлено на' }} {{ said }} {{ word }}.
    variants:
      here:
        title: Set the temperature in this satellite's area
      device:
        <<: *device
        title: Set the temperature of a thermostat by name
        names:
          entity: {count: 1, domains: [climate]}
          area: {count: 1}
        combinations: [[entity, temperature], [entity, area, temperature]]
        needs:
          - Add names for the thermostats it may set (Names page).
      place:
        <<: *place
        title: Set the temperature in an area or floor
        combinations: [[area, temperature], [floor, temperature]]

  weather:
    title: What's the weather
    icon: mdi:weather-partly-cloudy
    description: дізнатися погоду
    examples: ["яка [сьогодні] погода", "яка погода [сьогодні]", "чи буде дощ [сьогодні]", "що з погодою",
               "який прогноз погоди"]
    require: [[погода, погоду, погоди, погодою, прогноз, дощ, дощу]]
    # Not a timer's time: "скільки часу залишилось".
    exclude: [залишилось, залишилося, таймер, будильник, скільки]
    slots:
      entity: [weather.home]
    response: >-
      {%- set words = {'clear-night': 'ясно', 'cloudy': 'хмарно', 'exceptional': 'незвичайна погода',
        'fog': 'туман', 'hail': 'град', 'lightning': 'гроза', 'lightning-rainy': 'гроза з дощем',
        'partlycloudy': 'мінлива хмарність', 'pouring': 'злива', 'rainy': 'дощ', 'snowy': 'сніг',
        'snowy-rainy': 'мокрий сніг', 'sunny': 'сонячно', 'windy': 'вітряно', 'windy-variant': 'вітряно і хмарно'} -%}
      {%- set state = states(slots.entity[0]) -%}
      {%- set t = state_attr(slots.entity[0], 'temperature') | float(0) | round | int -%}
      {%- set n = t | abs -%}
      Зараз {{ words.get(state, state) }}, {{ t }} {{ 'градус' if n % 10 == 1 and n % 100 != 11 else ('градуси'
        if n % 10 in [2, 3, 4] and n % 100 not in [12, 13, 14] else 'градусів') }}.
    needs:
      - Set the fixed slot entity to your weather entity (weather.home here).

  shopping_list_add:
    title: Add to the shopping list
    icon: mdi:cart-plus
    description: додати щось до списку покупок
    require: [[додай, додайте, запиши, запишіть, внеси, допиши], [список покупок, списку покупок, покупки, покупок,
              список, списку]]
    optional: [[до, в, у, на]]
    wildcard:
      slot: item
      after: [додай, додайте, запиши, запишіть, внеси, допиши]
      before: [до, в, у, на]
      bounded: true
      max_words: 5
    action:
      action: todo.add_item
      target:
        entity_id: todo.shopping_list
      data:
        item: "{{ slots.item }}"
    verbosity: specific
    response:
      done:
        brief: Додано до списку покупок.
        specific: "Додано {{ slots.item }} до списку покупок."

  shopping_list_remove:
    title: Take off the shopping list
    icon: mdi:cart-minus
    description: викреслити щось зі списку покупок
    require: [[видали, видаліть, викресли, викресліть, прибери, вилучи], [список покупок, списку покупок, покупок,
              список, списку]]
    optional: [[зі, з, із]]
    wildcard:
      slot: item
      after: [видали, видаліть, викресли, викресліть, прибери, вилучи]
      before: [зі, з, із]
      bounded: true
      max_words: 5
    action:
      action: todo.remove_item
      target:
        entity_id: todo.shopping_list
      data:
        item: "{{ slots.item }}"
    verbosity: specific
    response:
      done:
        brief: Викреслено зі списку покупок.
        specific: "Викреслено {{ slots.item }} зі списку покупок."

  todo_add:
    title: Add to the to-do list
    icon: mdi:format-list-checks
    description: додати щось до списку справ
    require: [[додай, додайте, запиши, запишіть, внеси], [список справ, списку справ, справи, справ, список завдань,
              списку завдань, завдання]]
    optional: [[до, в, у]]
    wildcard:
      slot: item
      after: [додай, додайте, запиши, запишіть, внеси]
      before: [до, в, у]
      bounded: true
      max_words: 8
    action:
      action: todo.add_item
      target:
        entity_id: todo.to_do
      data:
        item: "{{ slots.item }}"
    verbosity: specific
    response:
      done:
        brief: Додано до списку справ.
        specific: "Додано {{ slots.item }} до списку справ."
    needs:
      - Point it at your to-do list (todo.to_do here).

  remind_me:
    title: Remember something
    icon: mdi:note-edit-outline
    description: додати нагадування
    # "Нагадай мені подзвонити мамі", "нагадай, що треба купити хліб".
    require: [[нагадай, нагадайте, нагадати]]
    optional: [[мені, нам], [що, щоб, про]]
    wildcard:
      slot: reminder
      after: [мені, нам, що, щоб, про, нагадай, нагадайте]
      to_end: true
      max_words: 10
    # The speaker's own to-do list, when anyone has one (People page).
    slots:
      entity: [todo.reminders]
    mine: todo_list
    action:
      action: todo.add_item
      target:
        entity_id: "{{ slots.entity }}"
      data:
        item: "{{ slots.reminder }}"
    verbosity: specific
    response:
      done:
        brief: Нагадаю.
        specific: "Нагадаю: {{ slots.reminder }}."
    needs:
      - Point it at a to-do list (todo.reminders here). Where someone has a
        to-do list of their own (People page), theirs, and they must be
        recognized.

  scene:
    title: Activate a scene
    icon: mdi:palette
    description: увімкнути режим кіно
    examples: ["[увімкни] режим кіно", "час кіно", "кіновечір"]
    scene: scene.movie_time
    verbosity: beep
    response:
      done:
        brief: Готово.
    needs:
      - Pick the scene, and change the examples to what you want to say.

  script:
    title: Run a script
    icon: mdi:script-text-outline
    description: побажати на добраніч
    examples: [на добраніч, добраніч, надобраніч, добрий вечір і на добраніч]
    script: script.good_night
    response: "{{ result.speech if result and result.speech else 'На добраніч.' }}"
    needs:
      - Pick the script. It gets slots, satellite, speaker and target as variables,
        and anything it returns (stop with response_variable) as result.
