# Covers and locks (Ukrainian), as the English library's home.yaml: opening,
# closing, locking, and asking about them. Covers by type ("ролети", "гаражні
# ворота") need no names: their device class says what they are, and the
# area or floor named -- else the satellite's area -- where. When nothing of
# that type is in the satellite's area, every one in the home is meant.
#
# "Ролети" are roller shutters (device class shutter), as they are mostly
# outside in Ukraine; fabric roller shades are "рулонні штори" (shade),
# venetian blinds "жалюзі" (blind), curtains "штори" (curtain). Covers are
# opened with "відкрий", "відчини" or "підніми" and closed with "закрий",
# "зачини" or "опусти"; a lock is locked with "замкни" or "закрий на ключ".
title: Covers and locks
icon: mdi:door

# What the versions add to a command (merged into them with <<).
shared:
  cover: &cover
    names:
      entity: {count: 1, domains: [cover]}
      area: {count: 1}
    # A room with the device picks it out: the one of that name there.
    combinations: [[entity], [entity, area]]
  place: &place
    names:
      area: {count: 1}
      floor: {count: 1}
    needs:
      - Add names for the areas and floors it may act in (Names page).
  nothing_here: &nothing_here
    - The satellite's area (set on its page) is where. When nothing of the type
      is there, every one in the home is meant ("відкрий гаражні ворота" from
      the kitchen).

commands:
  open_covers:
    title: Open covers
    icon: mdi:blinds-open
    description: відкрити ролети
    require: [[відкрий, відкрийте, відчини, відчиніть, підніми, підніміть, відкрити, відчинити, підняти]]
    optional: [[всі, усі, все], [повністю, до кінця]]
    exclude: [чи, закрий, зачини, опусти, ключ, замок, замкни, відімкни, гучність, музику, звук, яскравість,
              температуру]
    lists:
      device_class: {list: cover_classes}
    intent:
      name: HassTurnOn
      slots: {domain: cover, device_class: "{{ slots.device_class }}"}
      anywhere: true
    verbosity: specific
    response:
      done: >-
        {%- set kinds = {'awning': ['маркізу', 'маркізи'], 'blind': ['жалюзі', 'жалюзі'],
          'curtain': ['штору', 'штори'], 'door': ['двері', 'двері'], 'garage': ['гаражні ворота', 'гаражні ворота'],
          'gate': ['ворота', 'ворота'], 'shade': ['рулонну штору', 'рулонні штори'], 'shutter': ['ролету', 'ролети'],
          'window': ['вікно', 'вікна']} -%}
        {%- set where = (' ' ~ place.said) if (slots.area or slots.floor) else '' -%}
        Відкриваю {{ kinds[slots.device_class][0 if result.count == 1 else 1] }}{{ where }}.
      no_devices: >-
        {%- set kinds = {'awning': 'маркіз', 'blind': 'жалюзі', 'curtain': 'штор', 'door': 'дверей',
          'garage': 'гаражних воріт', 'gate': 'воріт', 'shade': 'рулонних штор', 'shutter': 'ролет',
          'window': 'вікон'} -%}
        {%- set where = (' ' ~ place.said) if (slots.area or slots.floor) else '' -%}
        Немає {{ kinds[slots.device_class] }}{{ where }}.
    variants:
      here:
        title: Open the blinds in this satellite's area
        needs: *nothing_here
      device:
        <<: *cover
        title: Open a cover by name
        icon: mdi:window-shutter-open
        description: відкрити щось
        lists: null
        intent: HassTurnOn
        # Out of sight, or what keeps people out: said.
        verbosity: specific
        response:
          done:
            brief: Відкриваю.
            specific: "Відкриваю: {{ names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) }}."
        needs:
          - Add names for the covers it may open (Names page).
      place:
        <<: *place
        title: Open the blinds in an area or floor
        combinations: [[area, device_class], [floor, device_class]]

  close_covers:
    title: Close covers
    icon: mdi:blinds
    description: закрити ролети
    require: [[закрий, закрийте, зачини, зачиніть, опусти, опустіть, закрити, зачинити, опустити]]
    optional: [[всі, усі, все], [повністю, до кінця]]
    # "Закрий двері на ключ" locks them.
    exclude: [чи, відкрий, відчини, підніми, ключ, замок, замкни, відімкни, гучність, музику, звук, яскравість,
              температуру]
    lists:
      device_class: {list: cover_classes}
    intent:
      name: HassTurnOff
      slots: {domain: cover, device_class: "{{ slots.device_class }}"}
      anywhere: true
    verbosity: specific
    response:
      done: >-
        {%- set kinds = {'awning': ['маркізу', 'маркізи'], 'blind': ['жалюзі', 'жалюзі'],
          'curtain': ['штору', 'штори'], 'door': ['двері', 'двері'], 'garage': ['гаражні ворота', 'гаражні ворота'],
          'gate': ['ворота', 'ворота'], 'shade': ['рулонну штору', 'рулонні штори'], 'shutter': ['ролету', 'ролети'],
          'window': ['вікно', 'вікна']} -%}
        {%- set where = (' ' ~ place.said) if (slots.area or slots.floor) else '' -%}
        Закриваю {{ kinds[slots.device_class][0 if result.count == 1 else 1] }}{{ where }}.
      no_devices: >-
        {%- set kinds = {'awning': 'маркіз', 'blind': 'жалюзі', 'curtain': 'штор', 'door': 'дверей',
          'garage': 'гаражних воріт', 'gate': 'воріт', 'shade': 'рулонних штор', 'shutter': 'ролет',
          'window': 'вікон'} -%}
        {%- set where = (' ' ~ place.said) if (slots.area or slots.floor) else '' -%}
        Немає {{ kinds[slots.device_class] }}{{ where }}.
    variants:
      here:
        title: Close the blinds in this satellite's area
        needs: *nothing_here
      device:
        <<: *cover
        title: Close a cover by name
        icon: mdi:window-shutter
        description: закрити щось
        lists: null
        intent: HassTurnOff
        # Out of sight, or what keeps people out: said.
        verbosity: specific
        response:
          done:
            brief: Закриваю.
            specific: "Закриваю: {{ names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) }}."
        needs:
          - Add names for the covers it may close (Names page).
      place:
        <<: *place
        title: Close the blinds in an area or floor
        combinations: [[area, device_class], [floor, device_class]]

  lock:
    title: Lock a lock
    icon: mdi:lock
    description: замкнути двері
    require: [[замкни, замкніть, замкнути, заблокуй, закрий на ключ, закрий ... на ключ, зачини на ключ,
               зачини ... на ключ, закрий на замок, закрий ... на замок]]
    exclude: [відімкни, відімкніть, розблокуй, чи, всі, усі, все]
    names:
      entity: {count: 1, domains: [lock]}
      area: {count: 1}
    # A room with the device picks it out: the one of that name there.
    combinations: [[entity], [entity, area]]
    intent: HassTurnOn
    # Out of sight, or what keeps people out: said.
    verbosity: specific
    response:
      done:
        brief: Замикаю.
        specific: "Замикаю: {{ names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) }}."
    needs:
      - Add names for the locks it may lock (Names page).

  unlock:
    title: Unlock a lock
    icon: mdi:lock-open-variant
    description: відімкнути замок
    require: [[відімкни, відімкніть, відімкнути, розблокуй, розблокуйте, відкрий замок, відкрий ... замок]]
    exclude: [чи, замкни, заблокуй]
    names:
      entity: {count: 1, domains: [lock]}
      area: {count: 1}
    # A room with the device picks it out: the one of that name there.
    combinations: [[entity], [entity, area]]
    intent: HassTurnOff
    # Out of sight, or what keeps people out: said.
    verbosity: specific
    response:
      done:
        brief: Відмикаю.
        specific: "Відмикаю: {{ names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) }}."
    needs:
      - Add names for the locks it may unlock (Names page). Anyone the satellite
        hears can unlock them; keep it to the satellites that should with a
        command group.

  lock_all:
    title: Lock up
    icon: mdi:shield-lock
    description: замкнути всі двері
    examples: ["замкни всі двері", "замкни все", "закрий усе на ключ", "зачини всі двері на ключ"]
    require: [[замкни, замкніть, заблокуй, на ключ, на замок], [всі, усі, все, усе]]
    optional: [[двері, замки]]
    exclude: [відімкни, розблокуй, чи]
    intent:
      name: HassTurnOn
      slots: {domain: lock}
      home: true
    verbosity: specific
    response: Замикаю всі двері.

  are_covers_open:
    title: Are covers open
    icon: mdi:blinds-horizontal
    description: дізнатися, чи відкриті ролети
    # "Чи" may be left out, as it often is: "Ролети відкриті?".
    optional: [[чи], [всі, усі, якісь, якесь], [ще, досі]]
    lists:
      device_class: {list: cover_classes}
      asked: {list: open_closed}
    # Each kind as one and as many, and its participle's ending as one:
    # "вікно закрите", "штора закрита", "ролети закриті".
    response: >-
      {%- set kinds = {'awning': ['маркіза', 'маркізи', 'а'], 'blind': ['жалюзі', 'жалюзі', 'і'],
        'curtain': ['штора', 'штори', 'а'], 'door': ['двері', 'двері', 'і'],
        'garage': ['гаражні ворота', 'гаражні ворота', 'і'], 'gate': ['ворота', 'ворота', 'і'],
        'shade': ['рулонна штора', 'рулонні штори', 'а'], 'shutter': ['ролета', 'ролети', 'а'],
        'window': ['вікно', 'вікна', 'е']} -%}
      {%- set missing = {'awning': 'маркіз', 'blind': 'жалюзі', 'curtain': 'штор', 'door': 'дверей',
        'garage': 'гаражних воріт', 'gate': 'воріт', 'shade': 'рулонних штор', 'shutter': 'ролет',
        'window': 'вікон'} -%}
      {%- set kind = kinds[slots.device_class] -%}
      {%- set named = slots.area or slots.floor -%}
      {%- set ns = namespace(areas=slots.area or [], picked=[], opened=[]) -%}
      {%- for f in slots.floor or [] -%}
      {%- set ns.areas = ns.areas + (floor_areas(f) | list) -%}
      {%- endfor -%}
      {%- if not named and satellite.area_id -%}
      {%- set ns.areas = [satellite.area_id] -%}
      {%- endif -%}
      {%- set where = (' ' ~ place.said) if named else '' -%}
      {%- set every = states.cover | selectattr('entity_id', 'in', devices) | selectattr('attributes.device_class', 'defined')
        | selectattr('attributes.device_class', 'eq', slots.device_class) | list -%}
      {%- for s in every if devices[s.entity_id] in ns.areas -%}
      {%- set ns.picked = ns.picked + [s] -%}
      {%- endfor -%}
      {%- set covers = ns.picked if ns.picked or named else every -%}
      {%- for s in covers if s.state in ['open', 'opening'] -%}
      {%- set ns.opened = ns.opened + [names.get(s.entity_id, s.name)] -%}
      {%- endfor -%}
      {%- set count = ns.opened | count -%}
      {%- if not covers -%}
      Немає {{ missing[slots.device_class] }}{{ where }}.
      {%- elif count == 0 -%}
      {{ 'Так' if slots.asked == 'closed' else 'Ні' }},
      {{- (' ' ~ kind[0] ~ where ~ ' закрит' ~ kind[2]) if covers | count == 1 else (' ' ~ kind[1] ~ where ~ ' закриті') }}.
      {%- else -%}
      {{ 'Так' if slots.asked == 'open' else 'Ні' }}, відкрито: {{ (ns.opened[:-1] | join(', ') ~ ' і ' ~ ns.opened[-1])
        if count > 1 else ns.opened[0] }}.
      {%- endif -%}
    variants:
      here:
        title: Are the blinds open in this satellite's area
        needs: *nothing_here
      device:
        <<: *cover
        title: Is a cover open, by name
        icon: mdi:window-shutter-alert
        description: дізнатися, чи щось відкрите
        lists:
          asked: {list: open_closed}
        combinations: [[entity, asked], [entity, area, asked]]
        response: >-
          {%- set e = slots.entity[0] -%}
          {%- set state = states(e) -%}
          {%- set words = {'open': 'відкрито', 'closed': 'закрито', 'opening': 'відкривається',
            'closing': 'закривається', 'unavailable': 'недоступно', 'unknown': 'у невідомому стані'} -%}
          {%- set said = names.get(e, state_attr(e, 'friendly_name')) ~ ': ' ~ words.get(state, state) ~ '.' -%}
          {%- if state in ['open', 'closed'] -%}
          {{ 'Так' if state == slots.asked else 'Ні' }}, {{ said }}
          {%- else -%}
          {{ said }}
          {%- endif -%}
        needs:
          - Add names for the covers it may ask about (Names page).
      place:
        <<: *place
        title: Are the blinds open in an area or floor
        combinations: [[area, device_class, asked], [floor, device_class, asked]]

  is_locked:
    title: Is a lock locked
    icon: mdi:lock-question
    description: дізнатися, чи замкнені двері
    # "Чи" may be left out, as it often is: "Вхідні двері замкнені?".
    optional: [[чи], [ще, досі, зараз]]
    names:
      entity: {count: 1, domains: [lock, binary_sensor]}
      area: {count: 1}
    # A room with the device picks it out: the one of that name there.
    combinations: [[entity, asked], [entity, area, asked]]
    lists:
      asked: {list: locked_unlocked}
    response: >-
      {%- set e = slots.entity[0] -%}
      {%- if e.startswith('binary_sensor.') -%}
      {%- set state = 'unlocked' if is_state(e, 'on') else ('locked' if is_state(e, 'off') else states(e)) -%}
      {%- else -%}
      {%- set state = states(e) -%}
      {%- endif -%}
      {%- set words = {'locked': 'замкнено', 'unlocked': 'відімкнено', 'jammed': 'заклинило',
        'locking': 'замикається', 'unlocking': 'відмикається', 'open': 'відчинено',
        'unavailable': 'недоступно', 'unknown': 'у невідомому стані'} -%}
      {%- set said = names.get(e, state_attr(e, 'friendly_name')) ~ ': ' ~ words.get(state, state) ~ '.' -%}
      {%- if state in ['locked', 'unlocked'] -%}
      {{ 'Так' if state == slots.asked else 'Ні' }}, {{ said }}
      {%- else -%}
      {{ said }}
      {%- endif -%}
    needs:
      - Add names for the locks it may ask about (Names page). A binary sensor of
        the lock class works too (on is unlocked); type its entity id there.

  all_locked:
    title: Is everything locked
    icon: mdi:lock-alert
    description: дізнатися, чи все замкнено
    # "Чи" may be left out, as it often is: "Усі двері замкнені?".
    require: [[все, усе, всі, усі, двері]]
    optional: [[чи], [двері, замки]]
    lists:
      asked: {list: locked_unlocked}
    response: >-
      {%- set words = {'unlocked': 'відімкнено', 'jammed': 'заклинило', 'locking': 'замикається',
        'unlocking': 'відмикається', 'open': 'відчинено', 'unavailable': 'недоступно',
        'unknown': 'у невідомому стані'} -%}
      {%- set ns = namespace(open=[], total=0) -%}
      {%- for s in states.lock if s.entity_id in devices -%}
      {%- set ns.total = ns.total + 1 -%}
      {%- if s.state != 'locked' -%}
      {%- set ns.open = ns.open + [names.get(s.entity_id, s.name) ~ ': ' ~ words.get(s.state, s.state)] -%}
      {%- endif -%}
      {%- endfor -%}
      {%- for s in states.binary_sensor | selectattr('entity_id', 'in', devices) | selectattr('attributes.device_class', 'defined')
        | selectattr('attributes.device_class', 'eq', 'lock') -%}
      {%- set ns.total = ns.total + 1 -%}
      {%- if s.state != 'off' -%}
      {%- set ns.open = ns.open + [names.get(s.entity_id, s.name) ~ ': ' ~ ('відімкнено' if s.state == 'on' else words.get(s.state, s.state))] -%}
      {%- endif -%}
      {%- endfor -%}
      {%- set count = ns.open | count -%}
      {%- set asked = slots.asked or 'locked' -%}
      {%- if ns.total == 0 -%}
      Замків немає.
      {%- elif count == 0 -%}
      {{ 'Так' if asked == 'locked' else 'Ні' }}, усе замкнено.
      {%- else -%}
      {{ 'Так' if asked == 'unlocked' else 'Ні' }}, {{ ns.open | join('; ') }}.
      {%- endif -%}
