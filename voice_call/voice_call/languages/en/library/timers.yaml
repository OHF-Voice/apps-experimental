# Timers, on the satellite that set them. They need the Voice Call integration
# in Home Assistant, which gives each satellite a voice_timer_list; the app
# starts, matches and rings them.
#
# Keywords follow adapt-ctc's core timer intents (adapt_ctc/examples/intents/
# core.yaml). A timer is picked out by:
#   timer_name  a running timer's name, recognized from the running_timers
#               list the app keeps current: "cancel the pizza timer"
#   timer       free text, for naming a new timer, or matched loosely to the
#               running ones: "a timer named chicken nuggets"
#   duration    "the 5 minute timer"
# or it is the only one running.
#
# Timers are the satellite's own, so they have no versions (variants) for a
# device or a place named. Alarms and reminders with a time are events on the
# Voice Call calendar in Home Assistant, which the app makes, and ring the
# satellite that set them.
title: Timers
icon: mdi:timer-outline

commands:
  start_timer:
    title: Start a timer
    icon: mdi:timer-plus-outline
    description: set a timer
    # Said quickly, "timer" loses its "r": "set a time for ninety seconds". The
    # unit keeps "what time is it" out.
    require: [[timer, time], [minutes, minute, seconds, second, hours, hour]]
    optional: [[set, start, create], [for], [named, called, name]]
    wildcard: {slot: timer, before: [timer, time], after: [named, called, name]}
    number: duration
    # Each said whole.
    combinations: [[duration], [duration, timer]]
    timer: start
    verbosity: specific

  set_alarm:
    title: Set an alarm
    icon: mdi:alarm
    description: set an alarm
    # On the Voice Call calendar in Home Assistant: "set an alarm for seven
    # thirty", "wake me up at 6 am", "an alarm for half past six tomorrow
    # morning", "an alarm for every weekday at 6:45". Without am or pm it is
    # the next time that comes round; on another day, the morning.
    require: [[alarm, wake me up, wake me]]
    optional: [[set, make, create, an, a], [for, at]]
    wildcard: {slot: time, after: [for, at, wake me up, wake me], to_end: true, max_words: 9}
    exclude: [what, when, which, cancel, delete, remove, disable]
    timer: alarm
    verbosity: specific
    response:
      missing_time: What time should the alarm be for?

  cancel_alarm:
    title: Cancel an alarm
    icon: mdi:alarm-off
    description: cancel an alarm
    # "cancel my alarm", "delete the 7 o'clock alarm", "turn off the alarm
    # for tomorrow". Said over a ringing alarm without a time, it only stops it.
    require: [[cancel, delete, remove, turn off, disable], [alarm, alarms]]
    optional: [[my, the], [for, at]]
    wildcard: {slot: time, before: [alarm], after: [for, at], max_words: 6}
    combinations: [[], [time]]
    timer: cancel_alarm
    verbosity: specific

  alarm_status:
    title: Say the alarms
    icon: mdi:alarm-check
    description: say which alarms are set
    examples: [what alarms do i have, when is my alarm, do i have any alarms]
    require: [[alarm, alarms]]
    optional: [[what, when, which], [is, are], [do i have, have i got, are there], [my, any], [set]]
    exclude: [cancel, delete, remove, turn off, disable, for, at]
    timer: alarm_status

  cancel_timer:
    title: Cancel a timer
    icon: mdi:timer-off-outline
    description: cancel a timer
    require: [[cancel, stop, delete], [timer, time]]
    optional: [[minutes, minute, seconds, second, hours, hour], [named, called, name]]
    lists:
      timer_name: {list: running_timers}
    wildcard: {slot: timer, before: [timer, time], after: [named, called, name]}
    number: {preset: duration}
    # Each said whole.
    combinations: [[], [timer_name], [timer], [duration]]
    timer: cancel
    verbosity: specific

  cancel_all_timers:
    title: Cancel every timer
    icon: mdi:timer-cancel-outline
    description: cancel all the timers
    require: [[cancel, stop, delete], [all], [timers, timer]]
    timer: cancel_all
    verbosity: specific

  pause_timer:
    title: Pause a timer
    icon: mdi:timer-pause-outline
    description: pause a timer
    require: [[pause, hold], [timer, timers, time]]
    optional: [[minutes, minute, seconds, second, hours, hour], [named, called, name]]
    lists:
      timer_name: {list: running_timers}
    wildcard: {slot: timer, before: [timer, time], after: [named, called, name]}
    number: {preset: duration}
    # Each said whole.
    combinations: [[], [timer_name], [timer], [duration]]
    timer: pause
    verbosity: specific

  resume_timer:
    title: Resume a timer
    icon: mdi:timer-play-outline
    description: resume a timer
    # Parakeet may write "unpause" as one word or two.
    require: [[resume, unpause, un pause, continue], [timer, timers, time]]
    optional: [[minutes, minute, seconds, second, hours, hour], [named, called, name]]
    lists:
      timer_name: {list: running_timers}
    wildcard: {slot: timer, before: [timer, time], after: [named, called, name]}
    number: {preset: duration}
    # Each said whole.
    combinations: [[], [timer_name], [timer], [duration]]
    timer: resume
    verbosity: specific

  timer_status:
    title: How long is left
    icon: mdi:timer-sand
    description: say how long is left on a timer
    examples: [how much time is left, how long is left on my timer]
    require: [[how long, how much time], [left, remaining]]
    optional: [[is], [on], [timer, time], [minutes, minute, seconds, second, hours, hour], [named, called, name]]
    lists:
      timer_name: {list: running_timers}
    wildcard: {slot: timer, before: [timer, time], after: [named, called, name]}
    number: {preset: duration}
    # Each said whole.
    combinations: [[], [timer_name], [timer], [duration]]
    timer: status

  add_time:
    title: Add time to a timer
    icon: mdi:clock-plus-outline
    description: add time to a timer
    require: [[add], [timer, time]]
    optional: [[to], [minutes, minute, seconds, second, hours, hour], [named, called, name]]
    lists:
      timer_name: {list: running_timers}
    wildcard: {slot: timer, before: [timer, time], after: [named, called, name]}
    number: duration
    # Each said whole.
    combinations: [[duration], [timer_name, duration], [duration, timer]]
    timer: add
    verbosity: specific

  subtract_time:
    title: Take time off a timer
    icon: mdi:clock-minus-outline
    description: take time off a timer
    require: [[decrease, reduce, subtract, remove, take off], [timer, time]]
    optional: [[by, from], [minutes, minute, seconds, second, hours, hour], [named, called, name]]
    lists:
      timer_name: {list: running_timers}
    wildcard: {slot: timer, before: [timer, time], after: [named, called, name]}
    number: duration
    # Each said whole.
    combinations: [[duration], [timer_name, duration], [duration, timer]]
    timer: subtract
    verbosity: specific
