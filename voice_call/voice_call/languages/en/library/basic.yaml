# Example commands, offered in the web UI's library. Adding one copies it into
# the home's commands, where it can be changed like any other command.
#
# Each entry is a command (see voice_call/commands.py) plus:
#   title:     what the library calls it
#   needs:     what to set after adding it, shown in the UI
#   variants:  its versions, each added on its own, for what it acts on:
#                here    the satellite it is said to, or its area (nothing named)
#                device  a device by name
#                place   an area or floor by name
#              Each is the command's keys with its own on top (null removes
#              one), with the id <command>_<variant>.
#   formerly:  ids it had before it had versions (where the Commands page
#              lists a command added then)
#
# Keywords follow adapt-ctc's core intents (adapt_ctc/examples/intents/core.yaml),
# which were tuned on the office-multicap corpus.
#
# What acts on devices runs Home Assistant's intents (intent:), as Assist
# would: only on what is exposed to Assist, and the unavailable said.
title: Basics
icon: mdi:home-outline

# What the versions add to a command (merged into them with <<).
shared:
  device: &device
    names:
      entity: {count: 1, domains: [light, switch, fan, media_player, input_boolean, climate]}
      area: {count: 1}
    # A room with the device picks it out: the one of that name there.
    combinations: [[entity], [entity, area]]
  place: &place
    names:
      area: {count: 1}
      floor: {count: 1}
    combinations: [[area], [floor]]
    needs:
      - Add names for the areas and floors it may act in (Names page).
  # A fifth brighter or dimmer (slots.step), never to off: the lights that
  # are on here, or in an area or floor named, of those exposed to Assist --
  # no intent changes brightness by a step -- or a light by name, which
  # comes on to be brightened.
  brightness_step: &brightness_step
    - variables:
        none_on: {outcome: no_lights}
        lights: >-
          {%- if slots.entity -%}
          {{ (slots.entity | select('is_state', 'on') | list) if slots.step | int < 0 else slots.entity }}
          {%- else -%}
          {%- set ns = namespace(ids=[]) -%}
          {%- for s in states.light if s.entity_id in exposed and area_id(s.entity_id) in place.areas and s.state == 'on'
            and s.attributes.supported_color_modes != ['onoff'] -%}
          {%- set ns.ids = ns.ids + [s.entity_id] -%}
          {%- endfor -%}
          {{ ns.ids }}
          {%- endif -%}
    - if: "{{ not lights }}"
      then:
        - stop: No lights to change
          response_variable: none_on
    - repeat:
        for_each: "{{ lights }}"
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ repeat.item }}"
            data:
              brightness_pct: >-
                {{ [[((state_attr(repeat.item, 'brightness') or 0) / 2.55) | round(0) + slots.step | int, 1] | max, 100] | min | int }}
  brightness_said: &brightness_said
    no_lights: >-
      {{ (state_attr(slots.entity[0], 'friendly_name') ~ ' is off.') if slots.entity
      else 'No lights are on ' ~ place.said ~ '.' }}

commands:
  what_time:
    title: What time is it
    icon: mdi:clock-outline
    description: tell the time
    examples: [what time is it]
    require: [[what time]]
    optional: [[is it, it is], [right now, now], [tell me]]
    # Other times: "what time does the store close", "what time is ninety
    # minutes after two" (that one is answered as a question).
    exclude: [does, do, close, open, after, before, until, from, alarm, alarms]
    response: "It's {{ now().strftime('%-I:%M %p') }}."

  what_date:
    title: What's the date
    icon: mdi:calendar-today
    description: tell the date
    examples: ["what's the date [today]", "what day is it [today]"]
    require: [[date, what day]]
    optional: [[tell me], [what is, whats, what's], [today]]
    response: "Today is {{ now().strftime('%A, %B %-d') }}."

  never_mind:
    title: Never mind
    icon: mdi:close-circle-outline
    description: never mind, cancel the request
    # Said whole only: "cancel the timer" is the timer's. Nothing to do, and by
    # default nothing said, not even a sound: the satellite stops listening.
    # Give it a response (Only respond) or a beep to hear that it did.
    examples: [never mind, nevermind, forget it, "cancel [that]", nothing]

  # Lights here, in an area or on a floor named, or a device by name.
  turn_on:
    title: Turn on
    icon: mdi:lightbulb-on-outline
    description: turn on the lights
    require: [[turn on, switch on, turn ... on, switch ... on], [light, lights]]
    optional: [[all], [in, on], [the]]
    intent:
      name: HassTurnOn
      slots: {domain: light}
    verbosity: beep
    response:
      done:
        brief: Turned on the lights.
        specific: Turned on the lights {{ place.said }}.
        verbose: >-
          {%- set ns = namespace(names=result.names or []) -%}
          {%- set n = ns.names | count -%}
          {%- if n == 0 or n > 4 -%}
          Turned on {{ n if n else 'the' }} lights {{ place.said }}.
          {%- else -%}
          Turned on {{ (ns.names[:-1] | join(', ') ~ ' and ' ~ ns.names[-1]) if n > 1 else ns.names[0] }} {{ place.said }}.
          {%- endif -%}
    formerly: [lights_on, device_on]
    variants:
      here:
        title: Turn on the lights in this satellite's area
        needs:
          - The lights in the satellite's area (Satellites page) are the ones it
            turns on.
      device:
        <<: *device
        title: Turn on a device by name
        icon: mdi:toggle-switch-outline
        description: turn on a device
        require: [[turn on, switch on, turn ... on, switch ... on]]
        intent: HassTurnOn
        response:
          done:
            brief: Turned it on.
            specific: Turned on {{ state_attr(slots.entity[0], 'friendly_name') }}.
            verbose: Turned on {{ state_attr(slots.entity[0], 'friendly_name') }} {{ place.said }}.
        needs:
          - Add names for the devices it may turn on (Names page).
      place:
        <<: *place
        title: Turn on the lights in an area or floor

  turn_off:
    title: Turn off
    icon: mdi:lightbulb-off-outline
    description: turn off the lights
    require: [[turn off, switch off, turn ... off, switch ... off], [light, lights]]
    optional: [[all], [in, on], [the], [house, everywhere]]
    intent:
      name: HassTurnOff
      slots: {domain: light}
    verbosity: beep
    response:
      done:
        brief: Turned off the lights.
        specific: Turned off the lights {{ place.said }}.
        verbose: >-
          {%- set ns = namespace(names=result.names or []) -%}
          {%- set n = ns.names | count -%}
          {%- if n == 0 or n > 4 -%}
          Turned off {{ n if n else 'the' }} lights {{ place.said }}.
          {%- else -%}
          Turned off {{ (ns.names[:-1] | join(', ') ~ ' and ' ~ ns.names[-1]) if n > 1 else ns.names[0] }} {{ place.said }}.
          {%- endif -%}
    formerly: [lights_off, device_off]
    variants:
      here:
        title: Turn off the lights in this satellite's area
        needs:
          - The lights in the satellite's area (Satellites page) are the ones it
            turns off.
      device:
        <<: *device
        title: Turn off a device by name
        icon: mdi:toggle-switch-off-outline
        description: turn off a device
        require: [[turn off, switch off, turn ... off, switch ... off]]
        optional: [[in, on], [the]]
        intent: HassTurnOff
        response:
          done:
            brief: Turned it off.
            specific: Turned off {{ state_attr(slots.entity[0], 'friendly_name') }}.
            verbose: Turned off {{ state_attr(slots.entity[0], 'friendly_name') }} {{ place.said }}.
        needs:
          - Add names for the devices it may turn off (Names page).
      place:
        <<: *place
        title: Turn off the lights in an area or floor

  any_lights_on:
    title: Are any lights on
    icon: mdi:lightbulb-question
    description: say which lights are on
    # No example sentences: one said word for word carries no area or floor.
    require: [[are, is], [light, lights], [on]]
    optional: [[any], [in, on], [the]]
    exclude: [turn, switch]
    response: >-
      {%- set named = slots.area or slots.floor -%}
      {%- set ns = namespace(areas=slots.area or [], on=[]) -%}
      {%- for f in slots.floor or [] -%}
      {%- set ns.areas = ns.areas + (floor_areas(f) | list) -%}
      {%- endfor -%}
      {%- if not named and satellite.area_id -%}
      {%- set ns.areas = [satellite.area_id] -%}
      {%- endif -%}
      {%- set where = (' in the ' ~ area_name(slots.area[0])) if slots.area
        else ((' on the ' ~ floor_name(slots.floor[0])) if slots.floor
        else ((' in the ' ~ satellite.area_name) if satellite.area_name else '')) -%}
      {%- for s in states.light if s.entity_id in exposed and (not ns.areas or area_id(s.entity_id) in ns.areas) and s.state == 'on' -%}
      {%- set ns.on = ns.on + [s.name] -%}
      {%- endfor -%}
      {%- set count = ns.on | count -%}
      {%- if count == 0 -%}
      No, the lights are off{{ where }}.
      {%- elif count > 3 -%}
      Yes, {{ count }} lights are on{{ where }}.
      {%- else -%}
      Yes, {{ (ns.on[:-1] | join(', ') ~ ' and ' ~ ns.on[-1]) if count > 1 else ns.on[0] }}
      {{- ' is' if count == 1 else ' are' }} on{{ where }}.
      {%- endif -%}
    variants:
      here:
        title: Are any lights on in this satellite's area
        needs:
          - The satellite's area (Satellites page) is the one it asks about.
      device:
        <<: *device
        title: Is a device on, by name
        icon: mdi:toggle-switch-outline
        description: say if a device is on
        require: [[is, are]]
        # "on" is the answer asked about here, not a place word.
        optional: [[in], [the]]
        names:
          entity: {count: 1, domains: [light, switch, fan, input_boolean]}
          area: {count: 1}
        lists:
          asked: {list: on_off}
        combinations: [[entity, asked], [entity, area, asked]]
        response: >-
          {%- set e = slots.entity[0] -%}
          {%- set state = states(e) -%}
          {%- set said = state_attr(e, 'friendly_name') ~ ' is ' ~ state ~ '.' -%}
          {%- if state in ['on', 'off'] -%}
          {{ 'Yes' if state == slots.asked else 'No' }}, {{ said }}
          {%- else -%}
          {{ said }}
          {%- endif -%}
        needs:
          - Add names for the lights and switches it may ask about (Names page).
      place:
        <<: *place
        title: Are any lights on in an area or floor

  set_brightness:
    title: Set the brightness
    icon: mdi:brightness-6
    description: set the brightness of the lights
    supports: brightness
    require: [[brightness, percent]]
    optional: [[set, change, make], [light, lights], [to], [in, on], [the], [brightness], [percent]]
    number: percentage
    intent:
      name: HassLightSet
      slots: {brightness: "{{ slots.percentage }}"}
    verbosity: beep
    response:
      done:
        brief: Set the brightness.
        specific: >-
          Set {{ state_attr(slots.entity[0], 'friendly_name') if slots.entity
          else 'the lights ' ~ place.said }} to {{ slots.percentage }}%.
    variants:
      here:
        title: Set the brightness in this satellite's area
      device:
        <<: *device
        title: Set the brightness of a light by name
        names:
          entity: {count: 1, domains: [light]}
          area: {count: 1}
        combinations: [[entity, percentage], [entity, area, percentage]]
        needs:
          - Add names for the lights it may dim (Names page).
      place:
        <<: *place
        title: Set the brightness in an area or floor
        combinations: [[area, percentage], [floor, percentage]]

  light_color:
    title: Set the light color
    icon: mdi:format-color-fill
    description: change the color of the lights
    supports: color
    require: [[set, make, turn], [light, lights]]
    optional: [[color], [to], [in, on], [the]]
    lists:
      color: {list: colors}
    intent:
      name: HassLightSet
      slots: {color: "{{ slots.color }}"}
    verbosity: beep
    response:
      done:
        brief: Changed the color.
        specific: >-
          Turned {{ state_attr(slots.entity[0], 'friendly_name') if slots.entity
          else 'the lights ' ~ place.said }} {{ slots.color }}.
    variants:
      here:
        title: Set the light color in this satellite's area
      device:
        <<: *device
        title: Set the color of a light by name
        require: [[set, make, turn]]
        names:
          entity: {count: 1, domains: [light]}
          area: {count: 1}
        combinations: [[entity, color], [entity, area, color]]
        needs:
          - Add names for the lights it may color (Names page).
      place:
        <<: *place
        title: Set the light color in an area or floor
        combinations: [[area, color], [floor, color]]

  brighter:
    title: Brighter
    icon: mdi:brightness-7
    description: make the lights brighter
    supports: brightness
    require: [[brighter, brighten, turn up, turn ... up, raise, increase], [light, lights, brightness]]
    optional: [[make], [a bit, a little], [in, on], [the]]
    slots: {step: 20}
    action: *brightness_step
    verbosity: beep
    response:
      <<: *brightness_said
      done:
        brief: Brighter.
        specific: >-
          Turned up {{ state_attr(slots.entity[0], 'friendly_name') if slots.entity
          else 'the lights ' ~ place.said }}.
    variants:
      here:
        title: Brighter in this satellite's area
        examples: ["[make it] [a (bit|little)] brighter [in here]"]
      device:
        <<: *device
        title: Brighten a light by name
        require: [[brighter, brighten, turn up, turn ... up, raise, increase]]
        names:
          entity: {count: 1, domains: [light]}
          area: {count: 1}
        needs:
          - Add names for the lights it may brighten (Names page).
      place:
        <<: *place
        title: Brighter in an area or floor

  dimmer:
    title: Dimmer
    icon: mdi:brightness-4
    description: make the lights dimmer
    supports: brightness
    require: [[dimmer, dim, darker, turn down, turn ... down, lower, decrease], [light, lights, brightness]]
    optional: [[make], [a bit, a little], [in, on], [the]]
    slots: {step: -20}
    action: *brightness_step
    verbosity: beep
    response:
      <<: *brightness_said
      done:
        brief: Dimmer.
        specific: >-
          Turned down {{ state_attr(slots.entity[0], 'friendly_name') if slots.entity
          else 'the lights ' ~ place.said }}.
    variants:
      here:
        title: Dimmer in this satellite's area
        examples: ["[make it] [a (bit|little)] (dimmer|darker) [in here]"]
      device:
        <<: *device
        title: Dim a light by name
        require: [[dimmer, dim, darker, turn down, turn ... down, lower, decrease]]
        names:
          entity: {count: 1, domains: [light]}
          area: {count: 1}
        needs:
          - Add names for the lights it may dim (Names page).
      place:
        <<: *place
        title: Dimmer in an area or floor

  light_temperature:
    title: Set the color temperature
    icon: mdi:white-balance-sunny
    description: change the color temperature of the lights
    supports: color_temp
    # By what the white is called: warm, soft, neutral, cool, daylight (the
    # color_temperatures list, in kelvin).
    require: [[set, make, turn], [light, lights]]
    optional: [[color temperature, temperature], [to], [in, on], [the]]
    lists:
      color_temperature: {list: color_temperatures}
    intent:
      name: HassLightSet
      slots: {temperature: "{{ slots.color_temperature }}"}
    verbosity: beep
    response:
      done:
        brief: Changed the white.
        specific: >-
          Set {{ state_attr(slots.entity[0], 'friendly_name') if slots.entity
          else 'the lights ' ~ place.said }} to {{ slots.color_temperature }} kelvin.
    variants:
      here:
        title: Set the color temperature in this satellite's area
      device:
        <<: *device
        title: Set the color temperature of a light by name
        require: [[set, make, turn]]
        names:
          entity: {count: 1, domains: [light]}
          area: {count: 1}
        combinations: [[entity, color_temperature], [entity, area, color_temperature]]
        needs:
          - Add names for the lights it may change (Names page).
      place:
        <<: *place
        title: Set the color temperature in an area or floor
        combinations: [[area, color_temperature], [floor, color_temperature]]

  set_temperature:
    title: Set the temperature
    icon: mdi:thermometer
    description: set the temperature
    supports: temperature
    require: [[set, temperature, degrees]]
    optional: [[set], [temperature], [to, at], [degrees], [in, on], [the]]
    # A question about degrees is not a setting: "what's 20 degrees C in
    # Fahrenheit" (the units skill).
    exclude: [what, "what's", how, convert]
    number: temperature
    intent:
      name: HassClimateSetTemperature
      slots: {temperature: "{{ slots.temperature }}"}
    # Not seen at once, and a misheard number matters: said.
    verbosity: specific
    response:
      done:
        brief: Set the temperature.
        specific: >-
          Set {{ state_attr(slots.entity[0], 'friendly_name') if slots.entity
          else 'the temperature ' ~ place.said }} to {{ slots.temperature }} degrees.
    variants:
      here:
        title: Set the temperature in this satellite's area
      device:
        <<: *device
        title: Set the temperature of a thermostat by name
        names:
          entity: {count: 1, domains: [climate]}
          area: {count: 1}
        combinations: [[entity, temperature], [entity, area, temperature]]
        needs:
          - Add names for the thermostats it may set (Names page).
      place:
        <<: *place
        title: Set the temperature in an area or floor
        combinations: [[area, temperature], [floor, temperature]]


  shopping_list_add:
    title: Add to the shopping list
    icon: mdi:cart-plus
    description: add something to the shopping list
    require: [[add, put], [shopping list, list]]
    optional: [[to, on]]
    wildcard:
      slot: item
      after: [add, put]
      before: [to, on]
      bounded: true
      max_words: 8
    home: shopping_list
    # Several at once, each an item of its own: "oranges and bananas".
    action:
      repeat:
        for_each: >-
          {{ (slots.item | regex_replace('\\s*,\\s*|\\s+(?:and)\\s+', '|', true)).split('|')
          | map('trim') | reject('eq', '') | list }}
        sequence:
          - action: todo.add_item
            target:
              entity_id: "{{ slots.entity }}"
            data:
              item: "{{ repeat.item }}"
    verbosity: specific
    response:
      done:
        brief: Added it to the shopping list.
        specific: "Added {{ slots.item }} to the shopping list."

  shopping_list_remove:
    title: Take off the shopping list
    icon: mdi:cart-minus
    description: take something off the shopping list
    # Gone from the list; checking it off (done, and kept) is Check off the
    # shopping list. The item said is one on the list: "test three" is "test 3".
    require: [[remove, take, delete], [shopping list, list]]
    optional: [[from, off]]
    wildcard:
      slot: item
      after: [remove, take, delete]
      before: [from, off]
      bounded: true
      max_words: 5
    on_list: {item: entity}
    home: shopping_list
    action:
      action: todo.remove_item
      target:
        entity_id: "{{ slots.entity }}"
      data:
        item: "{{ slots.item }}"
    verbosity: specific
    response:
      done:
        brief: Took it off the shopping list.
        specific: "Took {{ slots.item }} off the shopping list."
    needs:
      - Set the home's shopping list on the Settings page, or give it one of its
        own (its implied target).

  shopping_list_check:
    title: Check off the shopping list
    icon: mdi:cart-check
    description: check something off the shopping list as bought
    # Done, and kept on the list as such: "cross the milk off the list",
    # "check off eggs on the shopping list", "mark bread as done on the list".
    require: [[check, cross, tick, mark], [shopping list, list]]
    optional: [[off], [from, on], [as done, as bought]]
    wildcard:
      slot: item
      after: [check, cross, tick, mark]
      before: [off, from, on, as done, as bought]
      bounded: true
      max_words: 5
    on_list: {item: entity}
    home: shopping_list
    action:
      action: todo.update_item
      target:
        entity_id: "{{ slots.entity }}"
      data:
        item: "{{ slots.item }}"
        status: completed
    verbosity: specific
    response:
      done:
        brief: Checked it off.
        specific: "Checked {{ slots.item }} off the shopping list."
    needs:
      - Set the home's shopping list on the Settings page, or give it one of its
        own (its implied target).

  shopping_list_items:
    title: What's on the shopping list
    icon: mdi:cart-outline
    description: say what's on the shopping list
    # What is still to get; what was checked off is left out.
    examples: ["what's on [the|my|our] shopping list", "what do we need from the (store|shop)", "read [me] the shopping list"]
    require: [[what's on, what is on, read, tell me], [shopping list]]
    optional: [[the, my, our], [me]]
    home: shopping_list
    action:
      - variables:
          shopping: "{{ slots.entity[0] }}"
      - action: todo.get_items
        target:
          entity_id: "{{ shopping }}"
        data:
          status: needs_action
        response_variable: found
      - variables:
          reply:
            listed: "{{ found[shopping]['items'] | map(attribute='summary') | list }}"
      - stop: Read the list
        response_variable: reply
    response:
      done: >-
        {%- set listed = result.listed or [] -%}
        {%- set count = listed | count -%}
        {%- if count == 0 -%}
        The shopping list is empty.
        {%- elif count == 1 -%}
        There's {{ listed[0] }} on the shopping list.
        {%- elif count > 8 -%}
        There are {{ count }} things on the shopping list: {{ listed[:5] | join(', ') }} and {{ count - 5 }} more.
        {%- else -%}
        On the shopping list: {{ listed[:-1] | join(', ') }} and {{ listed[-1] }}.
        {%- endif -%}
    needs:
      - Set the home's shopping list on the Settings page, or give it one of its
        own (its implied target).

  todo_add:
    title: Add to the to-do list
    icon: mdi:format-list-checks
    description: add something to the to-do list
    require: [[add, put], [to do list, to do]]
    optional: [[to, on]]
    wildcard:
      slot: item
      after: [add, put]
      before: [to, on]
      bounded: true
      max_words: 8
    home: todo_list
    action:
      action: todo.add_item
      target:
        entity_id: "{{ slots.entity }}"
      data:
        item: "{{ slots.item }}"
    verbosity: specific
    response:
      done:
        brief: Added it to the to-do list.
        specific: "Added {{ slots.item }} to the to-do list."
    needs:
      - Set the home's to-do list on the Settings page, or give it one of its
        own (its implied target).

  todo_add_mine:
    title: Add to my to-do list
    icon: mdi:account-check-outline
    description: add something to my to-do list
    # The speaker's own (People page); where nobody has one, this one.
    require: [[add, put], [my to do list, my to do]]
    optional: [[to, on]]
    wildcard:
      slot: item
      after: [add, put]
      before: [to, on]
      bounded: true
      max_words: 8
    home: todo_list
    mine: todo_list
    action:
      action: todo.add_item
      target:
        entity_id: "{{ slots.entity }}"
      data:
        item: "{{ slots.item }}"
    verbosity: specific
    response:
      done:
        brief: Added it to your to-do list.
        specific: "Added {{ slots.item }} to your to-do list."
    needs:
      - Give each person their to-do list (People page). Where nobody has one,
        it adds to the home's (Settings page).

  my_calendar:
    title: What's on my calendar
    icon: mdi:calendar-account
    description: say what's on my calendar today
    # The rest of today on the speaker's own calendar (People page); where
    # nobody has one, this one.
    examples: ["what's on my calendar [today]", "what's on my schedule [today]", "what do i have today"]
    require: [[my calendar, my schedule, my agenda]]
    optional: [[what, whats, what's, what is], [on, in], [today, for today]]
    slots:
      entity: [calendar.family]
    mine: calendar
    action:
      - action: calendar.get_events
        target:
          entity_id: "{{ slots.entity }}"
        data:
          end_date_time: "{{ today_at('23:59:59').isoformat() }}"
        response_variable: found
      - variables:
          reply:
            events: "{{ found[slots.entity[0]].events | map(attribute='summary') | list }}"
      - stop: Read the calendar
        response_variable: reply
    response:
      done: >-
        {% set events = result.events or [] %}
        {% if not events %}There's nothing on your calendar for the rest of today.
        {% elif events | count == 1 %}You have {{ events[0] }} today.
        {% else %}You have {{ events[:-1] | join(', ') }} and {{ events[-1] }} today.{% endif %}
    needs:
      - Give each person their calendar (People page). Where nobody has one,
        it reads this one (calendar.family here).

  remind_me:
    title: Remind me
    icon: mdi:calendar-clock
    description: add a reminder
    # With a time, an event on the Voice Call calendar that is said on this
    # satellite then: "remind me at 5 pm to call mom", "remind me to take the
    # bins out every tuesday at 7 pm", "remind me in 10 minutes to check the
    # oven". Without one, it goes on the to-do list.
    require: [[remind me]]
    wildcard:
      slot: reminder
      after: [remind me]
      to_end: true
      max_words: 16
    slots:
      entity: [todo.reminders]
    # The speaker's own to-do list, when anyone has one (People page).
    mine: todo_list
    timer: reminder
    verbosity: specific
    needs:
      - Point it at a to-do list (todo.reminders here) for reminders without a
        time. Where someone has a to-do list of their own (People page), theirs,
        and they must be recognized.

  cancel_reminder:
    title: Cancel a reminder
    icon: mdi:calendar-remove
    description: cancel a reminder
    # On the Voice Call calendar, by what it is about, when it is, or both:
    # "cancel my reminder to call mom", "delete tomorrow's reminder", "cancel
    # the 5 pm reminder"; with one, the only one.
    require: [[cancel, delete, remove, forget], [reminder, reminders]]
    optional: [[my, the]]
    wildcard: {slot: reminder, after: [reminder, reminders], to_end: true, max_words: 12}
    combinations: [[], [reminder]]
    timer: cancel_reminder
    verbosity: specific

  reminder_status:
    title: Say the reminders
    icon: mdi:calendar-clock
    description: say which reminders are coming up
    examples: [what are my reminders, do i have any reminders]
    require: [[reminders, reminder]]
    optional: [[what, which], [are, is], [do i have, have i got, are there], [my, any]]
    exclude: [remind me, add, set]
    timer: reminder_status

  scene:
    title: Activate a scene
    icon: mdi:palette
    description: start movie time
    examples: ["[start] movie time"]
    scene: scene.movie_time
    verbosity: beep
    response:
      done:
        brief: Done.
    needs:
      - Take control of it, then pick the scene and say it your way.

  script:
    title: Run a script
    icon: mdi:script-text-outline
    description: say good night
    examples: [good night]
    script: script.good_night
    response: "{{ result.speech if result and result.speech else 'Good night.' }}"
    needs:
      - Take control of it, then pick the script. It gets slots, satellite, speaker and target as variables,
        and anything it returns (stop with response_variable) as result.
