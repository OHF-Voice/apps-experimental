# Example commands, offered in the web UI's library. Adding one copies it into
# commands.yaml, where it can be changed like any other command.
#
# Each entry is a command (see voice_call/commands.py) plus:
#   title:     what the library calls it
#   needs:     what to set after adding it, shown in the UI
#   variants:  its versions, each added on its own, for what it acts on:
#                here    the satellite it is said to, or its area (nothing named)
#                device  a device by name
#                place   an area or floor by name
#              Each is the command's keys with its own on top (null removes
#              one), with the id <command>_<variant>.
#   formerly:  ids it had before it had versions (where the Commands page
#              lists a command added then)
#
# Keywords follow adapt-ctc's core intents (adapt_ctc/examples/intents/core.yaml),
# which were tuned on the office-multicap corpus.
title: Basics
icon: mdi:home-outline

# What the versions add to a command (merged into them with <<).
shared:
  device: &device
    names:
      entity: {count: 1, domains: [light, switch, fan, media_player, input_boolean, climate]}
      area: {count: 1}
    # A room with the device picks it out: the one of that name there.
    combinations: [[entity], [entity, area]]
  place: &place
    names:
      area: {count: 1}
      floor: {count: 1}
    combinations: [[area], [floor]]
    needs:
      - Add names for the areas and floors it may act in (Names page).

commands:
  what_time:
    title: What time is it
    icon: mdi:clock-outline
    description: tell the time
    examples: [what time is it]
    require: [[what time]]
    optional: [[is it, it is], [right now, now], [tell me]]
    # Other times: "what time does the store close", "what time is ninety
    # minutes after two" (that one is answered as a question).
    exclude: [does, do, close, open, after, before, until, from]
    response: "It's {{ now().strftime('%-I:%M %p') }}."

  what_date:
    title: What's the date
    icon: mdi:calendar-today
    description: tell the date
    examples: ["what's the date [today]", "what day is it [today]"]
    require: [[date, what day]]
    optional: [[tell me], [what is, whats, what's], [today]]
    response: "Today is {{ now().strftime('%A, %B %-d') }}."

  never_mind:
    title: Never mind
    icon: mdi:close-circle-outline
    description: never mind, cancel the request
    # Said whole only: "cancel the timer" is the timer's. Nothing to do, and by
    # default nothing said, not even a sound: the satellite stops listening.
    # Give it a response (Only respond) or a beep to hear that it did.
    examples: [never mind, nevermind, forget it, "cancel [that]", nothing]

  # Lights here, in an area or on a floor named, or a device by name.
  turn_on:
    title: Turn on
    icon: mdi:lightbulb-on-outline
    description: turn on the lights
    require: [[turn on, switch on, turn ... on, switch ... on], [light, lights]]
    optional: [[all], [in, on], [the]]
    action:
      action: light.turn_on
      target: "{{ target }}"
    verbosity: beep
    response:
      done:
        brief: Turned on the lights.
        specific: Turned on the lights {{ place.said }}.
        verbose: >-
          {%- set ns = namespace(names=[]) -%}
          {%- for a in place.areas -%}
          {%- for e in area_entities(a) | select('match', 'light\\.') -%}
          {%- set ns.names = ns.names + [state_attr(e, 'friendly_name') or e] -%}
          {%- endfor -%}
          {%- endfor -%}
          {%- set n = ns.names | count -%}
          {%- if n == 0 or n > 4 -%}
          Turned on {{ n if n else 'the' }} lights {{ place.said }}.
          {%- else -%}
          Turned on {{ (ns.names[:-1] | join(', ') ~ ' and ' ~ ns.names[-1]) if n > 1 else ns.names[0] }} {{ place.said }}.
          {%- endif -%}
    formerly: [lights_on, device_on]
    variants:
      here:
        title: Turn on the lights in this satellite's area
        needs:
          - The lights in the satellite's area (Satellites page) are the ones it
            turns on.
      device:
        <<: *device
        title: Turn on a device by name
        icon: mdi:toggle-switch-outline
        description: turn on a device
        require: [[turn on, switch on, turn ... on, switch ... on]]
        action:
          action: homeassistant.turn_on
          target: "{{ target }}"
        response:
          done:
            brief: Turned it on.
            specific: Turned on {{ state_attr(slots.entity[0], 'friendly_name') }}.
            verbose: Turned on {{ state_attr(slots.entity[0], 'friendly_name') }} {{ place.said }}.
        needs:
          - Add names for the devices it may turn on (Names page).
      place:
        <<: *place
        title: Turn on the lights in an area or floor

  turn_off:
    title: Turn off
    icon: mdi:lightbulb-off-outline
    description: turn off the lights
    require: [[turn off, switch off, turn ... off, switch ... off], [light, lights]]
    optional: [[all], [in, on], [the], [house, everywhere]]
    action:
      action: light.turn_off
      target: "{{ target }}"
    verbosity: beep
    response:
      done:
        brief: Turned off the lights.
        specific: Turned off the lights {{ place.said }}.
        verbose: >-
          {%- set ns = namespace(names=[]) -%}
          {%- for a in place.areas -%}
          {%- for e in area_entities(a) | select('match', 'light\\.') -%}
          {%- set ns.names = ns.names + [state_attr(e, 'friendly_name') or e] -%}
          {%- endfor -%}
          {%- endfor -%}
          {%- set n = ns.names | count -%}
          {%- if n == 0 or n > 4 -%}
          Turned off {{ n if n else 'the' }} lights {{ place.said }}.
          {%- else -%}
          Turned off {{ (ns.names[:-1] | join(', ') ~ ' and ' ~ ns.names[-1]) if n > 1 else ns.names[0] }} {{ place.said }}.
          {%- endif -%}
    formerly: [lights_off, device_off]
    variants:
      here:
        title: Turn off the lights in this satellite's area
        needs:
          - The lights in the satellite's area (Satellites page) are the ones it
            turns off.
      device:
        <<: *device
        title: Turn off a device by name
        icon: mdi:toggle-switch-off-outline
        description: turn off a device
        require: [[turn off, switch off, turn ... off, switch ... off]]
        optional: [[in, on], [the]]
        action:
          action: homeassistant.turn_off
          target: "{{ target }}"
        response:
          done:
            brief: Turned it off.
            specific: Turned off {{ state_attr(slots.entity[0], 'friendly_name') }}.
            verbose: Turned off {{ state_attr(slots.entity[0], 'friendly_name') }} {{ place.said }}.
        needs:
          - Add names for the devices it may turn off (Names page).
      place:
        <<: *place
        title: Turn off the lights in an area or floor

  any_lights_on:
    title: Are any lights on
    icon: mdi:lightbulb-question
    description: say which lights are on
    # No example sentences: one said word for word carries no area or floor.
    require: [[are, is], [light, lights], [on]]
    optional: [[any], [in, on], [the]]
    exclude: [turn, switch]
    response: >-
      {%- set named = slots.area or slots.floor -%}
      {%- set ns = namespace(areas=slots.area or [], on=[]) -%}
      {%- for f in slots.floor or [] -%}
      {%- set ns.areas = ns.areas + (floor_areas(f) | list) -%}
      {%- endfor -%}
      {%- if not named and satellite.area_id -%}
      {%- set ns.areas = [satellite.area_id] -%}
      {%- endif -%}
      {%- set where = (' in the ' ~ area_name(slots.area[0])) if slots.area
        else ((' on the ' ~ floor_name(slots.floor[0])) if slots.floor
        else ((' in the ' ~ satellite.area_name) if satellite.area_name else '')) -%}
      {%- for s in states.light if (not ns.areas or area_id(s.entity_id) in ns.areas) and s.state == 'on' -%}
      {%- set ns.on = ns.on + [s.name] -%}
      {%- endfor -%}
      {%- set count = ns.on | count -%}
      {%- if count == 0 -%}
      No, the lights are off{{ where }}.
      {%- elif count > 3 -%}
      Yes, {{ count }} lights are on{{ where }}.
      {%- else -%}
      Yes, {{ (ns.on[:-1] | join(', ') ~ ' and ' ~ ns.on[-1]) if count > 1 else ns.on[0] }}
      {{- ' is' if count == 1 else ' are' }} on{{ where }}.
      {%- endif -%}
    variants:
      here:
        title: Are any lights on in this satellite's area
        needs:
          - The satellite's area (Satellites page) is the one it asks about.
      device:
        <<: *device
        title: Is a device on, by name
        icon: mdi:toggle-switch-outline
        description: say if a device is on
        require: [[is, are]]
        # "on" is the answer asked about here, not a place word.
        optional: [[in], [the]]
        names:
          entity: {count: 1, domains: [light, switch, fan, input_boolean]}
          area: {count: 1}
        lists:
          asked: {list: on_off}
        combinations: [[entity, asked], [entity, area, asked]]
        response: >-
          {%- set e = slots.entity[0] -%}
          {%- set state = states(e) -%}
          {%- set said = state_attr(e, 'friendly_name') ~ ' is ' ~ state ~ '.' -%}
          {%- if state in ['on', 'off'] -%}
          {{ 'Yes' if state == slots.asked else 'No' }}, {{ said }}
          {%- else -%}
          {{ said }}
          {%- endif -%}
        needs:
          - Add names for the lights and switches it may ask about (Names page).
      place:
        <<: *place
        title: Are any lights on in an area or floor

  set_brightness:
    title: Set the brightness
    icon: mdi:brightness-6
    description: set the brightness of the lights
    require: [[brightness, percent]]
    optional: [[set, change, make], [light, lights], [to], [in, on], [the], [brightness], [percent]]
    number: percentage
    action:
      action: light.turn_on
      target: "{{ target }}"
      data:
        brightness_pct: "{{ slots.percentage }}"
    verbosity: beep
    response:
      done:
        brief: Set the brightness.
        specific: >-
          Set {{ state_attr(slots.entity[0], 'friendly_name') if slots.entity
          else 'the lights ' ~ place.said }} to {{ slots.percentage }}%.
    variants:
      here:
        title: Set the brightness in this satellite's area
      device:
        <<: *device
        title: Set the brightness of a light by name
        names:
          entity: {count: 1, domains: [light]}
          area: {count: 1}
        combinations: [[entity, percentage], [entity, area, percentage]]
        needs:
          - Add names for the lights it may dim (Names page).
      place:
        <<: *place
        title: Set the brightness in an area or floor
        combinations: [[area, percentage], [floor, percentage]]

  light_color:
    title: Set the light color
    icon: mdi:format-color-fill
    description: change the color of the lights
    require: [[set, make, turn], [light, lights]]
    optional: [[color], [to], [in, on], [the]]
    lists:
      color: {list: colors}
    action:
      action: light.turn_on
      target: "{{ target }}"
      data:
        color_name: "{{ slots.color }}"
    verbosity: beep
    response:
      done:
        brief: Changed the color.
        specific: >-
          Turned {{ state_attr(slots.entity[0], 'friendly_name') if slots.entity
          else 'the lights ' ~ place.said }} {{ slots.color }}.
    variants:
      here:
        title: Set the light color in this satellite's area
      device:
        <<: *device
        title: Set the color of a light by name
        require: [[set, make, turn]]
        names:
          entity: {count: 1, domains: [light]}
          area: {count: 1}
        combinations: [[entity, color], [entity, area, color]]
        needs:
          - Add names for the lights it may color (Names page).
      place:
        <<: *place
        title: Set the light color in an area or floor
        combinations: [[area, color], [floor, color]]

  set_temperature:
    title: Set the temperature
    icon: mdi:thermometer
    description: set the temperature
    require: [[set, temperature, degrees]]
    optional: [[set], [temperature], [to, at], [degrees], [in, on], [the]]
    # A question about degrees is not a setting: "what's 20 degrees C in
    # Fahrenheit" (the units skill).
    exclude: [what, "what's", how, convert]
    number: temperature
    action:
      action: climate.set_temperature
      target: "{{ target }}"
      data:
        temperature: "{{ slots.temperature }}"
    # Not seen at once, and a misheard number matters: said.
    verbosity: specific
    response:
      done:
        brief: Set the temperature.
        specific: >-
          Set {{ state_attr(slots.entity[0], 'friendly_name') if slots.entity
          else 'the temperature ' ~ place.said }} to {{ slots.temperature }} degrees.
    variants:
      here:
        title: Set the temperature in this satellite's area
      device:
        <<: *device
        title: Set the temperature of a thermostat by name
        names:
          entity: {count: 1, domains: [climate]}
          area: {count: 1}
        combinations: [[entity, temperature], [entity, area, temperature]]
        needs:
          - Add names for the thermostats it may set (Names page).
      place:
        <<: *place
        title: Set the temperature in an area or floor
        combinations: [[area, temperature], [floor, temperature]]

  weather:
    title: What's the weather
    icon: mdi:weather-partly-cloudy
    description: tell the weather
    examples: ["what's the weather [like] [today]", "is it going to rain [today]"]
    require: [[weather, forecast]]
    slots:
      entity: [weather.home]
    response: >-
      It's {{ states(slots.entity[0]) | replace('-', ' ') }} and
      {{ state_attr(slots.entity[0], 'temperature') | round }} degrees.
    needs:
      - Set the fixed slot entity to your weather entity (weather.home here).

  shopping_list_add:
    title: Add to the shopping list
    icon: mdi:cart-plus
    description: add something to the shopping list
    require: [[add, put], [shopping list, list]]
    optional: [[to, on]]
    wildcard:
      slot: item
      after: [add, put]
      before: [to, on]
      bounded: true
      max_words: 5
    action:
      action: todo.add_item
      target:
        entity_id: todo.shopping_list
      data:
        item: "{{ slots.item }}"
    verbosity: specific
    response:
      done:
        brief: Added it to the shopping list.
        specific: "Added {{ slots.item }} to the shopping list."

  shopping_list_remove:
    title: Take off the shopping list
    icon: mdi:cart-minus
    description: take something off the shopping list
    require: [[remove, take, delete, cross], [shopping list, list]]
    optional: [[from, off]]
    wildcard:
      slot: item
      after: [remove, take, delete, cross]
      before: [from, off]
      bounded: true
      max_words: 5
    action:
      action: todo.remove_item
      target:
        entity_id: todo.shopping_list
      data:
        item: "{{ slots.item }}"
    verbosity: specific
    response:
      done:
        brief: Took it off the shopping list.
        specific: "Took {{ slots.item }} off the shopping list."

  todo_add:
    title: Add to the to-do list
    icon: mdi:format-list-checks
    description: add something to the to-do list
    require: [[add, put], [to do list, to do]]
    optional: [[to, on]]
    wildcard:
      slot: item
      after: [add, put]
      before: [to, on]
      bounded: true
      max_words: 8
    action:
      action: todo.add_item
      target:
        entity_id: todo.to_do
      data:
        item: "{{ slots.item }}"
    verbosity: specific
    response:
      done:
        brief: Added it to the to-do list.
        specific: "Added {{ slots.item }} to the to-do list."
    needs:
      - Point it at your to-do list (todo.to_do here).

  remind_me:
    title: Remember something
    icon: mdi:note-edit-outline
    description: add a reminder
    require: [[remind me]]
    optional: [[to]]
    wildcard:
      slot: reminder
      after: [to]
      to_end: true
      max_words: 10
    action:
      action: todo.add_item
      target:
        entity_id: todo.reminders
      data:
        item: "{{ slots.reminder }}"
    verbosity: specific
    response:
      done:
        brief: I'll remind you.
        specific: "I'll remind you to {{ slots.reminder }}."
    needs:
      - Point it at a to-do list (todo.reminders here).

  scene:
    title: Activate a scene
    icon: mdi:palette
    description: start movie time
    examples: ["[start] movie time"]
    scene: scene.movie_time
    verbosity: beep
    response:
      done:
        brief: Done.
    needs:
      - Pick the scene, and change the examples to what you want to say.

  script:
    title: Run a script
    icon: mdi:script-text-outline
    description: say good night
    examples: [good night]
    script: script.good_night
    response: "{{ result.speech if result and result.speech else 'Good night.' }}"
    needs:
      - Pick the script. It gets slots, satellite, speaker and target as variables,
        and anything it returns (stop with response_variable) as result.
