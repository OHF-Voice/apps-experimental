# Covers and locks: opening, closing, setting to a position, locking, and
# asking about them.
#
# A cover or a lock by name needs a name for it (Names page). Covers by type
# ("the blinds", "the garage door") need no names: their device class says
# what they are, and the area or floor named -- else the satellite's area --
# where. When nothing of that type is in the satellite's area, every one in
# the home is meant ("open the garage door" from the kitchen).
#
# They run Home Assistant's intents, as Assist would: only on covers and locks
# exposed to Assist. Nothing of the type there is their no_devices outcome
# ("There aren't any shades in the Bedroom"), not nothing happening.
#
# Opening, closing, setting and asking about covers come in versions
# (variants; see README.md): by type in the satellite's area, a cover by name,
# by type in an area or on a floor named. Locks have no versions: one is locked or unlocked
# only by name, and "lock up" is every lock in the home.
title: Covers and locks
icon: mdi:door

# What the versions add to a command (merged into them with <<).
shared:
  cover: &cover
    names:
      entity: {count: 1, domains: [cover]}
      area: {count: 1}
    # A room with the device picks it out: the one of that name there.
    combinations: [[entity], [entity, area]]
  place: &place
    names:
      area: {count: 1}
      floor: {count: 1}
    needs:
      - Add names for the areas and floors it may act in (Names page).
  nothing_here: &nothing_here
    - The satellite's area (Satellites page) is where. When nothing of the type
      is there, every one in the home is meant ("open the garage door" from the
      kitchen).

commands:
  # The blinds (by type) in the satellite's area, in an area or on a floor
  # named, or a cover by name.
  open_covers:
    title: Open covers
    icon: mdi:blinds-open
    description: open the blinds
    require: [[open, raise]]
    optional: [[all], [up], [in, on], [the]]
    exclude: [is, are]
    lists:
      device_class: {list: cover_classes}
    intent:
      name: HassTurnOn
      slots: {domain: cover, device_class: "{{ slots.device_class }}"}
      anywhere: true
    verbosity: specific
    response:
      done: >-
        {%- set kinds = {'awning': ['awning', 'awnings'], 'blind': ['blind', 'blinds'],
          'curtain': ['curtain', 'curtains'], 'door': ['door', 'doors'],
          'garage': ['garage door', 'garage doors'], 'gate': ['gate', 'gates'],
          'shade': ['shade', 'shades'], 'shutter': ['shutter', 'shutters'],
          'window': ['window', 'windows']} -%}
        {%- set where = (' in the ' ~ area_name(slots.area[0])) if slots.area
          else ((' on the ' ~ floor_name(slots.floor[0])) if slots.floor else '') -%}
        Opening the {{ kinds[slots.device_class][0 if result.count == 1 else 1] }}{{ where }}.
      no_devices: >-
        {%- set kinds = {'awning': 'awnings', 'blind': 'blinds', 'curtain': 'curtains',
          'door': 'doors', 'garage': 'garage doors', 'gate': 'gates', 'shade': 'shades',
          'shutter': 'shutters', 'window': 'windows'} -%}
        {%- set where = (' in the ' ~ area_name(slots.area[0])) if slots.area
          else ((' on the ' ~ floor_name(slots.floor[0])) if slots.floor else '') -%}
        There aren't any {{ kinds[slots.device_class] }}{{ where }}.
    formerly: [open_cover]
    variants:
      here:
        title: Open the blinds in this satellite's area
        needs: *nothing_here
      device:
        <<: *cover
        title: Open a cover by name
        icon: mdi:window-shutter-open
        description: open a cover
        lists: null
        intent: HassTurnOn
        # Out of sight, or what keeps people out: said.
        verbosity: specific
        response:
          done:
            brief: Opening it.
            specific: "Opening {{ names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) }}."
        needs:
          - Add names for the covers it may open (Names page).
      place:
        <<: *place
        title: Open the blinds in an area or floor
        combinations: [[area, device_class], [floor, device_class]]

  close_covers:
    title: Close covers
    icon: mdi:blinds
    description: close the blinds
    require: [[close, shut, lower]]
    optional: [[all], [down], [in, on], [the]]
    exclude: [is, are]
    lists:
      device_class: {list: cover_classes}
    intent:
      name: HassTurnOff
      slots: {domain: cover, device_class: "{{ slots.device_class }}"}
      anywhere: true
    verbosity: specific
    response:
      done: >-
        {%- set kinds = {'awning': ['awning', 'awnings'], 'blind': ['blind', 'blinds'],
          'curtain': ['curtain', 'curtains'], 'door': ['door', 'doors'],
          'garage': ['garage door', 'garage doors'], 'gate': ['gate', 'gates'],
          'shade': ['shade', 'shades'], 'shutter': ['shutter', 'shutters'],
          'window': ['window', 'windows']} -%}
        {%- set where = (' in the ' ~ area_name(slots.area[0])) if slots.area
          else ((' on the ' ~ floor_name(slots.floor[0])) if slots.floor else '') -%}
        Closing the {{ kinds[slots.device_class][0 if result.count == 1 else 1] }}{{ where }}.
      no_devices: >-
        {%- set kinds = {'awning': 'awnings', 'blind': 'blinds', 'curtain': 'curtains',
          'door': 'doors', 'garage': 'garage doors', 'gate': 'gates', 'shade': 'shades',
          'shutter': 'shutters', 'window': 'windows'} -%}
        {%- set where = (' in the ' ~ area_name(slots.area[0])) if slots.area
          else ((' on the ' ~ floor_name(slots.floor[0])) if slots.floor else '') -%}
        There aren't any {{ kinds[slots.device_class] }}{{ where }}.
    formerly: [close_cover]
    variants:
      here:
        title: Close the blinds in this satellite's area
        needs: *nothing_here
      device:
        <<: *cover
        title: Close a cover by name
        icon: mdi:window-shutter
        description: close a cover
        lists: null
        intent: HassTurnOff
        # Out of sight, or what keeps people out: said.
        verbosity: specific
        response:
          done:
            brief: Closing it.
            specific: "Closing {{ names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) }}."
        needs:
          - Add names for the covers it may close (Names page).
      place:
        <<: *place
        title: Close the blinds in an area or floor
        combinations: [[area, device_class], [floor, device_class]]

  # "Set the blinds to 50%": 100 is open, 0 closed. Only covers that can be
  # set to a position are (supports); the others there are left out.
  cover_position:
    title: Set covers to a position
    icon: mdi:blinds-horizontal
    description: set the blinds to a position
    require: [[set, put, move, open, close, raise, lower]]
    optional: [[all], [to, at], [in, on], [the], [percent]]
    exclude: [is, are]
    lists:
      device_class: {list: cover_classes}
    number: percentage
    supports: position
    intent:
      name: HassSetPosition
      slots: {position: "{{ slots.percentage }}", domain: cover, device_class: "{{ slots.device_class }}"}
      anywhere: true
    verbosity: specific
    response:
      done: >-
        {%- set kinds = {'awning': ['awning', 'awnings'], 'blind': ['blind', 'blinds'],
          'curtain': ['curtain', 'curtains'], 'door': ['door', 'doors'],
          'garage': ['garage door', 'garage doors'], 'gate': ['gate', 'gates'],
          'shade': ['shade', 'shades'], 'shutter': ['shutter', 'shutters'],
          'window': ['window', 'windows']} -%}
        {%- set where = (' in the ' ~ area_name(slots.area[0])) if slots.area
          else ((' on the ' ~ floor_name(slots.floor[0])) if slots.floor else '') -%}
        Setting the {{ kinds[slots.device_class][0 if result.count == 1 else 1] }}{{ where }} to {{ slots.percentage }}%.
      no_devices: >-
        {%- set kinds = {'awning': 'awnings', 'blind': 'blinds', 'curtain': 'curtains',
          'door': 'doors', 'garage': 'garage doors', 'gate': 'gates', 'shade': 'shades',
          'shutter': 'shutters', 'window': 'windows'} -%}
        {%- set where = (' in the ' ~ area_name(slots.area[0])) if slots.area
          else ((' on the ' ~ floor_name(slots.floor[0])) if slots.floor else '') -%}
        There aren't any {{ kinds[slots.device_class] }}{{ where }}.
      not_supported: >-
        {%- set kinds = {'awning': 'awnings', 'blind': 'blinds', 'curtain': 'curtains',
          'door': 'doors', 'garage': 'garage doors', 'gate': 'gates', 'shade': 'shades',
          'shutter': 'shutters', 'window': 'windows'} -%}
        {%- set where = (' in the ' ~ area_name(slots.area[0])) if slots.area
          else ((' on the ' ~ floor_name(slots.floor[0])) if slots.floor else '') -%}
        The {{ kinds[slots.device_class] }}{{ where }} can't be set to a position.
    variants:
      here:
        title: Set the blinds in this satellite's area to a position
        needs: *nothing_here
      device:
        <<: *cover
        title: Set a cover to a position by name
        icon: mdi:window-shutter-settings
        description: set a cover to a position
        lists: null
        combinations: [[entity, percentage], [entity, area, percentage]]
        intent:
          name: HassSetPosition
          slots: {position: "{{ slots.percentage }}"}
        response:
          done: "Setting {{ names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) }} to {{ slots.percentage }}%."
        needs:
          - Add names for the covers it may set (Names page).
      place:
        <<: *place
        title: Set the blinds in an area or floor to a position
        combinations: [[area, device_class, percentage], [floor, device_class, percentage]]

  lock:
    title: Lock a lock
    icon: mdi:lock
    description: lock a door
    require: [[lock]]
    exclude: [unlock, is, are, all, everything]
    optional: [[in, on], [the]]
    names:
      entity: {count: 1, domains: [lock]}
      area: {count: 1}
    # A room with the device picks it out: the one of that name there.
    combinations: [[entity], [entity, area]]
    intent: HassTurnOn
    # Out of sight, or what keeps people out: said.
    verbosity: specific
    response:
      done:
        brief: Locking it.
        specific: "Locking {{ names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) }}."
    needs:
      - Add names for the locks it may lock (Names page).

  unlock:
    title: Unlock a lock
    icon: mdi:lock-open-variant
    description: unlock a door
    require: [[unlock]]
    exclude: [is, are]
    optional: [[in, on], [the]]
    names:
      entity: {count: 1, domains: [lock]}
      area: {count: 1}
    # A room with the device picks it out: the one of that name there.
    combinations: [[entity], [entity, area]]
    intent: HassTurnOff
    # Out of sight, or what keeps people out: said.
    verbosity: specific
    response:
      done:
        brief: Unlocking it.
        specific: "Unlocking {{ names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) }}."
    needs:
      - Add names for the locks it may unlock (Names page). Anyone the satellite
        hears can unlock them; keep it to the satellites that should with a
        command group.

  lock_all:
    title: Lock up
    icon: mdi:shield-lock
    description: lock all the doors
    examples: [lock up, "lock all [the] doors", lock everything]
    require: [[lock], [all, everything, up]]
    optional: [[doors, locks]]
    exclude: [unlock, is, are]
    intent:
      name: HassTurnOn
      slots: {domain: lock}
      home: true
    verbosity: specific
    response: Locking all the doors.

  are_covers_open:
    title: Are covers open
    icon: mdi:blinds-horizontal
    description: say if the blinds are open
    require: [[is, are]]
    optional: [[any, all], [in, on], [the]]
    lists:
      device_class: {list: cover_classes}
      asked: {list: open_closed}
    response: >-
      {%- set kinds = {'awning': ['awning', 'awnings'], 'blind': ['blind', 'blinds'],
        'curtain': ['curtain', 'curtains'], 'door': ['door', 'doors'],
        'garage': ['garage door', 'garage doors'], 'gate': ['gate', 'gates'],
        'shade': ['shade', 'shades'], 'shutter': ['shutter', 'shutters'],
        'window': ['window', 'windows']} -%}
      {%- set kind = kinds[slots.device_class] -%}
      {%- set named = slots.area or slots.floor -%}
      {%- set ns = namespace(areas=slots.area or [], picked=[], opened=[]) -%}
      {%- for f in slots.floor or [] -%}
      {%- set ns.areas = ns.areas + (floor_areas(f) | list) -%}
      {%- endfor -%}
      {%- if not named and satellite.area_id -%}
      {%- set ns.areas = [satellite.area_id] -%}
      {%- endif -%}
      {%- set where = (' in the ' ~ area_name(slots.area[0])) if slots.area
        else ((' on the ' ~ floor_name(slots.floor[0])) if slots.floor else '') -%}
      {%- set every = states.cover | selectattr('entity_id', 'in', exposed) | selectattr('attributes.device_class', 'defined')
        | selectattr('attributes.device_class', 'eq', slots.device_class) | list -%}
      {%- for s in every if area_id(s.entity_id) in ns.areas -%}
      {%- set ns.picked = ns.picked + [s] -%}
      {%- endfor -%}
      {%- set covers = ns.picked if ns.picked or named else every -%}
      {%- for s in covers if s.state in ['open', 'opening'] -%}
      {%- set ns.opened = ns.opened + [s.name] -%}
      {%- endfor -%}
      {%- set count = ns.opened | count -%}
      {%- if not covers -%}
      There aren't any {{ kind[1] }}{{ where }}.
      {%- elif count == 0 -%}
      {{ 'Yes' if slots.asked == 'closed' else 'No' }},
      {{- (' the ' ~ kind[0] ~ ' is') if covers | count == 1 else (' the ' ~ kind[1] ~ ' are') }} closed{{ where }}.
      {%- else -%}
      {{ 'Yes' if slots.asked == 'open' else 'No' }},
      {{ (ns.opened[:-1] | join(', ') ~ ' and ' ~ ns.opened[-1]) if count > 1 else ns.opened[0] }}
      {{- ' is' if count == 1 else ' are' }} open.
      {%- endif -%}
    formerly: [is_cover_open]
    variants:
      here:
        title: Are the blinds open in this satellite's area
        needs: *nothing_here
      device:
        <<: *cover
        title: Is a cover open, by name
        icon: mdi:window-shutter-alert
        description: say if a cover is open
        lists:
          asked: {list: open_closed}
        combinations: [[entity, asked], [entity, area, asked]]
        response: >-
          {%- set e = slots.entity[0] -%}
          {%- set state = states(e) -%}
          {%- set said = names.get(e, state_attr(e, 'friendly_name')) ~ ' is ' ~ state ~ '.' -%}
          {%- if state in ['open', 'closed'] -%}
          {{ 'Yes' if state == slots.asked else 'No' }}, {{ said }}
          {%- else -%}
          {{ said }}
          {%- endif -%}
        needs:
          - Add names for the covers it may ask about (Names page).
      place:
        <<: *place
        title: Are the blinds open in an area or floor
        combinations: [[area, device_class, asked], [floor, device_class, asked]]

  is_locked:
    title: Is a lock locked
    icon: mdi:lock-question
    description: say if a door is locked
    require: [[is, are]]
    optional: [[in, on], [the]]
    names:
      entity: {count: 1, domains: [lock, binary_sensor]}
      area: {count: 1}
    # A room with the device picks it out: the one of that name there.
    combinations: [[entity, asked], [entity, area, asked]]
    lists:
      asked: {list: locked_unlocked}
    response: >-
      {%- set e = slots.entity[0] -%}
      {%- if e.startswith('binary_sensor.') -%}
      {%- set state = 'unlocked' if is_state(e, 'on') else ('locked' if is_state(e, 'off') else states(e)) -%}
      {%- else -%}
      {%- set state = states(e) -%}
      {%- endif -%}
      {%- set said = names.get(e, state_attr(e, 'friendly_name')) ~ ' is ' ~ state ~ '.' -%}
      {%- if state in ['locked', 'unlocked'] -%}
      {{ 'Yes' if state == slots.asked else 'No' }}, {{ said }}
      {%- else -%}
      {{ said }}
      {%- endif -%}
    needs:
      - Add names for the locks it may ask about (Names page). A binary sensor of
        the lock class works too (on is unlocked); type its entity id there.

  all_locked:
    title: Is everything locked
    icon: mdi:lock-alert
    description: say if all the doors are locked
    require: [[is, are], [all, any, everything, doors]]
    optional: [[the], [doors, locks]]
    lists:
      asked: {list: locked_unlocked}
    response: >-
      {%- set ns = namespace(open=[], total=0) -%}
      {%- for s in states.lock if s.entity_id in exposed -%}
      {%- set ns.total = ns.total + 1 -%}
      {%- if s.state != 'locked' -%}
      {%- set ns.open = ns.open + [s.name ~ ' is ' ~ s.state] -%}
      {%- endif -%}
      {%- endfor -%}
      {%- for s in states.binary_sensor | selectattr('entity_id', 'in', exposed) | selectattr('attributes.device_class', 'defined')
        | selectattr('attributes.device_class', 'eq', 'lock') -%}
      {%- set ns.total = ns.total + 1 -%}
      {%- if s.state != 'off' -%}
      {%- set ns.open = ns.open + [s.name ~ ' is ' ~ ('unlocked' if s.state == 'on' else s.state)] -%}
      {%- endif -%}
      {%- endfor -%}
      {%- set count = ns.open | count -%}
      {%- set asked = slots.asked or 'locked' -%}
      {%- if ns.total == 0 -%}
      There aren't any locks.
      {%- elif count == 0 -%}
      {{ 'Yes' if asked == 'locked' else 'No' }},
      {{- ' it is locked' if ns.total == 1 else ' all ' ~ ns.total ~ ' are locked' }}.
      {%- else -%}
      {{ 'Yes' if asked == 'unlocked' else 'No' }},
      {{ (ns.open[:-1] | join(', ') ~ ' and ' ~ ns.open[-1]) if count > 1 else ns.open[0] }}.
      {%- endif -%}
