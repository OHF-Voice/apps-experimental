# The value lists every home has in English (Pack.lists): a command's value
# slot uses one by name ({list: colors}). A home's own list by the same name,
# in English, takes its place (the Names page). Values are what Home Assistant
# gets: CSS color names, cover device classes, HVAC modes.
colors:
  red: [red]
  orange: [orange]
  yellow: [yellow]
  green: [green]
  blue: [blue]
  purple: [purple]
  pink: [pink]
  white: [white]
  turquoise: [turquoise]
  magenta: [magenta]
on_off:
  "on": ["on"]
  "off": ["off"]
cover_classes:
  awning: [awning, awnings]
  blind: [blind, blinds]
  curtain: [curtain, curtains, drapes]
  door: [door, doors]
  garage: [garage door, garage doors, garage]
  gate: [gate, gates]
  shade: [shade, shades]
  shutter: [shutter, shutters]
  window: [window, windows]
open_closed:
  open: [open]
  closed: [closed, shut]
locked_unlocked:
  locked: [locked]
  unlocked: [unlocked]
color_temperatures:
  "2700": [warm white, warm]
  "3000": [soft white]
  "4000": [neutral white, natural white, neutral]
  "5000": [cool white, cold white, cool]
  "6500": [daylight]
forecast_days:
  today: [today]
  tomorrow: [tomorrow]
  day_after_tomorrow: [the day after tomorrow, day after tomorrow]
  monday: [monday]
  tuesday: [tuesday]
  wednesday: [wednesday]
  thursday: [thursday]
  friday: [friday]
  saturday: [saturday]
  sunday: [sunday]
  weekend: [this weekend, the weekend, weekend]
weather_kinds:
  rain: [rain, raining, rainy, umbrella, wet]
  snow: [snow, snowing, snowy]
fan_modes:
  auto: [auto, automatic]
  "on": ["on", always on]
  "off": ["off"]
  low: [low]
  medium: [medium, mid]
  high: [high]
  circulate: [circulate, circulation]
hvac_modes:
  "off": ["off"]
  heat: [heat, heating]
  cool: [cool, cooling, air conditioning]
  heat_cool: [heat and cool, heat cool]
  auto: [auto, automatic]
  dry: [dry, dehumidify]
  fan_only: [fan only, just the fan]
