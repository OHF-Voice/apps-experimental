# Lights and switches (Italian), as the English library's lights.yaml.
title: Lights and switches
icon: mdi:lightbulb-outline

# What the versions add to a command (merged into them with <<).
shared:
  device: &device
    names:
      entity: {count: 1, domains: [light, switch, fan, media_player, input_boolean, climate]}
      area: {count: 1}
    # A room with the device picks it out: the one of that name there.
    combinations: [[entity], [entity, area]]
  place: &place
    names:
      area: {count: 1}
      floor: {count: 1}
    combinations: [[area], [floor]]
    needs:
      - Add names for the areas and floors it may act in (Names page).

commands:
  # Lights here, in an area or on a floor named, or a device by name.
  turn_on:
    title: Turn on
    icon: mdi:lightbulb-on-outline
    description: accendere la luce
    require: [[luce, luci, lampada, lampade, illuminazione], [accendi, accendere, accendete, attiva, attivare]]
    optional: [[tutte, tutto]]
    exclude: [spegni, spegnere, spegnete, disattiva]
    intent:
      name: HassTurnOn
      slots: {domain: light}
    verbosity: beep
    response:
      done:
        brief: Luce accesa.
        specific: Luce accesa {{ place.said }}.
        verbose: >-
          {%- set ns = namespace(names=result.names or []) -%}
          {%- set n = ns.names | count -%}
          {%- if n == 0 or n > 4 -%}
          Ho acceso {{ (n ~ ' luci') if n else 'la luce' }} {{ place.said }}.
          {%- else -%}
          Ho acceso {{ (ns.names[:-1] | join(', ') ~ ' e ' ~ ns.names[-1]) if n > 1 else ns.names[0] }} {{ place.said }}.
          {%- endif -%}
    variants:
      here:
        title: Turn on the lights in this satellite's area
        needs:
          - The lights in the satellite's area (Satellites page) are the ones it
            turns on.
      device:
        <<: *device
        title: Turn on a device by name
        icon: mdi:toggle-switch-outline
        description: accendere un dispositivo
        require: [[accendi, accendere, accendete, attiva, attivare]]
        intent: HassTurnOn
        response:
          done:
            brief: Acceso.
            specific: "Ho acceso {{ names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) }}."
            verbose: "Ho acceso {{ names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) }} {{ place.said }}."
        needs:
          - Add names for the devices it may turn on (Names page).
      place:
        <<: *place
        title: Turn on the lights in an area or floor

  turn_off:
    title: Turn off
    icon: mdi:lightbulb-off-outline
    description: spegnere la luce
    require: [[luce, luci, lampada, lampade, illuminazione], [spegni, spegnere, spegnete, disattiva, disattivare]]
    optional: [[tutte, tutto], [dappertutto, ovunque]]
    exclude: [accendi, accendere, accendete]
    intent:
      name: HassTurnOff
      slots: {domain: light}
    verbosity: beep
    response:
      done:
        brief: Luce spenta.
        specific: Luce spenta {{ place.said }}.
        verbose: >-
          {%- set ns = namespace(names=result.names or []) -%}
          {%- set n = ns.names | count -%}
          {%- if n == 0 or n > 4 -%}
          Ho spento {{ (n ~ ' luci') if n else 'la luce' }} {{ place.said }}.
          {%- else -%}
          Ho spento {{ (ns.names[:-1] | join(', ') ~ ' e ' ~ ns.names[-1]) if n > 1 else ns.names[0] }} {{ place.said }}.
          {%- endif -%}
    variants:
      here:
        title: Turn off the lights in this satellite's area
        needs:
          - The lights in the satellite's area (Satellites page) are the ones it
            turns off.
      device:
        <<: *device
        title: Turn off a device by name
        icon: mdi:toggle-switch-off-outline
        description: spegnere un dispositivo
        require: [[spegni, spegnere, spegnete, disattiva, disattivare]]
        intent: HassTurnOff
        response:
          done:
            brief: Spento.
            specific: "Ho spento {{ names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) }}."
            verbose: "Ho spento {{ names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) }} {{ place.said }}."
        needs:
          - Add names for the devices it may turn off (Names page).
      place:
        <<: *place
        title: Turn off the lights in an area or floor

  any_lights_on:
    title: Are any lights on
    icon: mdi:lightbulb-question
    description: sapere quali luci sono accese
    # No example sentences: one said word for word carries no area or floor.
    require: [[è, sono, c'è, ci sono], [luce, luci, lampada, lampade], [accesa, accese, acceso, accesi]]
    optional: [[ancora], [qualche]]
    exclude: [accendi, accendere, spegni, spegnere]
    response: >-
      {%- set named = slots.area or slots.floor -%}
      {%- set ns = namespace(areas=slots.area or [], on=[]) -%}
      {%- for f in slots.floor or [] -%}
      {%- set ns.areas = ns.areas + (floor_areas(f) | list) -%}
      {%- endfor -%}
      {%- if not named and satellite.area_id -%}
      {%- set ns.areas = [satellite.area_id] -%}
      {%- endif -%}
      {%- set where = (' ' ~ place.said) if place.said else '' -%}
      {%- for s in states.light if s.entity_id in devices and (not ns.areas or devices[s.entity_id] in ns.areas) and s.state == 'on' -%}
      {%- set ns.on = ns.on + [names.get(s.entity_id, s.name)] -%}
      {%- endfor -%}
      {%- set count = ns.on | count -%}
      {%- if count == 0 -%}
      No, le luci{{ where }} sono spente.
      {%- elif count > 3 -%}
      Sì, {{ count }} luci{{ where }} sono accese.
      {%- else -%}
      Sì, {{ (ns.on[:-1] | join(', ') ~ ' e ' ~ ns.on[-1]) if count > 1 else ns.on[0] }}
      {{- ' è accesa' if count == 1 else ' sono accese' }}.
      {%- endif -%}
    variants:
      here:
        title: Are any lights on in this satellite's area
        needs:
          - The satellite's area (Satellites page) is the one it asks about.
      device:
        <<: *device
        title: Is a device on, by name
        icon: mdi:toggle-switch-outline
        description: sapere se un dispositivo è acceso
        require: [[è, sono]]
        optional: [[ancora]]
        names:
          entity: {count: 1, domains: [light, switch, fan, input_boolean]}
          area: {count: 1}
        lists:
          asked: {list: on_off}
        combinations: [[entity, asked], [entity, area, asked]]
        response: >-
          {%- set e = slots.entity[0] -%}
          {%- set state = states(e) -%}
          {%- set words = {'on': 'acceso', 'off': 'spento', 'unavailable': 'non disponibile', 'unknown': 'sconosciuto'} -%}
          {%- set said = names.get(e, state_attr(e, 'friendly_name')) ~ ': ' ~ words.get(state, state) ~ '.' -%}
          {%- if state in ['on', 'off'] -%}
          {{ 'Sì' if state == slots.asked else 'No' }}, {{ said }}
          {%- else -%}
          {{ said }}
          {%- endif -%}
        needs:
          - Add names for the lights and switches it may ask about (Names page).
      place:
        <<: *place
        title: Are any lights on in an area or floor

  set_brightness:
    title: Set the brightness
    icon: mdi:brightness-6
    description: regolare la luminosità
    supports: brightness
    require: [[luminosità, per cento, percento]]
    optional: [[imposta, metti, regola, porta, abbassa, alza], [luce, luci, lampada, lampade], [luminosità], [per cento]]
    # "Metti il volume al 30 per cento" is the music's.
    exclude: [volume]
    number: percentage
    intent:
      name: HassLightSet
      slots: {brightness: "{{ slots.percentage }}"}
    verbosity: beep
    response:
      done:
        brief: Luminosità regolata.
        specific: >-
          {{ names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) if slots.entity
          else 'Luce ' ~ place.said }} al {{ slots.percentage }} per cento.
    variants:
      here:
        title: Set the brightness in this satellite's area
      device:
        <<: *device
        title: Set the brightness of a light by name
        names:
          entity: {count: 1, domains: [light]}
          area: {count: 1}
        combinations: [[entity, percentage], [entity, area, percentage]]
        needs:
          - Add names for the lights it may dim (Names page).
      place:
        <<: *place
        title: Set the brightness in an area or floor
        combinations: [[area, percentage], [floor, percentage]]

  light_color:
    title: Set the light color
    icon: mdi:format-color-fill
    description: cambiare il colore della luce
    supports: color
    require: [[metti, imposta, cambia, colora, fai], [luce, luci, lampada, lampade]]
    optional: [[colore]]
    lists:
      color: {list: colors}
    intent:
      name: HassLightSet
      slots: {color: "{{ slots.color }}"}
    verbosity: beep
    response:
      done:
        brief: Colore cambiato.
        specific: >-
          {%- set colori = {'red': 'rosso', 'orange': 'arancione', 'yellow': 'giallo', 'green': 'verde',
            'blue': 'blu', 'purple': 'viola', 'pink': 'rosa', 'white': 'bianco', 'turquoise': 'turchese', 'magenta': 'magenta'} -%}
          {{ names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) if slots.entity
          else 'Luce ' ~ place.said }}: {{ colori.get(slots.color, slots.color) }}.
    variants:
      here:
        title: Set the light color in this satellite's area
      device:
        <<: *device
        title: Set the color of a light by name
        require: [[metti, imposta, cambia, colora, fai]]
        names:
          entity: {count: 1, domains: [light]}
          area: {count: 1}
        combinations: [[entity, color], [entity, area, color]]
        needs:
          - Add names for the lights it may color (Names page).
      place:
        <<: *place
        title: Set the light color in an area or floor
        combinations: [[area, color], [floor, color]]
