# Example commands for the web UI's library (Italian), as the English
# library (voice_call/languages/en/library/basic.yaml): titles and needs are
# the UI's, in English; descriptions are said in hints ("Sembra che tu voglia
# <description>, ..."), so each is what one wants to do: "accendere la luce".
#
# Keywords are lowercase with their accents. Articles and prepositions ("la",
# "nel", "della") are filler (the language pack's); a name may be heard with
# its article joined ("nell'ingresso").
title: Basics
icon: mdi:home-outline

# What the versions add to a command (merged into them with <<).
shared:
  device: &device
    names:
      entity: {count: 1, domains: [light, switch, fan, media_player, input_boolean, climate]}
      area: {count: 1}
    # A room with the device picks it out: the one of that name there.
    combinations: [[entity], [entity, area]]
  place: &place
    names:
      area: {count: 1}
      floor: {count: 1}
    combinations: [[area], [floor]]
    needs:
      - Add names for the areas and floors it may act in (Names page).

commands:
  what_time:
    title: What time is it
    icon: mdi:clock-outline
    description: sapere che ore sono
    examples: ["che ore sono", "che ora è", "mi dici che ore sono"]
    require: [[che ore, che ora]]
    optional: [[sono, è], [adesso]]
    # Other times: "a che ora chiude il negozio", "che ore sono a Tokyo".
    exclude: [chiude, apre, dopo, prima, fino, sarà]
    response: >-
      {%- set h, m = now().hour, now().minute -%}
      {%- if h == 12 and m == 0 -%}È mezzogiorno.
      {%- elif h == 0 and m == 0 -%}È mezzanotte.
      {%- elif h == 1 -%}È l'una{{ (' e ' ~ m) if m else '' }}.
      {%- else -%}Sono le {{ h }}{{ (' e ' ~ m) if m else '' }}.
      {%- endif -%}

  what_date:
    title: What's the date
    icon: mdi:calendar-today
    description: sapere la data
    examples: ["che giorno è oggi", "quanti ne abbiamo oggi", "qual è la data di oggi"]
    require: [[data, che giorno, quanti ne abbiamo]]
    optional: [[qual è la], [è], [oggi]]
    exclude: [settimana, cade, cadrà, mancano, dopo, prima, sarà, era]
    response: >-
      {%- set giorni = ['lunedì', 'martedì', 'mercoledì', 'giovedì', 'venerdì', 'sabato', 'domenica'] -%}
      {%- set mesi = ['gennaio', 'febbraio', 'marzo', 'aprile', 'maggio', 'giugno', 'luglio', 'agosto',
        'settembre', 'ottobre', 'novembre', 'dicembre'] -%}
      Oggi è {{ giorni[now().weekday()] }} {{ 'primo' if now().day == 1 else now().day }} {{ mesi[now().month - 1] }}.

  never_mind:
    title: Never mind
    icon: mdi:close-circle-outline
    description: non fare niente
    # Said whole only: "annulla il timer" is the timer's.
    examples: [lascia perdere, lascia stare, niente, annulla, non importa, fa niente]

  # Lights here, in an area or on a floor named, or a device by name.
  turn_on:
    title: Turn on
    icon: mdi:lightbulb-on-outline
    description: accendere la luce
    require: [[luce, luci, lampada, lampade, illuminazione], [accendi, accendere, accendete, attiva, attivare]]
    optional: [[tutte, tutto]]
    exclude: [spegni, spegnere, spegnete, disattiva]
    intent:
      name: HassTurnOn
      slots: {domain: light}
    verbosity: beep
    response:
      done:
        brief: Luce accesa.
        specific: Luce accesa {{ place.said }}.
        verbose: >-
          {%- set ns = namespace(names=result.names or []) -%}
          {%- set n = ns.names | count -%}
          {%- if n == 0 or n > 4 -%}
          Ho acceso {{ (n ~ ' luci') if n else 'la luce' }} {{ place.said }}.
          {%- else -%}
          Ho acceso {{ (ns.names[:-1] | join(', ') ~ ' e ' ~ ns.names[-1]) if n > 1 else ns.names[0] }} {{ place.said }}.
          {%- endif -%}
    variants:
      here:
        title: Turn on the lights in this satellite's area
        needs:
          - The lights in the satellite's area (Satellites page) are the ones it
            turns on.
      device:
        <<: *device
        title: Turn on a device by name
        icon: mdi:toggle-switch-outline
        description: accendere un dispositivo
        require: [[accendi, accendere, accendete, attiva, attivare]]
        intent: HassTurnOn
        response:
          done:
            brief: Acceso.
            specific: "Ho acceso {{ state_attr(slots.entity[0], 'friendly_name') }}."
            verbose: "Ho acceso {{ state_attr(slots.entity[0], 'friendly_name') }} {{ place.said }}."
        needs:
          - Add names for the devices it may turn on (Names page).
      place:
        <<: *place
        title: Turn on the lights in an area or floor

  turn_off:
    title: Turn off
    icon: mdi:lightbulb-off-outline
    description: spegnere la luce
    require: [[luce, luci, lampada, lampade, illuminazione], [spegni, spegnere, spegnete, disattiva, disattivare]]
    optional: [[tutte, tutto], [dappertutto, ovunque]]
    exclude: [accendi, accendere, accendete]
    intent:
      name: HassTurnOff
      slots: {domain: light}
    verbosity: beep
    response:
      done:
        brief: Luce spenta.
        specific: Luce spenta {{ place.said }}.
        verbose: >-
          {%- set ns = namespace(names=result.names or []) -%}
          {%- set n = ns.names | count -%}
          {%- if n == 0 or n > 4 -%}
          Ho spento {{ (n ~ ' luci') if n else 'la luce' }} {{ place.said }}.
          {%- else -%}
          Ho spento {{ (ns.names[:-1] | join(', ') ~ ' e ' ~ ns.names[-1]) if n > 1 else ns.names[0] }} {{ place.said }}.
          {%- endif -%}
    variants:
      here:
        title: Turn off the lights in this satellite's area
        needs:
          - The lights in the satellite's area (Satellites page) are the ones it
            turns off.
      device:
        <<: *device
        title: Turn off a device by name
        icon: mdi:toggle-switch-off-outline
        description: spegnere un dispositivo
        require: [[spegni, spegnere, spegnete, disattiva, disattivare]]
        intent: HassTurnOff
        response:
          done:
            brief: Spento.
            specific: "Ho spento {{ state_attr(slots.entity[0], 'friendly_name') }}."
            verbose: "Ho spento {{ state_attr(slots.entity[0], 'friendly_name') }} {{ place.said }}."
        needs:
          - Add names for the devices it may turn off (Names page).
      place:
        <<: *place
        title: Turn off the lights in an area or floor

  any_lights_on:
    title: Are any lights on
    icon: mdi:lightbulb-question
    description: sapere quali luci sono accese
    # No example sentences: one said word for word carries no area or floor.
    require: [[è, sono, c'è, ci sono], [luce, luci, lampada, lampade], [accesa, accese, acceso, accesi]]
    optional: [[ancora], [qualche]]
    exclude: [accendi, accendere, spegni, spegnere]
    response: >-
      {%- set named = slots.area or slots.floor -%}
      {%- set ns = namespace(areas=slots.area or [], on=[]) -%}
      {%- for f in slots.floor or [] -%}
      {%- set ns.areas = ns.areas + (floor_areas(f) | list) -%}
      {%- endfor -%}
      {%- if not named and satellite.area_id -%}
      {%- set ns.areas = [satellite.area_id] -%}
      {%- endif -%}
      {%- set where = (' ' ~ place.said) if place.said else '' -%}
      {%- for s in states.light if s.entity_id in exposed and (not ns.areas or area_id(s.entity_id) in ns.areas) and s.state == 'on' -%}
      {%- set ns.on = ns.on + [s.name] -%}
      {%- endfor -%}
      {%- set count = ns.on | count -%}
      {%- if count == 0 -%}
      No, le luci{{ where }} sono spente.
      {%- elif count > 3 -%}
      Sì, {{ count }} luci{{ where }} sono accese.
      {%- else -%}
      Sì, {{ (ns.on[:-1] | join(', ') ~ ' e ' ~ ns.on[-1]) if count > 1 else ns.on[0] }}
      {{- ' è accesa' if count == 1 else ' sono accese' }}.
      {%- endif -%}
    variants:
      here:
        title: Are any lights on in this satellite's area
        needs:
          - The satellite's area (Satellites page) is the one it asks about.
      device:
        <<: *device
        title: Is a device on, by name
        icon: mdi:toggle-switch-outline
        description: sapere se un dispositivo è acceso
        require: [[è, sono]]
        optional: [[ancora]]
        names:
          entity: {count: 1, domains: [light, switch, fan, input_boolean]}
          area: {count: 1}
        lists:
          asked: {list: on_off}
        combinations: [[entity, asked], [entity, area, asked]]
        response: >-
          {%- set e = slots.entity[0] -%}
          {%- set state = states(e) -%}
          {%- set words = {'on': 'acceso', 'off': 'spento', 'unavailable': 'non disponibile', 'unknown': 'sconosciuto'} -%}
          {%- set said = state_attr(e, 'friendly_name') ~ ': ' ~ words.get(state, state) ~ '.' -%}
          {%- if state in ['on', 'off'] -%}
          {{ 'Sì' if state == slots.asked else 'No' }}, {{ said }}
          {%- else -%}
          {{ said }}
          {%- endif -%}
        needs:
          - Add names for the lights and switches it may ask about (Names page).
      place:
        <<: *place
        title: Are any lights on in an area or floor

  set_brightness:
    title: Set the brightness
    icon: mdi:brightness-6
    description: regolare la luminosità
    require: [[luminosità, per cento, percento]]
    optional: [[imposta, metti, regola, porta, abbassa, alza], [luce, luci, lampada, lampade], [luminosità], [per cento]]
    # "Metti il volume al 30 per cento" is the music's.
    exclude: [volume]
    number: percentage
    intent:
      name: HassLightSet
      slots: {brightness: "{{ slots.percentage }}"}
    verbosity: beep
    response:
      done:
        brief: Luminosità regolata.
        specific: >-
          {{ state_attr(slots.entity[0], 'friendly_name') if slots.entity
          else 'Luce ' ~ place.said }} al {{ slots.percentage }} per cento.
    variants:
      here:
        title: Set the brightness in this satellite's area
      device:
        <<: *device
        title: Set the brightness of a light by name
        names:
          entity: {count: 1, domains: [light]}
          area: {count: 1}
        combinations: [[entity, percentage], [entity, area, percentage]]
        needs:
          - Add names for the lights it may dim (Names page).
      place:
        <<: *place
        title: Set the brightness in an area or floor
        combinations: [[area, percentage], [floor, percentage]]

  light_color:
    title: Set the light color
    icon: mdi:format-color-fill
    description: cambiare il colore della luce
    require: [[metti, imposta, cambia, colora, fai], [luce, luci, lampada, lampade]]
    optional: [[colore]]
    lists:
      color: {list: colors}
    intent:
      name: HassLightSet
      slots: {color: "{{ slots.color }}"}
    verbosity: beep
    response:
      done:
        brief: Colore cambiato.
        specific: >-
          {%- set colori = {'red': 'rosso', 'orange': 'arancione', 'yellow': 'giallo', 'green': 'verde',
            'blue': 'blu', 'purple': 'viola', 'pink': 'rosa', 'white': 'bianco', 'turquoise': 'turchese', 'magenta': 'magenta'} -%}
          {{ state_attr(slots.entity[0], 'friendly_name') if slots.entity
          else 'Luce ' ~ place.said }}: {{ colori.get(slots.color, slots.color) }}.
    variants:
      here:
        title: Set the light color in this satellite's area
      device:
        <<: *device
        title: Set the color of a light by name
        require: [[metti, imposta, cambia, colora, fai]]
        names:
          entity: {count: 1, domains: [light]}
          area: {count: 1}
        combinations: [[entity, color], [entity, area, color]]
        needs:
          - Add names for the lights it may color (Names page).
      place:
        <<: *place
        title: Set the light color in an area or floor
        combinations: [[area, color], [floor, color]]

  set_temperature:
    title: Set the temperature
    icon: mdi:thermometer
    description: regolare la temperatura
    require: [[temperatura, gradi, grado, riscaldamento]]
    optional: [[imposta, metti, regola, porta, alza, abbassa], [gradi, grado], [termostato]]
    # A question about degrees is not a setting: "quanto fanno 20 gradi in
    # Fahrenheit".
    exclude: [quanto, quanti, quale, converti, fa, fanno, è, sono]
    number: temperature
    intent:
      name: HassClimateSetTemperature
      slots: {temperature: "{{ slots.temperature }}"}
    # Not seen at once, and a misheard number matters: said.
    verbosity: specific
    response:
      done:
        brief: Temperatura impostata.
        specific: >-
          {{ state_attr(slots.entity[0], 'friendly_name') if slots.entity
          else 'Temperatura ' ~ place.said }} a {{ slots.temperature | string | replace('.', ',') }} gradi.
    variants:
      here:
        title: Set the temperature in this satellite's area
      device:
        <<: *device
        title: Set the temperature of a thermostat by name
        require: [[imposta, metti, regola, porta, alza, abbassa, temperatura, gradi, grado]]
        optional: [[gradi, grado]]
        names:
          entity: {count: 1, domains: [climate]}
          area: {count: 1}
        combinations: [[entity, temperature], [entity, area, temperature]]
        needs:
          - Add names for the thermostats it may set (Names page).
      place:
        <<: *place
        title: Set the temperature in an area or floor
        combinations: [[area, temperature], [floor, temperature]]

  weather:
    title: What's the weather
    icon: mdi:weather-partly-cloudy
    description: sapere che tempo fa
    examples: ["che tempo fa [oggi]", "pioverà [oggi]", "com'è il meteo"]
    require: [[meteo, che tempo, pioverà, previsioni]]
    exclude: [manca, mancano, timer, quanto]
    slots:
      entity: [weather.home]
    response: >-
      {%- set meteo = {'clear-night': 'sereno', 'cloudy': 'nuvoloso', 'exceptional': 'eccezionale',
        'fog': 'nebbia', 'hail': 'grandine', 'lightning': 'temporale', 'lightning-rainy': 'temporale con pioggia',
        'partlycloudy': 'parzialmente nuvoloso', 'pouring': 'pioggia forte', 'rainy': 'pioggia',
        'snowy': 'neve', 'snowy-rainy': 'nevischio', 'sunny': 'sole', 'windy': 'vento',
        'windy-variant': 'vento e nuvole'} -%}
      {%- set state = states(slots.entity[0]) -%}
      Tempo: {{ meteo.get(state, state) }}, con
      {{ state_attr(slots.entity[0], 'temperature') | round }} gradi.
    needs:
      - Point it at your weather entity (Implied target: weather.home here).

  shopping_list_add:
    title: Add to the shopping list
    icon: mdi:cart-plus
    description: aggiungere qualcosa alla lista della spesa
    require: [[aggiungi, metti, segna, scrivi], [lista della spesa, lista spesa]]
    optional: [[alla, nella, sulla]]
    wildcard:
      slot: item
      after: [aggiungi, metti, segna, scrivi]
      before: [alla, nella, sulla]
      bounded: true
      max_words: 8
    slots:
      entity: [todo.shopping_list]
    # Several at once, each an item of its own: "oranges and bananas".
    action:
      repeat:
        for_each: >-
          {{ (slots.item | regex_replace('\\s*,\\s*|\\s+(?:e|ed)\\s+', '|', true)).split('|')
          | map('trim') | reject('eq', '') | list }}
        sequence:
          - action: todo.add_item
            target:
              entity_id: "{{ slots.entity }}"
            data:
              item: "{{ repeat.item }}"
    verbosity: specific
    response:
      done:
        brief: Aggiunto alla lista della spesa.
        specific: "{{ slots.item }}: aggiunto alla lista della spesa."

  shopping_list_remove:
    title: Take off the shopping list
    icon: mdi:cart-minus
    description: togliere qualcosa dalla lista della spesa
    require: [[togli, rimuovi, elimina, cancella, leva], [lista della spesa, lista spesa]]
    optional: [[dalla]]
    wildcard:
      slot: item
      after: [togli, rimuovi, elimina, cancella, leva]
      before: [dalla]
      bounded: true
      max_words: 5
    slots:
      entity: [todo.shopping_list]
    action:
      action: todo.remove_item
      target:
        entity_id: "{{ slots.entity }}"
      data:
        item: "{{ slots.item }}"
    verbosity: specific
    response:
      done:
        brief: Tolto dalla lista della spesa.
        specific: "{{ slots.item }}: tolto dalla lista della spesa."

  todo_add:
    title: Add to the to-do list
    icon: mdi:format-list-checks
    description: aggiungere qualcosa alla lista delle cose da fare
    require: [[aggiungi, metti, segna, scrivi], [cose da fare, lista delle attività]]
    optional: [[alla, nella, sulla], [lista delle]]
    wildcard:
      slot: item
      after: [aggiungi, metti, segna, scrivi]
      before: [alla, nella, sulla]
      bounded: true
      max_words: 8
    slots:
      entity: [todo.to_do]
    action:
      action: todo.add_item
      target:
        entity_id: "{{ slots.entity }}"
      data:
        item: "{{ slots.item }}"
    verbosity: specific
    response:
      done:
        brief: Aggiunto alle cose da fare.
        specific: "{{ slots.item }}: aggiunto alle cose da fare."
    needs:
      - Point it at your to-do list (todo.to_do here).

  remind_me:
    title: Remember something
    icon: mdi:note-edit-outline
    description: farsi ricordare qualcosa
    # "Ricordami di annaffiare le piante", "ricordami di portare fuori la spazzatura".
    require: [[ricordami, ricordatemi]]
    optional: [[di]]
    wildcard:
      slot: reminder
      after: [di, ricordami, ricordatemi]
      to_end: true
      max_words: 10
    # The speaker's own to-do list, when anyone has one (People page).
    slots:
      entity: [todo.reminders]
    mine: todo_list
    action:
      action: todo.add_item
      target:
        entity_id: "{{ slots.entity }}"
      data:
        item: "{{ slots.reminder }}"
    verbosity: specific
    response:
      done:
        brief: Te lo ricorderò.
        specific: "Te lo ricorderò: {{ slots.reminder }}."
    needs:
      - Point it at a to-do list (todo.reminders here). Where someone has a
        to-do list of their own (People page), theirs, and they must be
        recognized.

  scene:
    title: Activate a scene
    icon: mdi:palette
    description: avviare la serata cinema
    examples: ["[attiva] [la] serata cinema"]
    scene: scene.movie_time
    verbosity: beep
    response:
      done:
        brief: Fatto.
    needs:
      - Take control of it, then pick the scene and say it your way.

  script:
    title: Run a script
    icon: mdi:script-text-outline
    description: dire buonanotte
    examples: [buonanotte, buona notte]
    script: script.good_night
    response: "{{ result.speech if result and result.speech else 'Buonanotte.' }}"
    needs:
      - Take control of it, then pick the script. It gets slots, satellite, speaker and target as variables,
        and anything it returns (stop with response_variable) as result.
