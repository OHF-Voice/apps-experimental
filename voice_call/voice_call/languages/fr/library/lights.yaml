# Lights and switches (French), as the English library's lights.yaml.
title: Lights and switches
icon: mdi:lightbulb-outline

# What the versions add to a command (merged into them with <<).
shared:
  device: &device
    names:
      entity: {count: 1, domains: [light, switch, fan, media_player, input_boolean, climate]}
      area: {count: 1}
    # A room with the device picks it out: the one of that name there.
    combinations: [[entity], [entity, area]]
  place: &place
    names:
      area: {count: 1}
      floor: {count: 1}
    combinations: [[area], [floor]]
    needs:
      - Add names for the areas and floors it may act in (Names page).

commands:
  # Lights here, in an area or on a floor named, or a device by name.
  turn_on:
    title: Turn on
    icon: mdi:lightbulb-on-outline
    description: allumer la lumière
    require: [[lumière, lumières, lampe, lampes, éclairage, l'éclairage], [allume, allumer, allumez, active, activer]]
    optional: [[toutes, tous, tout]]
    exclude: [éteins, éteindre, éteignez, coupe, désactive]
    intent:
      name: HassTurnOn
      slots: {domain: light}
    verbosity: beep
    response:
      done:
        brief: Lumière allumée.
        specific: Lumière allumée {{ place.said }}.
        verbose: >-
          {%- set ns = namespace(names=result.names or []) -%}
          {%- set n = ns.names | count -%}
          {%- if n == 0 or n > 4 -%}
          J'ai allumé {{ (n ~ ' lumières') if n else 'la lumière' }} {{ place.said }}.
          {%- else -%}
          J'ai allumé {{ (ns.names[:-1] | join(', ') ~ ' et ' ~ ns.names[-1]) if n > 1 else ns.names[0] }} {{ place.said }}.
          {%- endif -%}
    variants:
      here:
        title: Turn on the lights in this satellite's area
        needs:
          - The lights in the satellite's area (Satellites page) are the ones it
            turns on.
      device:
        <<: *device
        title: Turn on a device by name
        icon: mdi:toggle-switch-outline
        description: allumer un appareil
        require: [[allume, allumer, allumez, active, activer, mets en marche]]
        intent: HassTurnOn
        response:
          done:
            brief: C'est allumé.
            specific: "J'ai allumé {{ names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) }}."
            verbose: "J'ai allumé {{ names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) }} {{ place.said }}."
        needs:
          - Add names for the devices it may turn on (Names page).
      place:
        <<: *place
        title: Turn on the lights in an area or floor

  turn_off:
    title: Turn off
    icon: mdi:lightbulb-off-outline
    description: éteindre la lumière
    # "étant": éteins as a speech-to-text often writes it.
    require: [[lumière, lumières, lampe, lampes, éclairage, l'éclairage], [éteins, éteint, éteindre, éteignez, coupe, couper, désactive, étant]]
    optional: [[toutes, tous, tout], [partout]]
    exclude: [allume, allumer, allumez]
    intent:
      name: HassTurnOff
      slots: {domain: light}
    verbosity: beep
    response:
      done:
        brief: Lumière éteinte.
        specific: Lumière éteinte {{ place.said }}.
        verbose: >-
          {%- set ns = namespace(names=result.names or []) -%}
          {%- set n = ns.names | count -%}
          {%- if n == 0 or n > 4 -%}
          J'ai éteint {{ (n ~ ' lumières') if n else 'la lumière' }} {{ place.said }}.
          {%- else -%}
          J'ai éteint {{ (ns.names[:-1] | join(', ') ~ ' et ' ~ ns.names[-1]) if n > 1 else ns.names[0] }} {{ place.said }}.
          {%- endif -%}
    variants:
      here:
        title: Turn off the lights in this satellite's area
        needs:
          - The lights in the satellite's area (Satellites page) are the ones it
            turns off.
      device:
        <<: *device
        title: Turn off a device by name
        icon: mdi:toggle-switch-off-outline
        description: éteindre un appareil
        require: [[éteins, éteint, éteindre, éteignez, coupe, couper, désactive, étant]]
        intent: HassTurnOff
        response:
          done:
            brief: C'est éteint.
            specific: "J'ai éteint {{ names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) }}."
            verbose: "J'ai éteint {{ names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) }} {{ place.said }}."
        needs:
          - Add names for the devices it may turn off (Names page).
      place:
        <<: *place
        title: Turn off the lights in an area or floor

  any_lights_on:
    title: Are any lights on
    icon: mdi:lightbulb-question
    description: savoir quelles lumières sont allumées
    # No example sentences: one said word for word carries no area or floor.
    require: [[est ce que, est, sont, y a t il], [lumière, lumières, lampe, lampes], [allumée, allumées, allumé, allumés]]
    optional: [[encore], [une]]
    exclude: [allume, allumer, éteins, éteindre]
    response: >-
      {%- set named = slots.area or slots.floor -%}
      {%- set ns = namespace(areas=slots.area or [], on=[]) -%}
      {%- for f in slots.floor or [] -%}
      {%- set ns.areas = ns.areas + (floor_areas(f) | list) -%}
      {%- endfor -%}
      {%- if not named and satellite.area_id -%}
      {%- set ns.areas = [satellite.area_id] -%}
      {%- endif -%}
      {%- set where = (' ' ~ place.said) if place.said else '' -%}
      {%- for s in states.light if s.entity_id in devices and (not ns.areas or devices[s.entity_id] in ns.areas) and s.state == 'on' -%}
      {%- set ns.on = ns.on + [names.get(s.entity_id, s.name)] -%}
      {%- endfor -%}
      {%- set count = ns.on | count -%}
      {%- if count == 0 -%}
      Non, les lumières{{ where }} sont éteintes.
      {%- elif count > 3 -%}
      Oui, {{ count }} lumières{{ where }} sont allumées.
      {%- else -%}
      Oui, {{ (ns.on[:-1] | join(', ') ~ ' et ' ~ ns.on[-1]) if count > 1 else ns.on[0] }}
      {{- ' est allumé' if count == 1 else ' sont allumés' }}.
      {%- endif -%}
    variants:
      here:
        title: Are any lights on in this satellite's area
        needs:
          - The satellite's area (Satellites page) is the one it asks about.
      device:
        <<: *device
        title: Is a device on, by name
        icon: mdi:toggle-switch-outline
        description: savoir si un appareil est allumé
        require: [[est ce que, est, sont]]
        optional: [[encore]]
        names:
          entity: {count: 1, domains: [light, switch, fan, input_boolean]}
          area: {count: 1}
        lists:
          asked: {list: on_off}
        combinations: [[entity, asked], [entity, area, asked]]
        response: >-
          {%- set e = slots.entity[0] -%}
          {%- set state = states(e) -%}
          {%- set words = {'on': 'allumé', 'off': 'éteint', 'unavailable': 'indisponible', 'unknown': 'inconnu'} -%}
          {%- set said = names.get(e, state_attr(e, 'friendly_name')) ~ ' est ' ~ words.get(state, state) ~ '.' -%}
          {%- if state in ['on', 'off'] -%}
          {{ 'Oui' if state == slots.asked else 'Non' }}, {{ said }}
          {%- else -%}
          {{ said }}
          {%- endif -%}
        needs:
          - Add names for the lights and switches it may ask about (Names page).
      place:
        <<: *place
        title: Are any lights on in an area or floor

  set_brightness:
    title: Set the brightness
    icon: mdi:brightness-6
    description: régler la luminosité
    supports: brightness
    require: [[luminosité, pour cent, pourcent]]
    optional: [[règle, mets, mais, change, baisse, monte], [lumière, lumières, lampe, lampes], [à, sur], [luminosité], [pour cent]]
    # "Mets le volume à 30 pour cent" is the music's.
    exclude: [volume, son]
    number: percentage
    intent:
      name: HassLightSet
      slots: {brightness: "{{ slots.percentage }}"}
    verbosity: beep
    response:
      done:
        brief: Luminosité réglée.
        specific: >-
          {{ names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) if slots.entity
          else 'Lumière ' ~ place.said }} à {{ slots.percentage }} pour cent.
    variants:
      here:
        title: Set the brightness in this satellite's area
      device:
        <<: *device
        title: Set the brightness of a light by name
        names:
          entity: {count: 1, domains: [light]}
          area: {count: 1}
        combinations: [[entity, percentage], [entity, area, percentage]]
        needs:
          - Add names for the lights it may dim (Names page).
      place:
        <<: *place
        title: Set the brightness in an area or floor
        combinations: [[area, percentage], [floor, percentage]]

  light_color:
    title: Set the light color
    icon: mdi:format-color-fill
    description: changer la couleur de la lumière
    supports: color
    # "mais": mets as a speech-to-text often writes it.
    require: [[mets, mais, règle, change, colore], [lumière, lumières, lampe, lampes]]
    optional: [[en], [couleur]]
    lists:
      color: {list: colors}
    intent:
      name: HassLightSet
      slots: {color: "{{ slots.color }}"}
    verbosity: beep
    response:
      done:
        brief: Couleur changée.
        specific: >-
          {%- set couleurs = {'red': 'rouge', 'orange': 'orange', 'yellow': 'jaune', 'green': 'vert',
            'blue': 'bleu', 'purple': 'violet', 'pink': 'rose', 'white': 'blanc', 'turquoise': 'turquoise', 'magenta': 'magenta'} -%}
          {{ names.get(slots.entity[0], state_attr(slots.entity[0], 'friendly_name')) if slots.entity
          else 'Lumière ' ~ place.said }} en {{ couleurs.get(slots.color, slots.color) }}.
    variants:
      here:
        title: Set the light color in this satellite's area
      device:
        <<: *device
        title: Set the color of a light by name
        require: [[mets, mais, règle, change, colore]]
        names:
          entity: {count: 1, domains: [light]}
          area: {count: 1}
        combinations: [[entity, color], [entity, area, color]]
        needs:
          - Add names for the lights it may color (Names page).
      place:
        <<: *place
        title: Set the light color in an area or floor
        combinations: [[area, color], [floor, color]]
