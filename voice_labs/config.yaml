---
version: 0.2.0
slug: voice_labs
name: Voice Labs
description: Voice satellites with your own commands, recognized on this machine
url: https://github.com/OHF-Voice/voice-labs
arch:
  - amd64
  - aarch64
init: false
homeassistant_api: true
# mDNS discovery of satellites, and connecting to them.
host_network: true
ingress: true
# /config: custom wake words (wake_words/) and the wake word training kit
# (wake_training/), reachable from the Samba and file
# editor apps as addon_configs/<slug>_voice_labs.
map:
  - addon_config:rw
ingress_port: 8099
panel_icon: mdi:account-voice
panel_title: Voice Labs
# Home Assistant's pipelines: the app's speech-to-text, text-to-speech and
# conversation agent over Wyoming (voice_labs/wyoming_server.py), announced to
# Home Assistant; Parakeet's speech-to-text on the next port.
discovery:
  - wyoming
options:
  speaker_threshold: 0.45
  silence_seconds: 1.0
  wyoming_port: 10800
  debug_logging: false
schema:
  wake_cutoff: float(0.05,1)?
  speaker_threshold: float(0,1)
  silence_seconds: float(0.3,5)
  wyoming_port: int(0,65535)
  debug_logging: bool
homeassistant: 2025.10.0
