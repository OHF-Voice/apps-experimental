  the kitchen brightness to 15 percent: {expect: SetBrightness, slots: {area: [kitchen], number: 15}}
  the kitchen brightness to 30 percent: {expect: SetBrightness, slots: {area: [kitchen], number: 30}}
  the kitchen brightness at 100 percent: {expect: SetBrightness, slots: {area: [kitchen], number: 100}}
  the kitchen brightness is 90 percent: {expect: SetBrightness, slots: {area: [kitchen], number: 90}}
  the kitchen brightness is 150 percent: {expect: none}
  set the kitchen lights to 16 percent: {expect: SetBrightness, slots: {area: [kitchen], number: 16}}
  set the kitchen lights to 60 percent: {expect: SetBrightness, slots: {area: [kitchen], number: 60}}
  see the lights to 16 percent: {expect: SetBrightness, slots: {number: 16}}
  change the bedroom lamp to 14 percent: {expect: SetBrightness, slots: {entity: [light.bedroom_lamp], number: 14}}
  change the bedroom lamp to 40 percent: {expect: SetBrightness, slots: {entity: [light.bedroom_lamp], number: 40}}
  set the bedroom lamp color temperature to 2700 kelvin: {expect: SetColorTemperature, slots: {entity: [light.bedroom_lamp], number: 2700}}
  set the bedroom lamp to color temperature to 2700 kelvin: {expect: SetColorTemperature, slots: {entity: [light.bedroom_lamp], number: 2700}}
  make the kitchen lights warmer: {expect: Warmer, slots: {area: [kitchen]}}
  turn down the lights: {expect: Dim}

  # -- Climate
  set the temperature to 20.5 degrees: {expect: SetTemperature, slots: {number: 20.5}}
