  put the clean garbage onto my todo list: {expect: none}
  whats the weather tomorrow: {expect: none}
  whats the weather like in london: {expect: none}
  # Compound commands are rejected for their unused words, not split.
  turn on the kitchen lights and set brightness to 50: {expect: none}
  turn on the lights and set brightness to 50 percent: {expect: none}
  turn on the the kitchen lights and set the brightness to 50: {expect: none}
