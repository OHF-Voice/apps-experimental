  set a timer for a minute and a half: {expect: StartTimer, slots: {minutes: 1.5}}
  set a timer for 1 hour and 30 seconds: {expect: StartTimer, slots: {hours: 1, seconds: 30}}
  set a timer for 1 hour 5 minutes and 30 seconds: {expect: StartTimer, slots: {hours: 1, minutes: 5, seconds: 30}}
  set a timer for 1 hour and 5 minutes and 30 seconds: {expect: StartTimer, slots: {hours: 1, minutes: 5, seconds: 30}}
