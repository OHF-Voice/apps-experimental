# What each office-multicap prompt must come back as, for scripts/bench_corpus.py:
# the command (adapt-ctc intent) and the slots heard, or `none` for a command
# that must be refused. Sentences are the prompt without "okay nabu,", or a
# listener's correction where the speaker said something else
# (tests/corpus_corrections.csv). Slots are as recognized, before a command's
# fixed slots or presets are applied.
#
# Written for adapt_ctc/examples/home-extras.yaml (core intents plus the opt-in
# ones): the garage, the oven and the stairs are names it does not have, so
# those commands must not match. Copied from adapt-ctc's audio/office-multicap.yaml.
sentences:
  # -- On and off
  turn on the lights: {expect: TurnOnLights, slots: {}}
  turn off the lights: {expect: TurnOffLights, slots: {}}
  switch on the lights: {expect: TurnOnLights, slots: {}}
  switch off the lights: {expect: TurnOffLights, slots: {}}
  turn it off: {expect: TurnItOff, slots: {}}
  please turn on the lights: {expect: TurnOnLights, slots: {}}
  turn on the lights thanks: {expect: TurnOnLights, slots: {}}
  could you turn on the lights for me please: {expect: TurnOnLights, slots: {}}
  turn the kitchen lights on: {expect: TurnOnLights, slots: {area: [kitchen]}}
  turn on the kitchen lights: {expect: TurnOnLights, slots: {area: [kitchen]}}
  turn on the den lights: {expect: TurnOnLights, slots: {area: [living_room]}}
  turn on the lights in the den: {expect: TurnOnLights, slots: {area: [living_room]}}
  um could you turn on the kitchen lights for me please: {expect: TurnOnLights, slots: {area: [kitchen]}}
  turn off the den lights: {expect: TurnOffLights, slots: {area: [living_room]}}
  turn on the lights in the kitchen and the bedroom: {expect: TurnOnLightsAreas, slots: {area: [kitchen, bedroom]}}
  turn on the lights in the kitchen and in the bedroom: {expect: TurnOnLightsAreas, slots: {area: [kitchen, bedroom]}}
  turn on the bedroom and kitchen lights: {expect: TurnOnLightsAreas, slots: {area: [kitchen, bedroom]}}
  turn on the bedroom and the kitchen lights: {expect: TurnOnLightsAreas, slots: {area: [kitchen, bedroom]}}
  turn on the ceiling light: {expect: TurnOnEntity, slots: {entity: [light.ceiling]}}
  turn on the ecobee: {expect: TurnOnEntity, slots: {entity: [climate.ecobee]}}
  turn on the tv: {expect: TurnOnEntity, slots: {entity: [media_player.tv]}}
  turn on the garage lights: {expect: none}
  turn on the gar garage lights: {expect: none}
  turn on the garbage lights: {expect: none}
  turn on the oven: {expect: none}
  turn off the light on the stairs: {expect: none}
  turn off the lights on the stairs: {expect: none}
  turned off the lights on the stairs: {expect: none}

  # -- Lights
  set kitchen brightness to 13 percent: {expect: SetBrightness, slots: {area: [kitchen], number: 13}}
  set kitchen brightness to 15 percent: {expect: SetBrightness, slots: {area: [kitchen], number: 15}}
  set kitchen brightness to 19 percent: {expect: SetBrightness, slots: {area: [kitchen], number: 19}}
  set kitchen brightness to 30 percent: {expect: SetBrightness, slots: {area: [kitchen], number: 30}}
  set kitchen brightness to 50 percent: {expect: SetBrightness, slots: {area: [kitchen], number: 50}}
  set kitchen brightness to 90 percent: {expect: SetBrightness, slots: {area: [kitchen], number: 90}}
  set kitchen brightness to 100 percent: {expect: SetBrightness, slots: {area: [kitchen], number: 100}}
  set kitchen brightness to 150 percent: {expect: none}      # out of range
  set the kitchen brightness to 15 percent: {expect: SetBrightness, slots: {area: [kitchen], number: 15}}
  set the kitchen brightness to 19 percent: {expect: SetBrightness, slots: {area: [kitchen], number: 19}}
  set the kitchen brightness to 30 percent: {expect: SetBrightness, slots: {area: [kitchen], number: 30}}
  set the kitchen brightness to 50 percent: {expect: SetBrightness, slots: {area: [kitchen], number: 50}}
  set the kitchen brightness to 90 percent: {expect: SetBrightness, slots: {area: [kitchen], number: 90}}
  set the kitchen brightness to 100 percent: {expect: SetBrightness, slots: {area: [kitchen], number: 100}}
  set the kitchen brightness of 15 percent: {expect: SetBrightness, slots: {area: [kitchen], number: 15}}
  set the kitchen brightness at 13 percent: {expect: SetBrightness, slots: {area: [kitchen], number: 13}}
