  what is the temperature in the living room: {expect: GetTemperature, slots: {area: [living_room]}}
  whats the temperature in the living room: {expect: GetTemperature, slots: {area: [living_room]}}
  how warm is it in here: {expect: GetTemperature, slots: {}}

  # -- State: questions match, statements don't
  is the garage door open: {expect: IsEntityOpen, slots: {entity: [cover.garage_door]}}
  is the kitchen light on: {expect: AreLightsOn, slots: {area: [kitchen]}}
  are all the fans off in the kitchen: {expect: AreFansOff, slots: {area: [kitchen]}}
  are all the doors locked: {expect: AreDoorsLocked, slots: {}}
  the lights are on in the kitchen: {expect: none}
  the kitchen light is on: {expect: none}
  all the doors are locked: {expect: none}

  # -- Covers and fans
  open the curtains to 50 percent: {expect: SetPosition, slots: {entity: [cover.curtains], number: 50}}
  close the curtains to 15 percent: {expect: SetPosition, slots: {entity: [cover.curtains], number: 15}}
  close the curtains to 50 percent: {expect: SetPosition, slots: {entity: [cover.curtains], number: 50}}
  set the fan speed to 50 percent: {expect: SetFanSpeed, slots: {number: 50}}

  # -- Timers
  set a timer for 13 minutes: {expect: StartTimer, slots: {minutes: 13}}
