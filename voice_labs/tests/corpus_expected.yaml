  cancel all my timers: {expect: CancelAllTimers}
  cancel the 30 minute timer: {expect: CancelTimer, slots: {minutes: 30}}
  pause my timer: {expect: PauseTimer}
  how long is left on my 5 minute timer: {expect: TimerStatus, slots: {minutes: 5}}
  how long is is left on my 5 minute timer: {expect: TimerStatus, slots: {minutes: 5}}
  add 1 hour to the pizza timer: {expect: IncreaseTimer, slots: {timer: pizza, hours: 1}}
  decrease the kitchen timer by 5 minutes: {expect: DecreaseTimer, slots: {area: [kitchen], minutes: 5}}

  # -- Media
  pause: {expect: Pause}
