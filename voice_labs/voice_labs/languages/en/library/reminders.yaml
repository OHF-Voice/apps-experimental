# Reminders, and what's on the speaker's calendar.
title: Reminders and calendar
icon: mdi:calendar-clock

commands:
  my_calendar:
    title: What's on my calendar
    icon: mdi:calendar-account
    description: say what's on my calendar today
    # The rest of today on the speaker's own calendar (People page); where
    # nobody has one, this one.
    examples: ["what's on my calendar [today]", "what's on my schedule [today]", "what do i have today"]
    require: [[my calendar, my schedule, my agenda]]
    optional: [[what, whats, what's, what is], [on, in], [today, for today]]
    slots:
      entity: [calendar.family]
    mine: calendar
    action:
      - action: calendar.get_events
        target:
          entity_id: "{{ slots.entity }}"
        data:
          end_date_time: "{{ today_at('23:59:59').isoformat() }}"
        response_variable: found
      - variables:
          reply:
            events: "{{ found[slots.entity[0]].events | map(attribute='summary') | list }}"
      - stop: Read the calendar
        response_variable: reply
    response:
      done: >-
        {% set events = result.events or [] %}
        {% if not events %}There's nothing on your calendar for the rest of today.
        {% elif events | count == 1 %}You have {{ events[0] }} today.
        {% else %}You have {{ events[:-1] | join(', ') }} and {{ events[-1] }} today.{% endif %}
    needs:
      - Give each person their calendar (People page). Where nobody has one,
        it reads this one (calendar.family here).

  remind_me:
    title: Remind me
    icon: mdi:calendar-clock
    description: add a reminder
    # With a time, an event on the Voice Labs calendar that is said on this
    # satellite then: "remind me at 5 pm to call mom", "remind me to take the
    # bins out every tuesday at 7 pm", "remind me in 10 minutes to check the
    # oven". Without one, it goes on the to-do list.
    require: [[remind me]]
    wildcard:
      slot: reminder
      after: [remind me]
      to_end: true
      max_words: 16
    slots:
      entity: [todo.reminders]
    # The speaker's own to-do list, when anyone has one (People page).
    mine: todo_list
    timer: reminder
    verbosity: specific
    needs:
      - Point it at a to-do list (todo.reminders here) for reminders without a
        time. Where someone has a to-do list of their own (People page), theirs,
        and they must be recognized.

  cancel_reminder:
    title: Cancel a reminder
    icon: mdi:calendar-remove
    description: cancel a reminder
    # On the Voice Labs calendar, by what it is about, when it is, or both:
    # "cancel my reminder to call mom", "delete tomorrow's reminder", "cancel
    # the 5 pm reminder"; with one, the only one.
    require: [[cancel, delete, remove, forget], [reminder, reminders]]
    optional: [[my, the]]
    wildcard: {slot: reminder, after: [reminder, reminders], to_end: true, max_words: 12}
    combinations: [[], [reminder]]
    timer: cancel_reminder
    verbosity: specific

  reminder_status:
    title: Say the reminders
    icon: mdi:calendar-clock
    description: say which reminders are coming up
    examples: [what are my reminders, do i have any reminders]
    require: [[reminders, reminder]]
    optional: [[what, which], [are, is], [do i have, have i got, are there], [my, any]]
    exclude: [remind me, add, set]
    timer: reminder_status
