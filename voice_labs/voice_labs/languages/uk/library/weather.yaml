# Weather (Ukrainian), as the English library's weather.yaml.
title: Weather
icon: mdi:weather-partly-cloudy

commands:
  weather:
    title: What's the weather
    icon: mdi:weather-partly-cloudy
    description: дізнатися погоду
    examples: ["яка [сьогодні] погода", "яка погода [сьогодні]", "чи буде дощ [сьогодні]", "що з погодою",
               "який прогноз погоди"]
    require: [[погода, погоду, погоди, погодою, прогноз, дощ, дощу]]
    # Not a timer's time: "скільки часу залишилось".
    exclude: [залишилось, залишилося, таймер, будильник, скільки]
    home: weather
    response: >-
      {%- set words = {'clear-night': 'ясно', 'cloudy': 'хмарно', 'exceptional': 'незвичайна погода',
        'fog': 'туман', 'hail': 'град', 'lightning': 'гроза', 'lightning-rainy': 'гроза з дощем',
        'partlycloudy': 'мінлива хмарність', 'pouring': 'злива', 'rainy': 'дощ', 'snowy': 'сніг',
        'snowy-rainy': 'мокрий сніг', 'sunny': 'сонячно', 'windy': 'вітряно', 'windy-variant': 'вітряно і хмарно'} -%}
      {%- set state = states(slots.entity[0]) -%}
      {%- set t = state_attr(slots.entity[0], 'temperature') | float(0) | round | int -%}
      {%- set n = t | abs -%}
      Зараз {{ words.get(state, state) }}, {{ t }} {{ 'градус' if n % 10 == 1 and n % 100 != 11 else ('градуси'
        if n % 10 in [2, 3, 4] and n % 100 not in [12, 13, 14] else 'градусів') }}.
    needs:
      - Set the home's weather entity on the Settings page, or give it one of its
        own (its implied target).
