# Reminders and calendar (French), as the English library's reminders.yaml.
title: Reminders and calendar
icon: mdi:calendar-clock

commands:
  remind_me:
    title: Remember something
    icon: mdi:note-edit-outline
    description: se faire rappeler quelque chose
    # "Rappelle-moi d'arroser les plantes", "rappelle-moi de sortir les poubelles".
    require: [[rappelle moi, rappelez moi]]
    optional: [[de, d']]
    wildcard:
      slot: reminder
      after: [de, rappelle moi, rappelez moi]
      to_end: true
      max_words: 10
    # The speaker's own to-do list, when anyone has one (People page).
    slots:
      entity: [todo.reminders]
    mine: todo_list
    action:
      action: todo.add_item
      target:
        entity_id: "{{ slots.entity }}"
      data:
        item: "{{ slots.reminder }}"
    verbosity: specific
    response:
      done:
        brief: Je vous le rappellerai.
        specific: "Je vous rappellerai : {{ slots.reminder }}."
    needs:
      - Point it at a to-do list (todo.reminders here). Where someone has a
        to-do list of their own (People page), theirs, and they must be
        recognized.
