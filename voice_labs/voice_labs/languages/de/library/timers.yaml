# Timers (German), as the English library's timers.yaml: on the satellite that
# set them, with the Voice Labs integration in Home Assistant. A timer is
# picked out by:
#   timer_name  a running timer's name: "brich den Pizza Timer ab"
#   timer       free text, for naming a new timer, or matched loosely to the
#               running ones: "ein Timer namens Nudeln"
#   duration    "der 5 Minuten Timer"
# or it is the only one running. What they say is the language's (its speech
# module's timer sentences).
title: Timers and alarms
icon: mdi:timer-outline

commands:
  start_timer:
    title: Start a timer
    icon: mdi:timer-plus-outline
    description: einen Timer stellen
    # "Timer für 5 Minuten", "stell einen Pizza Timer auf 10 Minuten".
    require: [[timer], [minuten, minute, sekunden, sekunde, stunden, stunde]]
    optional: [[stelle, stell, starte, start, setze, setz, erstelle, mach], [für, auf], [namens, genannt]]
    wildcard: {slot: timer, before: [timer], after: [namens, genannt]}
    number: duration
    # Each said whole.
    combinations: [[duration], [duration, timer]]
    timer: start
    verbosity: specific

  set_alarm:
    title: Set an alarm
    icon: mdi:alarm
    description: einen Wecker stellen
    # A timer that rings at a clock time: "stell einen Wecker für halb sieben",
    # "weck mich um 7 Uhr", "Wecker auf viertel nach sechs". Without morgens
    # or abends it is the next time that comes round.
    require: [[wecker, weck mich, wecke mich]]
    optional: [[stelle, stell, setze, setz, mach], [für, um, auf]]
    wildcard: {slot: time, after: [für, um, auf], to_end: true, max_words: 7}
    timer: alarm
    verbosity: specific
    response:
      missing_time: Für wann soll ich den Wecker stellen?

  cancel_timer:
    title: Cancel a timer
    icon: mdi:timer-off-outline
    description: einen Timer abbrechen
    require: [[abbrechen, brich ... ab, stoppe, stopp, stoppen, lösche, lösch, löschen, beende, beenden], [timer]]
    optional: [[minuten, minute, sekunden, sekunde, stunden, stunde], [namens, genannt]]
    lists:
      timer_name: {list: running_timers}
    wildcard: {slot: timer, before: [timer], after: [namens, genannt]}
    number: {preset: duration}
    # Each said whole.
    combinations: [[], [timer_name], [timer], [duration]]
    timer: cancel
    verbosity: specific

  cancel_all_timers:
    title: Cancel every timer
    icon: mdi:timer-cancel-outline
    description: alle Timer abbrechen
    require: [[abbrechen, brich ... ab, stoppe, stopp, stoppen, lösche, lösch, löschen, beende, beenden], [alle], [timer]]
    timer: cancel_all
    verbosity: specific

  pause_timer:
    title: Pause a timer
    icon: mdi:timer-pause-outline
    description: einen Timer pausieren
    require: [[pausiere, pausier, pausieren, anhalten, halt ... an, halte ... an], [timer]]
    optional: [[minuten, minute, sekunden, sekunde, stunden, stunde], [namens, genannt]]
    lists:
      timer_name: {list: running_timers}
    wildcard: {slot: timer, before: [timer], after: [namens, genannt]}
    number: {preset: duration}
    # Each said whole.
    combinations: [[], [timer_name], [timer], [duration]]
    timer: pause
    verbosity: specific

  resume_timer:
    title: Resume a timer
    icon: mdi:timer-play-outline
    description: einen Timer fortsetzen
    require: [[fortsetzen, setze ... fort, setz ... fort, weiterlaufen, lass ... weiterlaufen], [timer]]
    optional: [[minuten, minute, sekunden, sekunde, stunden, stunde], [namens, genannt]]
    lists:
      timer_name: {list: running_timers}
    wildcard: {slot: timer, before: [timer], after: [namens, genannt]}
    number: {preset: duration}
    # Each said whole.
    combinations: [[], [timer_name], [timer], [duration]]
    timer: resume
    verbosity: specific

  timer_status:
    title: How long is left
    icon: mdi:timer-sand
    description: wissen, wie lange ein Timer noch läuft
    examples: ["wie viel zeit ist noch übrig", "wie lange läuft der timer noch"]
    require: [[wie lange, wie viel zeit], [noch, übrig]]
    optional: [[ist, läuft, hat], [auf], [timer], [minuten, minute, sekunden, sekunde, stunden, stunde], [namens, genannt]]
    lists:
      timer_name: {list: running_timers}
    wildcard: {slot: timer, before: [timer], after: [namens, genannt]}
    number: {preset: duration}
    # Each said whole.
    combinations: [[], [timer_name], [timer], [duration]]
    timer: status

  add_time:
    title: Add time to a timer
    icon: mdi:clock-plus-outline
    description: einem Timer Zeit hinzufügen
    # "Füge 5 Minuten zum Pizza Timer hinzu", "verlängere den Timer um 5 Minuten".
    require: [[füge, füg, hinzufügen, verlängere, verlänger, verlängern], [timer]]
    optional: [[zum, um], [hinzu], [minuten, minute, sekunden, sekunde, stunden, stunde], [namens, genannt]]
    lists:
      timer_name: {list: running_timers}
    wildcard: {slot: timer, before: [timer], after: [namens, genannt]}
    number: duration
    # Each said whole.
    combinations: [[duration], [timer_name, duration], [duration, timer]]
    timer: add
    verbosity: specific

  subtract_time:
    title: Take time off a timer
    icon: mdi:clock-minus-outline
    description: einem Timer Zeit abziehen
    # "Zieh 2 Minuten vom Timer ab", "verkürze den Pizza Timer um 2 Minuten".
    require: [[ziehe ... ab, zieh ... ab, abziehen, verkürze, verkürz, verkürzen, verringere, verringern, reduziere, reduzieren], [timer]]
    optional: [[vom, von, um], [minuten, minute, sekunden, sekunde, stunden, stunde], [namens, genannt]]
    lists:
      timer_name: {list: running_timers}
    wildcard: {slot: timer, before: [timer], after: [namens, genannt]}
    number: duration
    # Each said whole.
    combinations: [[duration], [timer_name, duration], [duration, timer]]
    timer: subtract
    verbosity: specific
