# Music (Dutch), as the English library's music.yaml: on Music Assistant's
# players, in versions for where it plays (the satellite's own player, a
# player by name, the players in an area or on a floor).
#
# "Speel …" searches Music Assistant for what was heard (free text to the end
# of the sentence, spelled from the transducer's transcript) and plays the
# closest match; "het album …", "nummers van …", "de afspeellijst …", "… van
# …" narrow it (the language's reading).
title: Music
icon: mdi:music

# What the versions add to a command (merged into them with <<).
shared:
  player: &player
    names:
      entity: {count: 1, domains: [media_player]}
    combinations: [[entity]]
    needs:
      - Add names for the players it may act on (Names page). A player must be
        a Music Assistant player.
  place: &place
    names:
      area: {count: 1}
      floor: {count: 1}
    combinations: [[area], [floor]]
    needs:
      - Add names for the areas and floors it may act in (Names page). It acts
        on the Music Assistant players there.

commands:
  play_music:
    title: Play music
    icon: mdi:music
    description: een artiest, album, nummer of afspeellijst afspelen
    require: [[speel, luister naar]]
    # Not "play": "wat speelt er", "speel het volgende nummer", "speel verder".
    exclude: [volgende, volgend, vorige, vorig, verder, speelt, gespeeld, opnieuw, vergelijkbaars]
    optional: [[af], [in, op, naar, bij], [de, het]]
    wildcard: {slot: query, after: [speel, luister naar], to_end: true, max_words: 8}
    music: play
    verbosity: specific
    variants:
      here:
        title: Play music on this satellite
      device:
        <<: *player
        title: Play music on a different device
        combinations: [[entity, query]]
      place:
        <<: *place
        title: Play music in an area or floor
        combinations: [[area, query], [floor, query]]

  add_to_queue:
    title: Add to the queue
    icon: mdi:playlist-plus
    description: iets aan de wachtrij toevoegen
    require: [[voeg, zet], [wachtrij]]
    optional: [[toe], [aan, in], [op, naar, bij], [de, het]]
    wildcard: {slot: query, after: [voeg, zet], before: [toe, aan, in], bounded: true, max_words: 6}
    music: add
    verbosity: specific
    variants:
      here:
        title: Add to the queue on this satellite
      device:
        <<: *player
        title: Add to the queue on a different device
        combinations: [[entity, query]]
      place:
        <<: *place
        title: Add to the queue in an area or floor
        combinations: [[area, query], [floor, query]]

  play_similar:
    title: Play music like it
    icon: mdi:radio
    description: meer muziek zoals deze afspelen
    require: [[vergelijkbaars, meer zoals dit, muziek zoals, nummers zoals, iets zoals, vergelijkbare muziek]]
    optional: [[speel], [in, op, naar, bij], [de, het]]
    wildcard: {slot: query, after: [muziek zoals, nummers zoals, iets zoals], to_end: true, max_words: 6}
    music: radio
    verbosity: specific
    # Like what plays there, or like what was said.
    variants:
      here:
        title: Play music like it on this satellite
        examples: ["speel meer zoals dit", "speel iets vergelijkbaars"]
        combinations: [[], [query]]
      device:
        <<: *player
        title: Play music like it on a different device
        combinations: [[entity], [entity, query]]
      place:
        <<: *place
        title: Play music like it in an area or floor
        combinations: [[area], [floor], [area, query], [floor, query]]

  pause_music:
    title: Pause the music
    icon: mdi:pause
    description: de muziek pauzeren
    require: [[pauze, pauzeer, pauzeren]]
    optional: [[muziek, nummer, afspelen], [in, op, bij], [de, het]]
    exclude: [timer]
    music: pause
    verbosity: beep
    variants:
      here:
        title: Pause the music on this satellite
        examples: ["pauze", "pauzeer de muziek", "muziek pauzeren"]
      device:
        <<: *player
        title: Pause the music on a different device
      place:
        <<: *place
        title: Pause the music in an area or floor

  resume_music:
    title: Resume the music
    icon: mdi:play
    description: de muziek hervatten
    require: [[hervat, hervatten, verder, ga verder, speel verder]]
    optional: [[muziek, afspelen], [in, op, bij], [de, het]]
    exclude: [timer]
    music: resume
    verbosity: beep
    variants:
      here:
        title: Resume the music on this satellite
        examples: ["hervat de muziek", "speel verder", "ga verder"]
      device:
        <<: *player
        title: Resume the music on a different device
      place:
        <<: *place
        title: Resume the music in an area or floor

  stop_music:
    title: Stop the music
    icon: mdi:stop
    description: de muziek stoppen
    require: [[stop, stoppen, uit], [muziek, afspelen, nummer]]
    optional: [[zet, doe], [in, op, bij], [de, het]]
    exclude: [timer]
    music: stop
    verbosity: beep
    variants:
      here:
        title: Stop the music on this satellite
      device:
        <<: *player
        title: Stop the music on a different device
      place:
        <<: *place
        title: Stop the music in an area or floor

  next_track:
    title: Next track
    icon: mdi:skip-next
    description: naar het volgende nummer gaan
    require: [[volgende, volgend, overslaan, sla ... over]]
    optional: [[nummer, liedje, track], [speel], [in, op, bij], [de, het]]
    music: next
    verbosity: beep
    variants:
      here:
        title: Next track on this satellite
        examples: ["volgend nummer", "volgende", "sla dit nummer over"]
      device:
        <<: *player
        title: Next track on a different device
      place:
        <<: *place
        title: Next track in an area or floor

  previous_track:
    title: Previous track
    icon: mdi:skip-previous
    description: naar het vorige nummer gaan
    require: [[vorige, vorig, terug]]
    optional: [[nummer, liedje, track], [speel, ga], [in, op, bij], [de, het]]
    music: previous
    verbosity: beep
    variants:
      here:
        title: Previous track on this satellite
        examples: ["vorig nummer", "vorige", "ga terug"]
      device:
        <<: *player
        title: Previous track on a different device
      place:
        <<: *place
        title: Previous track in an area or floor

  volume_up:
    title: Turn it up
    icon: mdi:volume-plus
    description: het geluid harder zetten
    require: [[harder, luider, volume omhoog, volume hoger]]
    optional: [[zet, draai, maak], [wat, een beetje, iets], [muziek, geluid], [in, op, bij], [de, het]]
    exclude: [licht, lichten, helderheid, verwarming, temperatuur]
    music: volume_up
    verbosity: beep
    variants:
      here:
        title: Turn it up on this satellite
        examples: [harder, zet harder, volume omhoog]
      device:
        <<: *player
        title: Turn it up on a different device
      place:
        <<: *place
        title: Turn it up in an area or floor

  volume_down:
    title: Turn it down
    icon: mdi:volume-minus
    description: het geluid zachter zetten
    require: [[zachter, stiller, volume omlaag, volume lager]]
    optional: [[zet, draai, maak], [wat, een beetje, iets], [muziek, geluid], [in, op, bij], [de, het]]
    exclude: [licht, lichten, helderheid, verwarming, temperatuur]
    music: volume_down
    verbosity: beep
    variants:
      here:
        title: Turn it down on this satellite
        examples: [zachter, zet zachter, volume omlaag]
      device:
        <<: *player
        title: Turn it down on a different device
      place:
        <<: *place
        title: Turn it down in an area or floor

  set_volume:
    title: Set the volume
    icon: mdi:volume-equal
    description: het volume instellen
    require: [[volume]]
    optional: [[zet, verander, maak], [procent], [in, op, bij], [de, het]]
    number: percentage
    music: volume_set
    verbosity: beep
    variants:
      here:
        title: Set the volume on this satellite
      device:
        <<: *player
        title: Set the volume on a different device
        combinations: [[entity, percentage]]
      place:
        <<: *place
        title: Set the volume in an area or floor
        combinations: [[area, percentage], [floor, percentage]]

  mute_music:
    title: Mute
    icon: mdi:volume-off
    description: het geluid dempen
    require: [[dempen, demp, geluid uit, mute]]
    optional: [[zet], [muziek], [in, op, bij], [de, het]]
    music: mute
    verbosity: beep
    variants:
      here:
        title: Mute this satellite
        examples: ["dempen", "geluid uit"]
      device:
        <<: *player
        title: Mute a different device
      place:
        <<: *place
        title: Mute an area or floor

  unmute_music:
    title: Unmute
    icon: mdi:volume-high
    description: het geluid weer aanzetten
    require: [[geluid aan, dempen opheffen, unmute]]
    optional: [[zet, weer], [in, op, bij], [de, het]]
    music: unmute
    verbosity: beep
    variants:
      here:
        title: Unmute this satellite
        examples: ["geluid [weer] aan", "dempen opheffen"]
      device:
        <<: *player
        title: Unmute a different device
      place:
        <<: *place
        title: Unmute an area or floor

  shuffle_on:
    title: Shuffle
    icon: mdi:shuffle-variant
    description: de muziek willekeurig afspelen
    require: [[shuffle, willekeurig, door elkaar]]
    optional: [[aan, muziek, nummers, afspeellijst], [speel, zet], [in, op, bij], [de, het]]
    exclude: [uit, niet, stop]
    music: shuffle_on
    verbosity: beep
    variants:
      here:
        title: Shuffle on this satellite
        examples: ["shuffle aan", "speel willekeurig", "speel door elkaar"]
      device:
        <<: *player
        title: Shuffle on a different device
      place:
        <<: *place
        title: Shuffle in an area or floor

  shuffle_off:
    title: Stop shuffling
    icon: mdi:shuffle-disabled
    description: niet meer willekeurig afspelen
    require: [[shuffle, willekeurig], [uit, stop, niet meer]]
    optional: [[zet, speel], [in, op, bij], [de, het]]
    music: shuffle_off
    verbosity: beep
    variants:
      here:
        title: Stop shuffling on this satellite
        examples: ["shuffle uit", "niet meer willekeurig"]
      device:
        <<: *player
        title: Stop shuffling on a different device
      place:
        <<: *place
        title: Stop shuffling in an area or floor

  repeat_one:
    title: Repeat this song
    icon: mdi:repeat-once
    description: dit nummer herhalen
    require: [[herhaal, herhalen, opnieuw, nog een keer], [dit nummer, dit liedje, dit lied]]
    optional: [[speel], [in, op, bij], [de, het]]
    music: repeat_one
    verbosity: beep
    variants:
      here:
        title: Repeat this song on this satellite
        examples: [herhaal dit nummer, speel dit nummer nog een keer]
      device:
        <<: *player
        title: Repeat the song on a different device
      place:
        <<: *place
        title: Repeat the song in an area or floor

  repeat_all:
    title: Repeat
    icon: mdi:repeat
    description: de muziek herhalen
    require: [[herhaal, herhalen, herhaling]]
    optional: [[alles, alle, aan, muziek, afspeellijst, album], [zet], [in, op, bij], [de, het]]
    exclude: [uit, stop, niet, nummer, liedje, dit]
    music: repeat_all
    verbosity: beep
    variants:
      here:
        title: Repeat on this satellite
        examples: ["herhaal alles", "herhalen aan"]
      device:
        <<: *player
        title: Repeat on a different device
      place:
        <<: *place
        title: Repeat in an area or floor

  repeat_off:
    title: Stop repeating
    icon: mdi:repeat-off
    description: niet meer herhalen
    require: [[herhalen, herhaling, herhaal], [uit, stop, niet meer]]
    optional: [[zet], [in, op, bij], [de, het]]
    music: repeat_off
    verbosity: beep
    variants:
      here:
        title: Stop repeating on this satellite
        examples: ["herhalen uit", "niet meer herhalen"]
      device:
        <<: *player
        title: Stop repeating on a different device
      place:
        <<: *place
        title: Stop repeating in an area or floor

  # Where it is told to go: from what is playing here (or the one player
  # playing anywhere) to the device, area or floor named, queue and all.
  move_music:
    title: Move the music
    icon: mdi:cast-audio
    description: de muziek naar een andere kamer of speaker verplaatsen
    require: [[verplaats, stuur, breng], [muziek, nummer, afspeellijst]]
    optional: [[naar, op, in, bij], [de, het]]
    music: move
    verbosity: specific
    variants:
      device:
        <<: *player
        title: Move the music to a different device
        description: de muziek naar een andere speaker verplaatsen
      place:
        <<: *place
        title: Move the music to an area or floor
        description: de muziek naar een andere kamer verplaatsen

  whats_playing:
    title: What's playing
    icon: mdi:playlist-music
    description: weten wat er speelt
    require: [[wat speelt er, wat is dit, welk nummer, welk liedje, wie zingt, wie is dit, wat hoor ik]]
    optional: [[nu, hier, er], [is dit, dit], [in, op, bij], [de, het]]
    music: status
    variants:
      here:
        title: What's playing on this satellite
        examples: ["wat speelt er [nu]", "welk nummer is dit", "wie zingt dit"]
      device:
        <<: *player
        title: What's playing on a different device
      place:
        <<: *place
        title: What's playing in an area or floor
