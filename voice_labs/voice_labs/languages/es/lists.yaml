# The value lists every home has in Spanish (Pack.lists): a command's value
# slot uses one by name ({list: colors}). A home's own list by the same name,
# in Spanish, takes its place (the Names page). Values are what Home Assistant
# gets: CSS color names, cover device classes, HVAC modes.
colors:
  red: [rojo, roja, rojas]
  orange: [naranja]
  yellow: [amarillo, amarilla, amarillas]
  green: [verde, verdes]
  blue: [azul, azules]
  purple: [morado, morada, moradas, lila, violeta]
  pink: [rosa, rosado, rosada]
  white: [blanco, blanca, blancas]
  turquoise: [turquesa]
  magenta: [magenta]
on_off:
  "on": [encendido, encendida, prendido, prendida, activado, activada]
  "off": [apagado, apagada, desactivado, desactivada]
cover_classes:
  awning: [toldo, toldos]
  blind: [veneciana, venecianas, persiana veneciana, persianas venecianas]
  curtain: [cortina, cortinas]
  door: [puerta, puertas]
  garage: [puerta del garaje, puertas del garaje, puerta de garaje, puertas de garaje]
  gate: [verja, verjas, portón, portones, cancela]
  shade: [estor, estores]
  shutter: [persiana, persianas]
  window: [ventana, ventanas]
open_closed:
  open: [abierta, abiertas, abierto, abiertos]
  closed: [cerrada, cerradas, cerrado, cerrados]
locked_unlocked:
  locked: [bloqueada, bloqueado, cerrada con llave, cerrado con llave, con llave]
  unlocked: [desbloqueada, desbloqueado, sin llave]
hvac_modes:
  "off": [apagado]
  heat: [calefacción, calor, calentar]
  cool: [frío, enfriar, aire acondicionado]
  heat_cool: [frío y calor]
  auto: [automático, auto]
  dry: [deshumidificar, seco]
  fan_only: [ventilador, solo ventilador]
