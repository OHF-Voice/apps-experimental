# The value lists every home has in Russian (Pack.lists): a command's value
# slot uses one by name ({list: colors}). A home's own list by the same name,
# in Russian, takes its place (the Names page). Values are what Home Assistant
# gets: CSS color names, cover device classes, HVAC modes.
colors:
  red: [красный, красным, красного, красную, красное]
  orange: [оранжевый, оранжевым, оранжевого, оранжевую, оранжевое]
  yellow: [желтый, желтым, желтого, желтую, желтое]
  green: [зеленый, зеленым, зеленого, зеленую, зеленое]
  blue: [синий, синим, синего, синюю, синее, голубой, голубым, голубую]
  purple: [фиолетовый, фиолетовым, фиолетового, фиолетовую, сиреневый]
  pink: [розовый, розовым, розового, розовую, розовое]
  white: [белый, белым, белого, белую, белое]
  turquoise: [бирюзовый, бирюзовым, бирюзового, бирюзовую, бирюзовое]
  magenta: [пурпурный, пурпурным, пурпурного, пурпурную, пурпурное]
on_off:
  "on": [включен, включена, включено, включены]
  "off": [выключен, выключена, выключено, выключены]
cover_classes:
  awning: [маркизу, маркиза, маркизы, тент, навес]
  blind: [жалюзи]
  curtain: [шторы, штору, штора, занавески, занавеску, занавеска, гардины, портьеры]
  door: [дверь, двери]
  garage: [гаражные ворота, гаражную дверь, ворота гаража, дверь гаража]
  gate: [ворота, калитку, калитка, калитки]
  shade: [рулонные шторы, рулонную штору, рулонная штора]
  shutter: [рольставни, рольставню, рольставня, роллеты, ставни, ставню]
  window: [окно, окна]
open_closed:
  open: [открыт, открыта, открыто, открыты]
  closed: [закрыт, закрыта, закрыто, закрыты]
locked_unlocked:
  locked: [заперт, заперта, заперто, заперты, закрыт на ключ, закрыта на ключ, закрыто на ключ, закрыты на ключ, заблокирован, заблокирована]
  unlocked: [отперт, отперта, отперто, отперты, разблокирован, разблокирована]
hvac_modes:
  "off": [выключено, выкл]
  heat: [обогрев, нагрев, обогрева]
  cool: [охлаждение, охлаждения, кондиционер]
  heat_cool: [обогрев и охлаждение]
  auto: [авто, автоматический, автоматическом]
  dry: [осушение, осушения]
  fan_only: [вентиляция, вентилятор]
