---
tools:
  - type: function
    function:
      name: HassNevermind
      description: Cancels or ignores the command.

  # date and time
  - type: function
    function:
      name: HassGetCurrentTime
      description: Get the current time.
  - type: function
    function:
      name: HassGetCurrentDate
      description: Get the current date.

  # timers
  - type: function
    function:
      name: start_timer
      description: Set a timer with a duration and optional name
      parameters:
        type: object
        properties:
          total_seconds:
            type: integer
            minimum: 0
          name:
            type: string
        anyOf:
          - required:
              - total_seconds
          - required:
              - total_seconds
              - name
  - type: function
    function:
      name: HassTimerStatus
      description: Get the time remaining for timers
  - type: function
    function:
      name: control_timer
      description: Pause, resume, or cancel an active timer, optionally by name or duration it was started with
      parameters:
        type: object
        properties:
          action:
            type: string
            enum:
              - pause
              - resume
              - cancel
              - cancel_all
          name:
            type: string
          total_seconds:
            type: integer
            minimum: 0
        required:
          - action
  - type: function
    function:
      name: update_timer
      description: Add or remove time from an active timer, optionally by name
      parameters:
        type: object
        properties:
          action:
            type: string
            enum:
              - add
              - remove
          name:
            type: string
          # NOTE: Doesn't seem to work
          # total_start_seconds:
          #   type: integer
          #   minimum: 0
          #   description: Duration that the timer was started with
          total_update_seconds:
            type: integer
            minimum: 0
        required:
          - action
          - total_update_seconds

  # media
  - type: function
    function:
      name: control_media
      description: Pause, resume, or skip track on media player
      parameters:
        type: object
        properties:
          action:
            type: string
            enum:
              - pause
              - resume
              - next
        required:
          - action

  # weather and temperature
  - type: function
    function:
      name: HassGetWeather
      description: Get the current weather forecast
  - type: function
    function:
      name: HassClimateGetTemperature
      description: Get the current temperature of the thermostat

  # todo and shopping list
  - type: function
    function:
      name: HassListAddItem
      description: Add a task to a todo list
      parameters:
        type: object
        properties:
          item:
            type: string
          name:
            type: string
            description: Name of the todo list
        anyOf:
          - required:
              - item
              - name
  - type: function
    function:
      name: HassListCompleteItem
      description: Mark a task as completed on a todo list
      parameters:
        type: object
        properties:
          item:
            type: string
          name:
            type: string
            description: Name of the todo list
        anyOf:
          - required:
              - item
              - name
  - type: function
    function:
      name: HassShoppingListAddItem
      description: Add an item to the shopping list
      parameters:
        type: object
        properties:
          item:
            type: string
        anyOf:
          - required:
              - item
